<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiến Trúc Sư Nhí - Luxury Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3498db; --bg: #2c3e50; }
        body { margin: 0; font-family: 'Baloo 2', cursive; background: var(--bg); overflow: hidden; }
        .main-container { display: flex; height: 100vh; }

        /* --- PHÒNG 3D ISOMETRIC --- */
        .house-area { 
            flex: 3; position: relative; 
            background: radial-gradient(circle, #576574, #222f3e);
            display: flex; justify-content: center; align-items: center;
        }
        .room-3d {
            width: 750px; height: 480px;
            background: #f8f9fa; position: relative;
            transform: perspective(1200px) rotateX(8deg);
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            border: 12px solid #fff; border-radius: 4px;
        }
        .room-3d::before { /* Tường bên trái */
            content: ""; position: absolute; top: 0; left: 0; width: 40%; height: 100%;
            background: rgba(0,0,0,0.04); border-right: 1px solid rgba(0,0,0,0.05);
        }
        .room-floor {
            position: absolute; bottom: 0; width: 100%; height: 140px;
            background: repeating-linear-gradient(90deg, #dcdde1, #dcdde1 30px, #f5f6fa 30px, #f5f6fa 60px);
            border-top: 3px solid #718093;
        }

        /* --- ĐỒ VẬT --- */
        .furniture-item {
            position: absolute; cursor: grab; font-size: 4.5rem;
            user-select: none; z-index: 10;
            filter: drop-shadow(8px 12px 10px rgba(0,0,0,0.3));
            transition: transform 0.1s;
        }
        .furniture-item:active { cursor: grabbing; transform: scale(1.15); z-index: 999; }

        /* --- UI PANEL --- */
        .ui-panel {
            flex: 1; background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px); display: flex; flex-direction: column;
            padding: 20px; border-left: 6px solid var(--primary); z-index: 1000;
        }
        .header-ui { text-align: center; margin-bottom: 15px; }
        .score-box { 
            background: linear-gradient(45deg, #f1c40f, #f39c12); color: white;
            padding: 8px 25px; border-radius: 50px; font-weight: 800; font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
        }
        .tabs { display: flex; gap: 8px; margin: 15px 0; }
        .tab-btn { 
            flex: 1; padding: 10px; border: none; border-radius: 12px; 
            cursor: pointer; font-weight: 700; background: #eee; transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; transform: translateY(-3px); }

        .items-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 15px; overflow-y: auto; padding: 5px; flex: 1;
        }
        .shop-item {
            background: #fff; border-radius: 15px; padding: 12px;
            text-align: center; box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            border: 2px solid #f1f2f6; transition: 0.2s;
        }
        .shop-item:hover { border-color: var(--primary); transform: translateY(-3px); }
        .shop-item .icon { font-size: 2.8rem; display: block; margin-bottom: 8px; }
        .shop-item .name { font-weight: 700; font-size: 0.85rem; display: block; min-height: 40px; }
        .shop-item .price { color: #e67e22; font-weight: 800; }
        .shop-item button { 
            width: 100%; margin-top: 8px; border: none; padding: 8px;
            border-radius: 8px; background: #2ecc71; color: white; font-weight: 800; cursor: pointer;
        }
        .inventory-item { background: #f8f9fa; border: 2px dashed #3498db; }

        .action-btns { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .save-btn { 
            padding: 15px; background: #e74c3c; color: white; border: none; 
            border-radius: 12px; font-weight: 800; font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 5px 0 #c0392b;
        }
        .save-btn:active { transform: translateY(4px); box-shadow: none; }
        .hint-text { font-size: 0.8rem; color: #7f8c8d; text-align: center; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="house-area">
        <div class="room-3d" id="room">
            <div class="room-floor"></div>
        </div>
    </div>

    <div class="ui-panel">
        <div class="header-ui">
            <h1 style="margin:0; color:var(--primary);">🏰 ROYAL HOME</h1>
            <div class="score-box">💎 <span id="user-score">0</span></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-shop" onclick="switchTab('shop')">🛒 Cửa Hàng</button>
            <button class="tab-btn" id="tab-inv" onclick="switchTab('inventory')">🎒 Kho Đồ</button>
        </div>

        <div id="shop-list" class="items-grid"></div>
        <div id="inventory-list" class="items-grid" style="display:none;"></div>

        <div class="action-btns">
            <button class="save-btn" onclick="saveHouse()">💾 LƯU NGÔI NHÀ</button>
            <button onclick="window.location.href='index.html'" style="background:none; border:none; color:#95a5a6; cursor:pointer; font-weight:bold;">🔙 Trở về Hành Tinh</button>
            <div class="hint-text">Chuột phải vào đồ vật để thu hồi về kho</div>
        </div>
    </div>
</div>

<script>
    let myScore = 0;
    let myInventory = [];
    let shopData = [];
    let placedItems = [];

    async function init() {
        try {
            const res = await fetch('/api/house/info');
            if(res.status === 401) window.location.href = 'login.html';
            const data = await res.json();
            myScore = data.score;
            myInventory = data.inventory || [];
            shopData = data.shopItems;
            updateUI();
            if(data.houseData) {
                data.houseData.forEach(item => placeItemVisual(item.id, item.x, item.y, item.uniqueId));
            }
        } catch(e) { console.error(e); }
    }

    function updateUI() {
        document.getElementById('user-score').textContent = myScore.toLocaleString();
        
        // Render Shop
        const shopEl = document.getElementById('shop-list');
        shopEl.innerHTML = '';
        shopData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <span class="icon">${item.icon}</span>
                <span class="name">${item.name}</span>
                <div class="price">${item.price} 💎</div>
                <button onclick="buyItem('${item.id}')">Mua</button>
            `;
            shopEl.appendChild(div);
        });

        // Render Inventory (Kho đồ có đếm số lượng)
        const invEl = document.getElementById('inventory-list');
        invEl.innerHTML = '';
        const counts = {};
        myInventory.forEach(id => counts[id] = (counts[id] || 0) + 1);

        for (const [id, count] of Object.entries(counts)) {
            const item = shopData.find(i => i.id === id);
            if(item) {
                const div = document.createElement('div');
                div.className = 'shop-item inventory-item';
                div.innerHTML = `
                    <span class="icon">${item.icon}</span>
                    <span class="name">${item.name} (x${count})</span>
                    <button onclick="spawnItem('${id}')" style="background:#3498db">Đặt ra</button>
                `;
                invEl.appendChild(div);
            }
        }
    }

    function switchTab(tab) {
        document.getElementById('shop-list').style.display = tab === 'shop' ? 'grid' : 'none';
        document.getElementById('inventory-list').style.display = tab === 'inventory' ? 'grid' : 'none';
        document.getElementById('tab-shop').classList.toggle('active', tab === 'shop');
        document.getElementById('tab-inv').classList.toggle('active', tab === 'inventory');
    }

    async function buyItem(id) {
        try {
            const res = await fetch('/api/house/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ itemId: id })
            });
            const d = await res.json();
            if(res.ok) {
                myScore = d.newScore;
                myInventory.push(id);
                updateUI();
            } else alert(d.message);
        } catch(e) { console.error(e); }
    }

    function spawnItem(itemId) {
        const idx = myInventory.indexOf(itemId);
        if(idx > -1) {
            myInventory.splice(idx, 1); // Xóa khỏi kho đồ client
            updateUI();
            placeItemVisual(itemId, 300, 200, Date.now()); 
        }
    }

    function removeItem(uniqueId, itemId) {
        const el = document.getElementById(uniqueId);
        if (el) el.remove();
        placedItems = placedItems.filter(item => item.uniqueId != uniqueId);
        myInventory.push(itemId); // Trả lại kho
        updateUI();
    }

    function placeItemVisual(itemId, x, y, uniqueId) {
        const itemInfo = shopData.find(i => i.id === itemId);
        if(!itemInfo) return;

        const el = document.createElement('div');
        el.className = 'furniture-item';
        el.textContent = itemInfo.icon;
        el.id = uniqueId;
        el.style.left = x + 'px';
        el.style.top = y + 'px';

        el.oncontextmenu = (e) => {
            e.preventDefault();
            removeItem(uniqueId, itemId);
        };

        el.onmousedown = dragMouseDown;
        el.ontouchstart = dragMouseDown;

        document.getElementById('room').appendChild(el);
        placedItems.push({ uniqueId, itemId, element: el });
    }

    function dragMouseDown(e) {
        e.preventDefault();
        let elm = e.target;
        let pos3 = e.clientX || e.touches[0].clientX;
        let pos4 = e.clientY || e.touches[0].clientY;

        document.onmouseup = () => document.onmousemove = null;
        document.ontouchend = () => document.ontouchmove = null;

        document.onmousemove = document.ontouchmove = (e) => {
            let cx = e.clientX || (e.touches ? e.touches[0].clientX : pos3);
            let cy = e.clientY || (e.touches ? e.touches[0].clientY : pos4);
            let p1 = pos3 - cx; let p2 = pos4 - cy;
            pos3 = cx; pos4 = cy;

            let nt = elm.offsetTop - p2;
            let nl = elm.offsetLeft - p1;

            const room = document.getElementById('room');
            if(nt < 0) nt = 0; if(nl < 0) nl = 0;
            if(nt > room.clientHeight - 80) nt = room.clientHeight - 80;
            if(nl > room.clientWidth - 80) nl = room.clientWidth - 80;

            elm.style.top = nt + "px";
            elm.style.left = nl + "px";
        };
    }

    async function saveHouse() {
        const itemsToSave = placedItems.map(obj => ({
            id: obj.itemId, uniqueId: obj.uniqueId,
            x: obj.element.offsetLeft, y: obj.element.offsetTop
        }));

        try {
            const res = await fetch('/api/house/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ items: itemsToSave, inventory: myInventory })
            });
            const result = await res.json();
            alert("✨ " + result.message);
        } catch(e) { alert("Lỗi kết nối!"); }
    }

    init();
</script>
</body>
</html>
