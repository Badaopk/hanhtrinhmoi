<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Biệt Thự 3D - Minecraft Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Baloo 2', cursive; background: #87CEEB; }
        
        /* Tâm ngắm (Crosshair) */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 24px; height: 24px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 100;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.9); box-shadow: 0 0 2px #000; }
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }

        /* Màn hình chờ (Pause Menu) */
        #blocker {
            position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.65);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; flex-direction: column;
        }
        #instructions {
            text-align: center; color: white; cursor: pointer;
            background: rgba(255,255,255,0.15); padding: 30px 50px; border-radius: 20px;
            backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        #instructions h1 { font-size: 3.5rem; margin: 0 0 10px 0; color: #f1c40f; text-shadow: 3px 3px 0 #d35400; }
        #instructions p { font-size: 1.3rem; margin: 5px 0; font-weight: bold; }
        .play-btn {
            background: #2ecc71; color: white; border: none; padding: 15px 50px; font-size: 1.8rem;
            font-family: 'Baloo 2'; font-weight: 800; border-radius: 50px; cursor: pointer;
            margin-top: 25px; box-shadow: 0 6px 0 #27ae60; transition: 0.2s;
        }
        .play-btn:active { transform: translateY(6px); box-shadow: none; }

        /* Giao diện Shop & Inventory */
        #ui-panel {
            position: absolute; right: 20px; top: 20px; bottom: 20px; width: 380px;
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 20px;
            box-shadow: -5px 0 25px rgba(0,0,0,0.4); display: flex; flex-direction: column;
            pointer-events: auto; box-sizing: border-box;
        }
        .score-badge { background:#f1c40f; color:#d35400; padding:10px 20px; border-radius:30px; font-weight:900; font-size: 1.6rem; text-align: center; margin-bottom: 15px; border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .tab-container { display:flex; gap:5px; margin-bottom:15px; background: #eee; padding: 5px; border-radius: 12px; }
        .tab-btn { flex:1; padding:12px; cursor:pointer; font-weight: 800; background:transparent; color:#7f8c8d; border:none; border-radius:10px; font-family: inherit; font-size: 1.2rem; transition: 0.2s; }
        .tab-btn.active { background: #3498db; color: white; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow-y: auto; flex: 1; padding: 5px; }
        .item-card { background: #fff; padding: 15px 10px; border-radius: 15px; text-align: center; border: 3px solid #eee; cursor: pointer; transition:0.2s; position: relative; }
        .item-card:hover { border-color: #3498db; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .item-card.selected { border-color: #2ecc71; background: #e8f8f5; box-shadow: 0 0 15px rgba(46, 204, 113, 0.5); transform: scale(1.02); }
        
        .save-btn { padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 15px; font-weight: 800; font-size: 1.3rem; cursor: pointer; margin-top: 15px; font-family: inherit; box-shadow: 0 5px 0 #c0392b; transition: 0.2s;}
        .save-btn:active { transform: translateY(5px); box-shadow: none; }
        
        .back-btn { padding: 12px; background: #95a5a6; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: inherit; font-size: 1.1rem; box-shadow: 0 4px 0 #7f8c8d;}
        .back-btn:active { transform: translateY(4px); box-shadow: none; }

        .notif { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 15px 30px; border-radius: 30px; border: 3px solid #2ecc71; font-weight: 800; font-size: 1.2rem; color: #27ae60; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: dropDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes dropDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }

        /* Thông báo vật phẩm đang cầm */
        #holding-item {
            position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #f1c40f;
            padding: 10px 25px; border-radius: 15px; font-size: 1.5rem; display: none; z-index: 100;
            border: 2px solid #f1c40f; font-weight: bold; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="holding-item">Đang cầm: 📦 Khối gỗ</div>

    <div id="blocker">
        <div id="instructions">
            <h1>🌍 HÀNH TINH 3D</h1>
            <p><b>W, A, S, D</b> = Di chuyển</p>
            <p><b>SPACE</b> = Nhảy lên</p>
            <p><b>Chuột Trái</b> = Đặt Gạch / Xây Đồ</p>
            <p><b>Chuột Phải</b> = Đập vỡ / Cất vào Ba lô</p>
            <p style="color:#f1c40f; margin-top:20px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;">👉 <b>Nhấn phím ESC</b> để mở Cửa hàng / Ba lô</p>
            <button class="play-btn" id="play-btn">▶️ CHƠI NGAY</button>
        </div>

        <div id="ui-panel">
            <div class="score-badge">💎 <span id="score">0</span></div>
            <div class="tab-container">
                <button id="tab-shop" class="tab-btn active" onclick="switchTab('shop')">Cửa Hàng</button>
                <button id="tab-inv" class="tab-btn" onclick="switchTab('inv')">Ba Lô</button>
            </div>
            <div id="grid-shop" class="grid-container"></div>
            <div id="grid-inv" class="grid-container" style="display:none"></div>
            <button class="save-btn" onclick="saveHouse()">💾 LƯU THẾ GIỚI</button>
            <button class="back-btn" onclick="window.location.href='index.html'">Thoát về Trang Chủ</button>
        </div>
    </div>

<script>
    // ==========================================
    // --- 1. KHAI BÁO BIẾN ---
    // ==========================================
    const socket = io();
    let houseState = { score: 0, inventory: [], items: [] };
    let shopItems = [];
    let selectedItemId = null; 

    const BLOCK_SIZE = 50; 
    let camera, scene, renderer, controls;
    
    // Mảng phân loại vật thể
    const objects = []; // Đồ tĩnh (Gạch, Sàn, Đồ đạc)
    const animatedObjects = []; // Thú cưng (Biết đi)

    let raycaster;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let canJump = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    init3D();
    animate();
    loadDataFromServer();

    // ==========================================
    // --- 2. KHỞI TẠO MÔI TRƯỜNG 3D ---
    // ==========================================
    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 0, 1500); 

        // Ánh sáng toàn cảnh
        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        light.position.set(0.5, 1, 0.75);
        scene.add(light);
        
        // Ánh sáng mặt trời
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(100, 200, 50);
        scene.add(dirLight);

        // Camera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.y = 100; 

        controls = new THREE.PointerLockControls(camera, document.body);
        
        const blocker = document.getElementById('blocker');
        document.getElementById('play-btn').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
        controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });
        scene.add(controls.getObject());

        // Phím bấm
        const onKeyDown = (event) => {
            switch(event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if(canJump) velocity.y += 350; canJump = false; break;
            }
        };
        const onKeyUp = (event) => {
            switch(event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        };
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        raycaster = new THREE.Raycaster();
        document.addEventListener('mousedown', onMouseClick);

        // Vẽ NỀN MÓNG CỎ (Mặt phẳng khổng lồ)
        const floorGeometry = new THREE.PlaneGeometry(2000, 2000);
        floorGeometry.rotateX(-Math.PI / 2);
        
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2ecc71'; ctx.fillRect(0,0,128,128); 
        ctx.fillStyle = '#27ae60'; ctx.fillRect(0,0,64,64); ctx.fillRect(64,64,64,64); 
        
        const floorTexture = new THREE.CanvasTexture(canvas);
        floorTexture.wrapS = THREE.RepeatWrapping; floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(2000/BLOCK_SIZE, 2000/BLOCK_SIZE);
        
        const floorMaterial = new THREE.MeshLambertMaterial({ map: floorTexture });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        scene.add(floor);
        objects.push(floor); // Cho phép đặt gạch lên sàn

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ==========================================
    // --- 3. NHÀ MÁY LẮP RÁP 3D (ĐÃ NÂNG CẤP) ---
    // ==========================================
    
    // Gạch Xây Dựng (Sơn tường, Sàn nhà, Khối đặc biệt...)
    function createBlockMaterial(hexColor) {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = hexColor || '#bdc3c7';
        ctx.fillRect(0, 0, 64, 64);
        ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 4; ctx.strokeRect(0,0,64,64); // Viền gạch
        return new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(canvas) });
    }

    // Dựng 3D Nội thất / Thú cưng theo ID nhận được
    function create3DModel(itemInfo) {
        const group = new THREE.Group();
        const id = itemInfo.id.toLowerCase();

        // Cỗ máy tạc khối con
        function addPart(w, h, d, color, x, y, z) {
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshLambertMaterial({ color: color })
            );
            mesh.position.set(x, y, z);
            // Gắn nhãn để khi click trúng mảnh nhỏ, code biết phải đập vỡ toàn bộ Group
            mesh.userData = { isPart: true, parentGroup: group }; 
            group.add(mesh);
            return mesh;
        }

        // TỰ ĐỘNG TẠO HÌNH TỪ DANH SÁCH MỚI CỦA BẠN
        if (id.includes('bed')) {
            addPart(46, 10, 46, 0x8b4513, 0, 5, 0); // Khung giường
            addPart(42, 6, 42, 0xffffff, 0, 13, 0); // Đệm
            addPart(36, 4, 10, 0x3498db, 0, 18, -14); // Gối
            if (id.includes('bunk')) {
                // Giường tầng
                addPart(4, 40, 4, 0x8b4513, -21, 25, -21); addPart(4, 40, 4, 0x8b4513, 21, 25, -21);
                addPart(4, 40, 4, 0x8b4513, -21, 25, 21); addPart(4, 40, 4, 0x8b4513, 21, 25, 21);
                addPart(46, 4, 46, 0x8b4513, 0, 45, 0); // Giường trên
                addPart(42, 4, 42, 0xffffff, 0, 49, 0); // Nệm trên
            }
        } 
        else if (id.includes('sofa')) {
            addPart(46, 15, 30, 0xe74c3c, 0, 7.5, 5); // Đệm
            addPart(46, 25, 10, 0xc0392b, 0, 12.5, -15); // Lưng
            addPart(10, 20, 40, 0xc0392b, -23, 10, 0); // Tay trái
            addPart(10, 20, 40, 0xc0392b, 23, 10, 0); // Tay phải
        }
        else if (id.includes('wardrobe')) {
            addPart(40, 60, 20, 0x8b4513, 0, 30, 0); // Tủ
            addPart(18, 56, 2, 0xd35400, -10, 30, 10); // Cửa
            addPart(18, 56, 2, 0xd35400, 10, 30, 10);
            addPart(2, 6, 2, 0xf1c40f, -2, 30, 12); // Tay nắm
            addPart(2, 6, 2, 0xf1c40f, 2, 30, 12);
        }
        else if (id.includes('bookshelf')) {
            addPart(40, 50, 15, 0x8b4513, 0, 25, 0); // Khung
            addPart(36, 15, 10, 0x3498db, -5, 15, 5); // Sách
            addPart(36, 15, 10, 0xe74c3c, 5, 40, 5);
        }
        else if (id.includes('table') || id.includes('desk')) {
            addPart(40, 4, 30, 0xd35400, 0, 25, 0); // Mặt bàn
            addPart(4, 25, 4, 0x8b4513, -15, 12.5, -10); // 4 Chân
            addPart(4, 25, 4, 0x8b4513, 15, 12.5, -10); 
            addPart(4, 25, 4, 0x8b4513, -15, 12.5, 10); 
            addPart(4, 25, 4, 0x8b4513, 15, 12.5, 10); 
        }
        else if (id.includes('chair')) {
            addPart(20, 4, 20, 0xd35400, 0, 15, 0); // Mặt ghế
            addPart(20, 20, 4, 0xd35400, 0, 25, -8); // Lưng
            addPart(4, 15, 4, 0x8b4513, -8, 7.5, -8); // Chân
            addPart(4, 15, 4, 0x8b4513, 8, 7.5, -8);
            addPart(4, 15, 4, 0x8b4513, -8, 7.5, 8);
            addPart(4, 15, 4, 0x8b4513, 8, 7.5, 8);
        }
        else if (id.includes('fridge')) {
            addPart(30, 50, 30, 0xecf0f1, 0, 25, 0); // Tủ
            addPart(28, 20, 2, 0xbdc3c7, 0, 38, 15); // Ngăn đá
            addPart(28, 26, 2, 0xbdc3c7, 0, 14, 15); // Ngăn mát
        }
        else if (id.includes('tv') || id.includes('pc') || id.includes('laptop') || id.includes('console')) {
            addPart(40, 25, 2, 0x2c3e50, 0, 20, 0); // Màn hình
            addPart(36, 21, 1, 0x3498db, 0, 20, 1); // Kính màn hình
            addPart(5, 10, 5, 0x7f8c8d, 0, 5, 0); // Chân
            addPart(20, 2, 10, 0x7f8c8d, 0, 1, 0); // Bàn
        }
        else if (id.includes('tub') || id.includes('duck')) {
            addPart(40, 15, 25, 0xffffff, 0, 7.5, 0); // Bồn
            addPart(36, 12, 21, 0x3498db, 0, 10, 0); // Nước
            if(id.includes('duck')) addPart(8, 8, 8, 0xf1c40f, 0, 20, 0); // Vịt
        }
        else if (id.includes('stove') || id.includes('pot') || id.includes('microwave')) {
            addPart(30, 30, 30, 0x2c3e50, 0, 15, 0); // Bếp
            addPart(10, 1, 10, 0xe74c3c, -8, 30.5, -8); // Nhiệt
            addPart(10, 1, 10, 0xe74c3c, 8, 30.5, 8); 
            if(id.includes('pot')) addPart(15, 10, 15, 0xbdc3c7, 0, 35, 0); // Nồi
        }
        else if (id.includes('toilet')) {
            addPart(20, 15, 25, 0xffffff, 0, 7.5, 5); 
            addPart(20, 20, 10, 0xffffff, 0, 25, -10); 
        }
        else if (id.includes('piano')) {
            addPart(50, 20, 20, 0x111111, 0, 20, 0);
            addPart(50, 5, 15, 0xffffff, 0, 15, 15);
        }
        else if (id.includes('guitar')) {
            addPart(15, 40, 5, 0xd35400, 0, 20, 0);
            addPart(4, 30, 2, 0x333333, 0, 40, 2);
        }
        else if (id.includes('drum')) {
            addPart(20, 15, 20, 0xecf0f1, 0, 10, 0); // Trống to
            addPart(10, 10, 10, 0xecf0f1, -15, 25, -5); // Trống nhỏ
            addPart(10, 10, 10, 0xecf0f1, 15, 25, -5);
        }
        else if (id.includes('aquarium')) {
            addPart(40, 25, 20, 0x3498db, 0, 12.5, 0); // Nước
            addPart(42, 2, 22, 0x333333, 0, 0, 0); // Đế
            addPart(42, 2, 22, 0x333333, 0, 25, 0); // Nắp
        }
        else if (id.includes('tree') || id.includes('flower') || id.includes('bonsai') || id.includes('cactus')) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 20), new THREE.MeshLambertMaterial({color: 0x8b4513}));
            trunk.position.set(0, 10, 0);
            trunk.userData = { isPart: true, parentGroup: group };
            const leaves = new THREE.Mesh(
                id.includes('xmas') ? new THREE.ConeGeometry(20, 35) : new THREE.SphereGeometry(18), 
                new THREE.MeshLambertMaterial({color: id.includes('xmas') ? 0x27ae60 : (id.includes('cactus') ? 0x1e8449 : 0x2ecc71)})
            );
            leaves.position.set(0, 30, 0);
            leaves.userData = { isPart: true, parentGroup: group };
            group.add(trunk, leaves);
        }
        else if (id.includes('moai') || id.includes('statue')) {
            addPart(20, 40, 20, 0x7f8c8d, 0, 20, 0); 
            addPart(22, 10, 25, 0x7f8c8d, 0, 30, 5); 
        }
        else if (id.includes('clock')) {
            addPart(20, 60, 15, 0x8b4513, 0, 30, 0);
            addPart(12, 12, 2, 0xffffff, 0, 50, 8); 
        }
        else if (id.includes('magic')) {
            addPart(15, 10, 15, 0x333333, 0, 5, 0); // Đế
            const orb = new THREE.Mesh(new THREE.SphereGeometry(12), new THREE.MeshLambertMaterial({color: 0x9b59b6, transparent: true, opacity: 0.8}));
            orb.position.set(0, 20, 0);
            orb.userData = { isPart: true, parentGroup: group };
            group.add(orb);
        }
        // XỬ LÝ ĐỘNG VẬT KIỂU MINECRAFT
        else if (itemInfo.category === 'pet' || itemInfo.type === 'p') {
            let color = 0xffffff; 
            if (id.includes('cat')) color = 0xf1c40f; 
            else if (id.includes('dog')) color = 0x8b4513; 
            else if (id.includes('parrot')) color = 0xe74c3c; 
            else if (id.includes('unicorn')) color = 0x9b59b6; 
            else if (id.includes('hamster')) color = 0xd35400; 
            else if (id.includes('pig')) color = 0xff9ff3;
            else if (id.includes('monkey')) color = 0x8d6e63;
            else if (id.includes('turtle')) color = 0x2ecc71;
            else if (id.includes('penguin')) color = 0x2c3e50;
            else if (id.includes('dragon')) color = 0xc0392b;

            addPart(15, 10, 25, color, 0, 10, 0); // Thân
            addPart(12, 12, 12, color, 0, 18, 12); // Đầu
            
            // Phụ kiện cho thú
            if (id.includes('unicorn')) addPart(2, 10, 2, 0xf1c40f, 0, 26, 15); // Sừng
            if (id.includes('rabbit')) { addPart(3, 10, 3, 0xffffff, -4, 25, 12); addPart(3, 10, 3, 0xffffff, 4, 25, 12); } // Tai thỏ
            if (id.includes('dragon')) { addPart(2, 15, 20, 0xe74c3c, -8, 15, 0); addPart(2, 15, 20, 0xe74c3c, 8, 15, 0); } // Cánh rồng
            if (id.includes('turtle')) { addPart(20, 6, 20, 0x1e8449, 0, 13, 0); } // Mai rùa

            // 4 Chân
            addPart(4, 10, 4, 0x333333, -5, 5, 8); 
            addPart(4, 10, 4, 0x333333, 5, 5, 8); 
            addPart(4, 10, 4, 0x333333, -5, 5, -8); 
            addPart(4, 10, 4, 0x333333, 5, 5, -8);
        }
        else {
            // MỌI MÓN ĐỒ LẠ KHÁC: Render thành Thùng Gỗ dán Icon
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e67e22'; ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = '#d35400'; ctx.lineWidth = 8; ctx.strokeRect(0,0,128,128);
            ctx.font = '70px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(itemInfo.icon || '📦', 64, 64);
            
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(30, 30, 30), 
                new THREE.MeshLambertMaterial({map: new THREE.CanvasTexture(canvas)})
            );
            mesh.position.y = 15;
            mesh.userData = { isPart: true, parentGroup: group };
            group.add(mesh);
        }

        return group;
    }

    // ==========================================
    // --- 4. TƯƠNG TÁC ĐẶT / PHÁ MÔ HÌNH ---
    // ==========================================
    function onMouseClick(event) {
        if (!controls.isLocked) return;

        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        
        // Gộp đồ tĩnh và động vật để có thể đập/thu hồi
        const allInteractables = [];
        [...objects, ...animatedObjects].forEach(obj => {
            if (obj.isGroup) allInteractables.push(...obj.children);
            else allInteractables.push(obj);
        });
        const intersectsAll = raycaster.intersectObjects(allInteractables);

        // Chỉ cho xây dựa trên bề mặt đồ tĩnh (Sàn, Gạch)
        const staticMeshes = [];
        objects.forEach(obj => {
            if (obj.isGroup) staticMeshes.push(...obj.children);
            else staticMeshes.push(obj);
        });
        const intersectsStatic = raycaster.intersectObjects(staticMeshes);

        if (intersectsAll.length > 0) {
            
            // CHUỘT TRÁI: ĐẶT XUỐNG
            if (event.button === 0 && intersectsStatic.length > 0) {
                const intersect = intersectsStatic[0];
                
                if (!selectedItemId) return showNotification("Bạn chưa lấy đồ từ Ba Lô ra!");
                
                const invIdx = houseState.inventory.indexOf(selectedItemId);
                if (invIdx === -1) return showNotification("Đã dùng hết vật phẩm này!");
                
                const itemInfo = shopItems.find(i => i.id === selectedItemId);
                if (!itemInfo) return;

                // Xóa khỏi túi đồ UI
                houseState.inventory.splice(invIdx, 1);
                updateUI();

                // Hít lưới chuẩn xác (Snapping)
                const pos = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(BLOCK_SIZE/2));
                pos.x = Math.floor(pos.x / BLOCK_SIZE) * BLOCK_SIZE + BLOCK_SIZE/2;
                pos.y = Math.floor(pos.y / BLOCK_SIZE) * BLOCK_SIZE + BLOCK_SIZE/2;
                pos.z = Math.floor(pos.z / BLOCK_SIZE) * BLOCK_SIZE + BLOCK_SIZE/2;

                spawnItem(itemInfo, pos.x, pos.y, pos.z, 'item_' + Date.now());
            }

            // CHUỘT PHẢI: ĐẬP / THU HỒI
            if (event.button === 2) {
                let hitMesh = intersectsAll[0].object;
                if (hitMesh === objects[0]) return; // Cấm phá nền đất

                // Tìm Group cha nếu click trúng một mảnh ghép
                let targetObj = hitMesh;
                if (hitMesh.userData.isPart) targetObj = hitMesh.userData.parentGroup;

                scene.remove(targetObj);
                
                // Gỡ khỏi mảng
                let idx = objects.indexOf(targetObj);
                if(idx > -1) objects.splice(idx, 1);

                idx = animatedObjects.indexOf(targetObj);
                if(idx > -1) animatedObjects.splice(idx, 1);
                
                // Trả về túi
                const itemId = targetObj.userData.id;
                houseState.inventory.push(itemId);
                houseState.items = houseState.items.filter(i => i.uniqueId !== targetObj.userData.uniqueId);
                
                updateUI();
                showNotification(`Thành công thu hồi cất vào Ba lô!`);
            }
        }
    }

    // Cơ chế phân loại khi sinh đồ
    function spawnItem(itemInfo, x, y, z, uniqueId) {
        let object3D;
        const isBlock = itemInfo.category === 'paint' || itemInfo.category === 'floor';

        if (isBlock) {
            // Là sơn tường/sàn -> Tạo khối Box
            const material = createBlockMaterial(itemInfo.value);
            object3D = new THREE.Mesh(new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE), material);
            object3D.position.set(x, y, z);
        } else {
            // Đồ đạc / Động vật -> Tạo từ nhà máy
            object3D = create3DModel(itemInfo);
            object3D.position.set(x, y - BLOCK_SIZE/2, z); // Hạ chân xuống chạm mặt dưới khối
        }

        // Đánh dấu dữ liệu
        object3D.userData = { id: itemInfo.id, uniqueId: uniqueId, category: itemInfo.category };
        scene.add(object3D);

        if (itemInfo.category === 'pet' || itemInfo.type === 'p') {
            object3D.userData.velocity = new THREE.Vector3(0, 0, 0);
            object3D.userData.moveTimer = 0; 
            animatedObjects.push(object3D);
        } else {
            objects.push(object3D);
        }
        
        houseState.items.push({ id: itemInfo.id, uniqueId: uniqueId, x: x, y: y, z: z });
    }

    // ==========================================
    // --- 5. VẬT LÝ NHÂN VẬT & ĐỘNG VẬT ---
    // ==========================================
    function updateAnimals(delta) {
        animatedObjects.forEach(animal => {
            const data = animal.userData;
            data.moveTimer -= delta;

            if (data.moveTimer <= 0) {
                if (Math.random() > 0.4) {
                    // Chạy nhảy
                    data.velocity.x = (Math.random() - 0.5) * 80; 
                    data.velocity.z = (Math.random() - 0.5) * 80;
                    animal.rotation.y = Math.atan2(data.velocity.x, data.velocity.z); // Quay người
                } else {
                    // Đứng im
                    data.velocity.x = 0; data.velocity.z = 0;
                }
                data.moveTimer = Math.random() * 3 + 1; 
            }

            animal.position.x += data.velocity.x * delta;
            animal.position.z += data.velocity.z * delta;
            
            // Bouncing Animation
            if (data.velocity.x !== 0 || data.velocity.z !== 0) {
                animal.position.y = (BLOCK_SIZE/2 - BLOCK_SIZE/2) + Math.abs(Math.sin(performance.now() * 0.01)) * 5;
            } else {
                animal.position.y = 0; 
            }

            // Boundary
            if (animal.position.x > 950 || animal.position.x < -950) data.velocity.x *= -1;
            if (animal.position.z > 950 || animal.position.z < -950) data.velocity.z *= -1;
        });
    }

    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000; 
        prevTime = time;

        if (controls.isLocked) {
            // Player Physics
            velocity.x -= velocity.x * 10.0 * delta; 
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 100.0 * delta; 

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            const speed = 4000.0; 
            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
            controls.getObject().position.y += (velocity.y * delta);

            if (controls.getObject().position.y < 100) {
                velocity.y = 0;
                controls.getObject().position.y = 100; 
                canJump = true;
            }

            // Cập nhật AI Thú cưng
            updateAnimals(delta);
        }
        
        renderer.render(scene, camera);
    }

    // ==========================================
    // --- 6. LIÊN KẾT API & UI VỚI SERVER ---
    // ==========================================
    async function loadDataFromServer() {
        try {
            const res = await fetch('/api/house/info');
            if(res.status === 401) return window.location.href = 'login.html';
            const data = await res.json();
            
            houseState.score = data.score || 0;
            houseState.inventory = data.inventory || [];
            shopItems = data.shopItems || [];
            
            // Quà Tân Thủ: Cho bé ít gạch xây tường
            if(houseState.inventory.length === 0 && houseState.items.length === 0) {
                houseState.inventory.push('wall_blue', 'wall_pink', 'floor_wood');
            }

            updateUI();

            // Ráp đồ đã lưu từ Server
            if(data.houseData) {
                data.houseData.forEach(savedItem => {
                    const info = shopItems.find(i => i.id === savedItem.id);
                    if(info) {
                        let z = savedItem.z !== undefined ? savedItem.z : (Math.random() * 500 - 250);
                        let y = savedItem.y !== undefined && savedItem.z !== undefined ? savedItem.y : BLOCK_SIZE/2;
                        let x = savedItem.x || 0;
                        spawnItem(info, x, y, z, savedItem.uniqueId);
                    }
                });
            }
        } catch(e) { console.error("Lỗi tải data:", e); }
    }

    function updateUI() {
        document.getElementById('score').innerText = houseState.score.toLocaleString();
        
        const sGrid = document.getElementById('grid-shop');
        sGrid.innerHTML = '';
        shopItems.filter(i => i.category !== 'souvenir').forEach(i => {
            sGrid.innerHTML += `
                <div class="item-card" onclick="buyItem('${i.id}')">
                    <div style="font-size:3rem; margin-bottom:10px;">${i.icon}</div>
                    <b style="font-size:1.1rem; color:#2c3e50;">${i.name}</b><br>
                    <div style="color:#d35400; font-weight:900; font-size:1.2rem; margin-top:5px;">${i.price} 💎</div>
                </div>`;
        });

        const iGrid = document.getElementById('grid-inv');
        iGrid.innerHTML = '';
        const counts = {};
        houseState.inventory.forEach(id => { counts[id] = (counts[id] || 0) + 1; });

        for(let [id, count] of Object.entries(counts)) {
            const item = shopItems.find(x => x.id === id);
            if(item && item.category !== 'souvenir') {
                const isSel = selectedItemId === id ? 'selected' : '';
                iGrid.innerHTML += `
                    <div class="item-card ${isSel}" onclick="selectItemToBuild('${id}')">
                        <div style="font-size:3rem; margin-bottom:10px;">${item.icon}</div>
                        <b style="font-size:1.1rem; color:#2c3e50;">${item.name}</b><br>
                        <div style="background:#3498db; color:white; padding:5px 15px; border-radius:20px; font-weight:bold; display:inline-block; margin-top:5px;">Còn: ${count}</div>
                    </div>`;
            }
        }
    }

    function selectItemToBuild(id) {
        selectedItemId = id;
        const itemInfo = shopItems.find(i => i.id === id);
        
        const holdUI = document.getElementById('holding-item');
        holdUI.style.display = 'block';
        holdUI.innerHTML = `👋 Đang cầm: ${itemInfo.icon} ${itemInfo.name}`;
        
        updateUI(); 
    }

    async function buyItem(id) {
        const res = await fetch('/api/house/buy', {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({itemId: id})
        });
        const d = await res.json();
        if(res.ok) {
            houseState.score = d.newScore;
            houseState.inventory.push(id);
            updateUI();
            showNotification(`🛍️ Đã mua ${d.message}`);
        } else alert(d.message);
    }

    async function saveHouse() {
        await fetch('/api/house/save', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ 
                items: houseState.items,
                inventory: houseState.inventory,
                colors: {} // Mảng màu cũ không còn dùng
            })
        });
        showNotification("✅ Đã lưu Thế Giới 3D tuyệt đẹp!");
    }

    function switchTab(t) {
        document.getElementById('grid-shop').style.display = t==='shop'?'grid':'none';
        document.getElementById('grid-inv').style.display = t==='inv'?'grid':'none';
        document.getElementById('tab-shop').classList.toggle('active', t==='shop');
        document.getElementById('tab-inv').classList.toggle('active', t==='inv');
    }

    function showNotification(msg) {
        const n = document.createElement('div');
        n.className = 'notif'; n.innerHTML = msg;
        document.body.appendChild(n); 
        setTimeout(()=>n.remove(), 2500);
    }
</script>
