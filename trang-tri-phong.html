<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hành Tinh Mơ ƯớC 3D - Mode 13.0 (Full Multiplayer)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Baloo 2', cursive; background: #000; overscroll-behavior: none; }
        #landscape-warning { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #2c3e50; color: white; z-index: 999999; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        @media screen and (orientation: portrait) { #landscape-warning { display: flex !important; } #blocker, #mobile-controls, #hotbar, #mobile-menu-btn { display: none !important; } }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; z-index: 100; border: 2px solid white; border-radius: 50%; }
        #interaction-tooltip { position: absolute; top: 60%; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 1.5rem; color: #f1c40f; text-shadow: 2px 2px 4px #000; display: none; z-index: 100;}

        #blocker { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        #instructions { text-align: center; color: white; padding: 40px; border-radius: 30px; border: 4px solid #f1c40f; background: rgba(0,0,0,0.4); }
        .play-btn { background: #2ecc71; color: white; border: none; padding: 15px 60px; font-size: 2rem; font-family: 'Baloo 2'; font-weight: 800; border-radius: 50px; cursor: pointer; margin-top: 20px; box-shadow: 0 8px 0 #27ae60; }
        .play-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #27ae60; }

        .panel { position: absolute; right: 20px; top: 20px; bottom: 20px; width: 380px; background: rgba(255,255,255,0.95); border-radius: 25px; padding: 20px; display: none; flex-direction: column; z-index: 1001; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        .panel.show { display: flex !important; }
        .score-badge { background:#f1c40f; color:#d35400; padding:10px; border-radius:20px; font-weight:900; font-size: 1.8rem; text-align: center; margin-bottom: 10px; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: auto; flex: 1; }
        .item-card { background: #fff; padding: 15px; border-radius: 15px; text-align: center; border: 3px solid #eee; cursor: pointer; }
        .item-card img, .item-card div { font-size: 3rem; }

        #hotbar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 20px; z-index: 100; }
        .hotbar-slot { width: 55px; height: 55px; background: rgba(255,255,255,0.2); border: 3px solid rgba(255,255,255,0.4); border-radius: 12px; display: flex; justify-content: center; align-items: center; color: white; font-weight: 800; font-size: 1.5rem; position: relative; }
        .hotbar-slot.active { border-color: #f1c40f; background: rgba(255,255,255,0.9); color: #333; transform: scale(1.1); }

        #mobile-controls { display: none; }
        #joystick-zone { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 20; }
        .action-container { position: absolute; bottom: 40px; right: 40px; width: 220px; height: 220px; z-index: 20; pointer-events: none; }
        .a-btn { position: absolute; width: 75px; height: 75px; border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-size: 2rem; pointer-events: auto; box-shadow: 0 6px 0 rgba(0,0,0,0.3); }
        #btn-build { background: #2ecc71; top: 0; right: 60px; }
        #btn-break { background: #e74c3c; bottom: 50px; right: 0; }
        #btn-jump { background: #3498db; bottom: 0; right: 90px; }
        #btn-interact { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); background: #f1c40f; color: #d35400; padding: 12px 30px; border-radius: 30px; font-weight: 900; z-index: 30; display: none; border: 3px solid white; }
        #mobile-menu-btn { position: absolute; top: 20px; right: 20px; background: #9b59b6; color: white; padding: 10px 25px; border-radius: 15px; font-weight: 800; z-index: 100; border: 3px solid white; display: none;}
        .notif { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 30px; border-radius: 30px; border: 3px solid #2ecc71; font-weight: 900; z-index: 9999; color: #27ae60; }
    </style>
</head>
<body>

    <div id="landscape-warning"><h1>📱 Xoay ngang màn hình để chơi game nhé!</h1></div>
    <div id="fade-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; opacity:0; pointer-events:none; z-index:99999; transition: opacity 2s;"></div>
    <div id="crosshair"></div>
    <div id="interaction-tooltip">[E] - Tương tác</div>
    <div id="hotbar"></div>

    <button id="mobile-menu-btn" onclick="openPanel('ui-panel')">🎒 SHOP / BALO</button>

    <div id="mobile-controls">
        <div id="camera-zone"></div>
        <div id="joystick-zone"></div>
        <button id="btn-interact">✋ TƯƠNG TÁC (E)</button>
        <div class="action-container">
            <div class="a-btn" id="btn-build">🔨</div>
            <div class="a-btn" id="btn-break">💥</div>
            <div class="a-btn" id="btn-jump">🚀</div>
        </div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <h1>🌍 THẾ GIỚI HÀNH TINH 13.0</h1>
            <div id="pc-hint">
                <p><b>W, A, S, D</b> = Di chuyển | <b>B</b> = Mở Shop | <b>E</b> = Mở Cửa</p>
                <p><b>Chuột Trái/Phải</b> = Xây/Phá | <b>Space</b> = Nhảy</p>
            </div>
            <button class="play-btn" id="play-btn">▶️ VÀO CHƠI NGAY</button>
        </div>

        <div id="ui-panel" class="panel">
            <div class="score-badge">💎 <span id="score">0</span></div>
            <div class="tab-container" style="display:flex; gap:5px; margin-bottom:10px;">
                <button class="tab-btn active" style="flex:1" onclick="switchTab('shop')">Cửa Hàng</button>
                <button class="tab-btn" style="flex:1" onclick="switchTab('inv')">Ba Lô</button>
            </div>
            <div id="grid-shop" class="grid-container"></div>
            <div id="grid-inv" class="grid-container" style="display:none"></div>
            <button class="btn-general" style="background:#e74c3c" onclick="saveHouse()">💾 LƯU NHÀ</button>
            <button class="btn-general" style="background:#8e44ad" onclick="visitFriend()">🌐 THĂM BẠN</button>
            <button class="btn-general" style="background:#34495e" onclick="closePanels()">ĐÓNG</button>
        </div>

        <div id="chest-panel" class="panel">
            <h2 style="text-align:center">📦 TỦ ĐỒ CỦA BÉ</h2>
            <div style="display:flex; gap:5px; flex:1; min-height:0">
                <div id="grid-chest-inside" class="grid-container" style="background:#f1f2f6"></div>
                <div id="grid-chest-inv" class="grid-container" style="background:#e8f8f5"></div>
            </div>
            <button class="btn-general" style="background:#e74c3c" onclick="closePanels()">ĐÓNG TỦ</button>
        </div>
    </div>

<script>
    const socket = io();
    let myUsername = "", currentHost = "", otherPlayers = {};
    let houseState = { score: 0, inventory: [], items: [] };
    let shopItems = [], chestsData = {}, currentChestId = null;

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let isGameRunning = false, isSwimming = false, canJump = false;
    
    let scene, camera, renderer, controls, raycaster;
    let objects = [], animatedObjects = [];
    let velocity = new THREE.Vector3(), direction = new THREE.Vector3(), playerBox = new THREE.Box3();
    let joystickVector = { x: 0, y: 0 }, prevTime = performance.now(), blockHighlight;
    let timeOfDay = Math.PI / 2, timeSpeed = 0.001;
    let sunSphere, moonSphere, dirLight;

    const BLOCK_SIZE = 50;
    const sharedBlockGeo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
    const HOTBAR_SIZE = 9;
    let hotbarSlots = new Array(HOTBAR_SIZE).fill(null), selectedHotbarIndex = 0;

    init3D(); setupControls(); setupMultiplayer(); animate();

    // ==========================================
    // --- KHỞI TẠO 3D & THẾ GIỚI ---
    // ==========================================
    function init3D() {
        scene = new THREE.Scene(); scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 200, 2000);
        
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 4000);
        controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());

        const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6); scene.add(hemi);
        dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(500, 1000, 200); dirLight.castShadow = true;
        scene.add(dirLight);

        sunSphere = new THREE.Mesh(new THREE.SphereGeometry(80), new THREE.MeshBasicMaterial({color: 0xffff00})); scene.add(sunSphere);
        moonSphere = new THREE.Mesh(new THREE.SphereGeometry(60), new THREE.MeshBasicMaterial({color: 0xecf0f1})); scene.add(moonSphere);

        blockHighlight = new THREE.LineSegments(new THREE.EdgesGeometry(sharedBlockGeo), new THREE.LineBasicMaterial({color: 0x000000, transparent:true, opacity:0.5}));
        scene.add(blockHighlight);

        renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
        raycaster = new THREE.Raycaster();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    }

    function generateWorld() {
        // Dọn map cũ
        objects.forEach(o => scene.remove(o)); objects = []; animatedObjects = [];

        // Mặt đất Minecraft
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
        const createPart = (w, d, x, z) => {
            const g = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI/2), floorMat);
            g.position.set(x, 0, z); g.receiveShadow = true; g.updateMatrixWorld(true);
            g.userData = { bbox: new THREE.Box3().setFromObject(g) }; scene.add(g); objects.push(g);
        };
        createPart(3000, 2100, 0, -450); createPart(3000, 500, 0, 1250); // Bờ sông

        // Sông sâu
        const river = new THREE.Mesh(new THREE.PlaneGeometry(3000, 400).rotateX(-Math.PI/2), new THREE.MeshLambertMaterial({color: 0x3498db, transparent:true, opacity:0.6}));
        river.position.set(0, -10, 800); river.updateMatrixWorld(true);
        river.userData = { isWater: true, bbox: new THREE.Box3().setFromObject(river) }; scene.add(river); objects.push(river);

        // Nhà dân làng & Dân làng
        const villageWall = new THREE.Mesh(new THREE.BoxGeometry(200, 120, 200), new THREE.MeshLambertMaterial({color: 0xf5cd79}));
        villageWall.position.set(-500, 60, -500); villageWall.updateMatrixWorld(true);
        villageWall.userData = { bbox: new THREE.Box3().setFromObject(villageWall) }; scene.add(villageWall); objects.push(villageWall);

        const villager = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(20, 40, 20), new THREE.MeshLambertMaterial({color: 0x8e44ad})); body.position.y = 20;
        const head = new THREE.Mesh(new THREE.BoxGeometry(25, 25, 25), new THREE.MeshLambertMaterial({color: 0xf1c40f})); head.position.y = 50;
        villager.add(body); villager.add(head); villager.position.set(-450, 0, -400);
        villager.userData = { isVillager: true, velocity: new THREE.Vector3(), moveTimer: 0 };
        scene.add(villager); animatedObjects.push(villager);
        
        // Sinh cây cối
        for(let i=0; i<20; i++) {
            let x = (Math.random()-0.5)*2000, z = (Math.random()-0.5)*1500 - 200;
            const trunk = new THREE.Mesh(new THREE.BoxGeometry(20, 60, 20), new THREE.MeshLambertMaterial({color: 0x8b4513}));
            trunk.position.set(x, 30, z); trunk.updateMatrixWorld(true);
            trunk.userData = { id:'tree_trunk', bbox: new THREE.Box3().setFromObject(trunk) }; scene.add(trunk); objects.push(trunk);
        }
    }

    // ==========================================
    // --- ĐIỀU KHIỂN & VẬT LÝ ---
    // ==========================================
    let moveF = false, moveB = false, moveL = false, moveR = false;

    function setupControls() {
        document.addEventListener('keydown', e => {
            if(!isGameRunning && !controls.isLocked) return;
            switch(e.code) {
                case 'KeyW': moveF = true; break; case 'KeyS': moveB = true; break;
                case 'KeyA': moveL = true; break; case 'KeyD': moveR = true; break;
                case 'Space': if(canJump || isSwimming) { velocity.y = isSwimming ? 200 : 400; canJump = false; playSFX('jump'); } break;
                case 'KeyB': controls.unlock(); openPanel('ui-panel'); break;
                case 'KeyE': triggerInteraction(); break;
                case 'Digit1': selectHotbar(0); break; case 'Digit2': selectHotbar(1); break;
                case 'Digit3': selectHotbar(2); break; case 'Digit4': selectHotbar(3); break;
            }
        });
        document.addEventListener('keyup', e => {
            switch(e.code) { case 'KeyW': moveF = false; break; case 'KeyS': moveB = false; break; case 'KeyA': moveL = false; break; case 'KeyD': moveR = false; break; }
        });
        document.addEventListener('mousedown', e => { if(controls.isLocked) handleBuildBreak(e.button === 0 ? 'build' : 'break'); });

        // Cảm ứng Mobile
        const camZone = document.getElementById('camera-zone'); let touchX, touchY;
        camZone.addEventListener('touchstart', e => { touchX = e.touches[0].pageX; touchY = e.touches[0].pageY; });
        camZone.addEventListener('touchmove', e => {
            if(!isGameRunning) return;
            const dx = e.touches[0].pageX - touchX; const dy = e.touches[0].pageY - touchY;
            touchX = e.touches[0].pageX; touchY = e.touches[0].pageY;
            const euler = new THREE.Euler(0,0,0,'YXZ'); euler.setFromQuaternion(camera.quaternion);
            euler.y -= dx * 0.005; euler.x -= dy * 0.005; euler.x = Math.max(-1.5, Math.min(1.5, euler.x));
            camera.quaternion.setFromEuler(euler);
        });

        document.getElementById('btn-build').addEventListener('touchstart', () => handleBuildBreak('build'));
        document.getElementById('btn-break').addEventListener('touchstart', () => handleBuildBreak('break'));
        document.getElementById('btn-jump').addEventListener('touchstart', () => { if(canJump || isSwimming) { velocity.y = isSwimming ? 200 : 400; canJump = false; } });
        document.getElementById('btn-interact').addEventListener('touchstart', triggerInteraction);
    }

    function checkCollision(pos) {
        playerBox.setFromCenterAndSize(new THREE.Vector3(pos.x, pos.y-40, pos.z), new THREE.Vector3(18, 75, 18));
        let maxGroundY = -2000, water = false, blocked = false;
        for(let obj of objects) {
            if(!obj.userData.bbox) continue;
            if(obj.userData.id === 'build_door' && obj.userData.isOpen) continue; // Đi xuyên cửa mở
            if(playerBox.intersectsBox(obj.userData.bbox)) {
                if(obj.userData.isWater) { water = true; continue; }
                if(pos.y - 72 >= obj.userData.bbox.max.y - 10) { if(obj.userData.bbox.max.y + 80 > maxGroundY) maxGroundY = obj.userData.bbox.max.y + 80; }
                else { blocked = true; }
            }
        }
        return { blocked, groundY: maxGroundY, water };
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now(); const delta = Math.min((time - prevTime) / 1000, 0.1); prevTime = time;

        // Ngày đêm
        timeOfDay += delta * 0.05; sunSphere.position.set(Math.cos(timeOfDay)*1000, Math.sin(timeOfDay)*1000, 0);
        moonSphere.position.set(-Math.cos(timeOfDay)*1000, -Math.sin(timeOfDay)*1000, 0);
        dirLight.position.copy(sunSphere.position); dirLight.intensity = Math.sin(timeOfDay) > 0 ? 0.8 : 0.1;
        const skyColor = new THREE.Color().setHSL(0.6, 0.5, Math.max(0.1, Math.sin(timeOfDay)*0.5 + 0.5));
        scene.background.copy(skyColor); scene.fog.color.copy(skyColor);

        if(controls.isLocked || isGameRunning) {
            if(isMobile) { moveF = joystickVector.y > 0.3; moveB = joystickVector.y < -0.3; moveL = joystickVector.x < -0.3; moveR = joystickVector.x > 0.3; }
            
            const physics = checkCollision(controls.getObject().position);
            isSwimming = physics.water;
            const speed = (isSwimming ? 2000 : 4500) * delta;
            
            direction.z = Number(moveF) - Number(moveB); direction.x = Number(moveR) - Number(moveL); direction.normalize();
            const moveVec = new THREE.Vector3();
            if(moveF || moveB) moveVec.z -= direction.z * speed; if(moveL || moveR) moveVec.x -= direction.x * speed;
            moveVec.applyQuaternion(camera.quaternion); moveVec.y = 0;

            const oldPos = controls.getObject().position.clone();
            controls.getObject().position.x += moveVec.x;
            if(checkCollision(controls.getObject().position).blocked) controls.getObject().position.x = oldPos.x;
            controls.getObject().position.z += moveVec.z;
            if(checkCollision(controls.getObject().position).blocked) controls.getObject().position.z = oldPos.z;

            velocity.y -= 9.8 * (isSwimming ? 40 : 140) * delta;
            controls.getObject().position.y += velocity.y * delta;
            if(controls.getObject().position.y <= physics.groundY) { velocity.y = 0; controls.getObject().position.y = physics.groundY; canJump = true; }
            if(controls.getObject().position.y < -500) controls.getObject().position.set(0, 100, 0);

            // Đồng bộ vị trí lên Server
            socket.emit('move3DPlayer', { x: controls.getObject().position.x, y: controls.getObject().position.y, z: controls.getObject().position.z, ry: camera.rotation.y });

            // NPC Dân làng đi dạo
            animatedObjects.forEach(npc => {
                if(npc.userData.isVillager) {
                    npc.userData.moveTimer -= delta;
                    if(npc.userData.moveTimer <= 0) {
                        npc.userData.velocity.set((Math.random()-0.5)*50, 0, (Math.random()-0.5)*50);
                        npc.userData.moveTimer = Math.random()*3 + 2;
                        npc.rotation.y = Math.atan2(npc.userData.velocity.x, npc.userData.velocity.z);
                    }
                    npc.position.addScaledVector(npc.userData.velocity, delta);
                }
            });

            checkLookingAt();
        }
        renderer.render(scene, camera);
    }

    // ==========================================
    // --- TƯƠNG TÁC CỬA & ĐỒ ĐẠC ---
    // ==========================================
    function triggerInteraction() {
        if(!lookingAtInteractable) return;
        const obj = lookingAtInteractable;
        if(obj.userData.id === 'build_door') {
            obj.userData.isOpen = !obj.userData.isOpen;
            const angle = obj.userData.isOpen ? Math.PI/2 : 0;
            obj.rotation.y = angle;
            obj.updateMatrixWorld(true); obj.userData.bbox.setFromObject(obj);
            playSFX('door');
            // Đồng bộ sang các máy khác
            socket.emit('toggle3DDoor', { uniqueId: obj.userData.uniqueId, isOpen: obj.userData.isOpen });
        } else if(obj.userData.id.includes('bed')) {
            if(Math.sin(timeOfDay) > 0) return showNotification("Chỉ có thể ngủ vào ban đêm!");
            document.getElementById('fade-overlay').style.opacity = 1;
            setTimeout(() => { timeOfDay = Math.PI/2; document.getElementById('fade-overlay').style.opacity = 0; showNotification("Trời đã sáng!"); }, 3000);
        } else if(obj.userData.id.includes('wardrobe')) {
            currentChestId = obj.userData.uniqueId; if(!chestsData[currentChestId]) chestsData[currentChestId] = [];
            controls.unlock(); openPanel('chest-panel'); renderChestUI();
        }
    }

    function checkLookingAt() {
        raycaster.setFromCamera(new THREE.Vector2(), camera);
        const intersects = raycaster.intersectObjects(objects, true);
        const tooltip = document.getElementById('interaction-tooltip');
        const btnI = document.getElementById('btn-interact');

        if(intersects.length > 0 && intersects[0].distance < 200) {
            const found = intersects[0].object;
            const group = found.userData.parentGroup || found;
            blockHighlight.position.copy(group.position); blockHighlight.visible = true;

            const id = group.userData.id;
            if(['build_door', 'bed_lux', 'wardrobe_big'].some(k => id?.includes(k))) {
                lookingAtInteractable = group; tooltip.style.display = 'block';
                if(isMobile) btnI.style.display = 'block'; return;
            }
        }
        lookingAtInteractable = null; tooltip.style.display = 'none'; blockHighlight.visible = false;
        if(isMobile) btnI.style.display = 'none';
    }

    function handleBuildBreak(type) {
        raycaster.setFromCamera(new THREE.Vector2(), camera);
        const intersects = raycaster.intersectObjects(objects, true);
        if(intersects.length > 0) {
            if(type === 'build') {
                const id = hotbarSlots[selectedHotbarIndex]; if(!id) return;
                const itemInfo = shopItems.find(x => x.id === id); if(!itemInfo) return;
                const pos = intersects[0].point.clone().add(intersects[0].face.normal.multiplyScalar(BLOCK_SIZE/2));
                pos.x = Math.round(pos.x/BLOCK_SIZE)*BLOCK_SIZE; pos.y = Math.round(pos.y/BLOCK_SIZE)*BLOCK_SIZE; pos.z = Math.round(pos.z/BLOCK_SIZE)*BLOCK_SIZE;
                const uid = 'item_'+Date.now();
                spawnItem(itemInfo, pos.x, pos.y, pos.z, uid);
                socket.emit('build3DBlock', { itemInfo, x:pos.x, y:pos.y, z:pos.z, uniqueId:uid });
                const idx = houseState.inventory.indexOf(id); houseState.inventory.splice(idx, 1);
                renderHotbarUI(); updateUI(); playSFX('build');
            } else {
                const target = intersects[0].object.userData.parentGroup || intersects[0].object;
                if(objects.includes(target) && target.userData.id !== undefined) {
                    if(target.userData.id === 'tree_trunk') { houseState.inventory.push('wall_wood_plank'); showNotification("Nhận 1 Gỗ!"); }
                    else { houseState.inventory.push(target.userData.id); }
                    scene.remove(target); objects.splice(objects.indexOf(target), 1);
                    socket.emit('break3DBlock', target.userData.uniqueId);
                    renderHotbarUI(); updateUI(); playSFX('break');
                }
            }
        }
    }

    function spawnItem(info, x, y, z, uid, isSync = false) {
        let mesh;
        if(info.category === 'paint' || info.category === 'floor') {
            const isGlass = info.id.includes('window');
            mesh = new THREE.Mesh(sharedBlockGeo, new THREE.MeshLambertMaterial({color: info.value, transparent: isGlass, opacity: isGlass ? 0.4 : 1}));
            mesh.position.set(x, y, z);
        } else {
            mesh = create3DModel(info); mesh.position.set(x, y - 25, z);
        }
        mesh.userData = { id: info.id, uniqueId: uid, bbox: new THREE.Box3().setFromObject(mesh) };
        mesh.updateMatrixWorld(true); scene.add(mesh); objects.push(mesh);
        if(!isSync) houseState.items.push({ id:info.id, uniqueId:uid, x, y, z });
    }

    function create3DModel(info) {
        const g = new THREE.Group();
        const add = (w, h, d, c, x, y, z) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color: c}));
            m.position.set(x, y, z); m.castShadow = true; m.userData.parentGroup = g; g.add(m); return m;
        };
        if(info.id === 'build_door') { add(5, 100, 45, '#8b4513', 0, 50, 0); add(8, 10, 10, '#f1c40f', -2, 50, 15); g.userData.isOpen = false; }
        else if(info.id.includes('bed')) { add(46, 10, 46, '#8b4513', 0, 5, 0); add(42, 6, 42, '#fff', 0, 13, 0); }
        else if(info.id.includes('wardrobe')) { add(40, 60, 20, '#8b4513', 0, 30, 0); }
        else { add(40, 40, 40, '#e67e22', 0, 20, 0); }
        return g;
    }

    // ==========================================
    // --- MULTIPLAYER SYNC ---
    // ==========================================
    function setupMultiplayer() {
        socket.on('playerJoinedHouse', d => {
            showNotification(`${d.username} đã vào!`);
            const p = new THREE.Mesh(new THREE.BoxGeometry(20, 60, 20), new THREE.MeshLambertMaterial({color: Math.random()*0xffffff}));
            scene.add(p); otherPlayers[d.id] = p;
        });
        socket.on('updatePlayerPos', d => {
            if(otherPlayers[d.id]) { otherPlayers[d.id].position.lerp(new THREE.Vector3(d.pos.x, d.pos.y-30, d.pos.z), 0.5); otherPlayers[d.id].rotation.y = d.pos.ry; }
        });
        socket.on('syncBuild', d => spawnItem(d.itemInfo, d.x, d.y, d.z, d.uniqueId, true));
        socket.on('syncBreak', uid => { const t = objects.find(o => o.userData.uniqueId === uid); if(t) { scene.remove(t); objects.splice(objects.indexOf(t), 1); } });
        socket.on('syncDoor', d => {
            const door = objects.find(o => o.userData.uniqueId === d.uniqueId);
            if(door) { door.userData.isOpen = d.isOpen; door.rotation.y = d.isOpen ? Math.PI/2 : 0; door.updateMatrixWorld(true); door.userData.bbox.setFromObject(door); }
        });
    }

    // ==========================================
    // --- SERVER API & UI ---
    // ==========================================
    async function loadDataFromServer() {
        const res = await fetch('/api/house/info'); const d = await res.json();
        myUsername = d.username; houseState.score = d.score; houseState.inventory = d.inventory; shopItems = d.shopItems; chestsData = d.chestsData;
        updateUI(); generateWorld();
        if(d.houseData) d.houseData.forEach(i => { const info = shopItems.find(x => x.id === i.id); if(info) spawnItem(info, i.x, i.y, i.z, i.uniqueId, true); });
        socket.emit('join3DHouse', myUsername);
    }
    
    function updateUI() {
        document.getElementById('score').innerText = houseState.score.toLocaleString();
        const sGrid = document.getElementById('grid-shop'); sGrid.innerHTML = '';
        shopItems.forEach(i => sGrid.innerHTML += `<div class="item-card" onclick="buyItem('${i.id}')"><div>${i.icon}</div><b>${i.name}</b><br>${i.price}💎</div>`);
        const iGrid = document.getElementById('grid-inv'); iGrid.innerHTML = '';
        const counts = {}; houseState.inventory.forEach(id => counts[id] = (counts[id]||0)+1);
        Object.entries(counts).forEach(([id, c]) => {
            const info = shopItems.find(x => x.id === id);
            if(info) iGrid.innerHTML += `<div class="item-card" onclick="equipToHotbar('${id}')"><div>${info.icon}</div><b>${info.name}</b> (x${c})</div>`;
        });
    }

    async function buyItem(id) {
        const res = await fetch('/api/house/buy', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({itemId:id}) });
        const d = await res.json(); if(res.ok) { houseState.score = d.newScore; houseState.inventory.push(id); updateUI(); showNotification("Đã mua!"); }
    }

    async function saveHouse() { await fetch('/api/house/save', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({items: houseState.items, inventory: houseState.inventory, chestsData}) }); showNotification("Đã lưu!"); }
    
    async function visitFriend() {
        const f = prompt("Nhập tên bạn bè:"); if(!f) return;
        const res = await fetch(`/api/house/visit/${f}`); const d = await res.json();
        if(res.ok) { currentHost = f; document.getElementById('host-name').innerText = f; document.getElementById('visit-badge').style.display='block'; generateWorld(); d.houseData.forEach(i => { const info = shopItems.find(x => x.id === i.id); if(info) spawnItem(info, i.x, i.y, i.z, i.uniqueId, true); }); socket.emit('join3DHouse', f); closePanels(); }
    }

    function selectHotbar(i) { selectedHotbarIndex = i; renderHotbarUI(); }
    function equipToHotbar(id) { hotbarSlots[selectedHotbarIndex] = id; renderHotbarUI(); }
    function renderHotbarUI() { const h = document.getElementById('hotbar'); h.innerHTML = ''; hotbarSlots.forEach((id, i) => { const info = shopItems.find(x => x.id === id); h.innerHTML += `<div class="hotbar-slot ${i === selectedHotbarIndex ? 'active' : ''}" onclick="selectHotbar(${i})">${info ? info.icon : ''}</div>`; }); }
    function switchTab(t) { document.getElementById('grid-shop').style.display = t === 'shop' ? 'grid' : 'none'; document.getElementById('grid-inv').style.display = t === 'inv' ? 'grid' : 'none'; }
    function showNotification(m) { const n = document.createElement('div'); n.className='notif'; n.innerText=m; document.body.appendChild(n); setTimeout(()=>n.remove(), 2000); }
    function openPanel(id) { document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show')); document.getElementById(id).classList.add('show'); }
    function closePanels() { document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show')); if(!isMobile) controls.lock(); }
</script>
