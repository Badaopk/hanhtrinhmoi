<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngôi Nhà Mơ Ước</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Baloo 2', cursive; background: #87CEEB; overflow: hidden; }
        
        /* Giao diện chính */
        .main-container { display: flex; height: 100vh; }

        /* Khu vực Ngôi Nhà (Bên trái) */
        .house-area { 
            flex: 3; 
            position: relative; 
            background: #a9def9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }

        /* Căn phòng 3D giả lập */
        .room-3d {
            width: 600px;
            height: 400px;
            background: #fff5e6; /* Màu tường */
            border-bottom: 20px solid #d4a373; /* Sàn giả */
            border-left: 20px solid #e0e0e0;
            border-right: 20px solid #e0e0e0;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border-radius: 10px;
        }
        /* Sàn nhà */
        .room-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: repeating-linear-gradient(45deg, #d4a373, #d4a373 10px, #c89565 10px, #c89565 20px);
            border-top: 2px solid #a67c52;
        }

        /* Đồ vật trong nhà */
        .furniture-item {
            position: absolute;
            cursor: grab;
            font-size: 3rem; /* Dùng Emoji làm hình ảnh cho nhẹ */
            user-select: none;
            transition: transform 0.1s;
            filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.3));
        }
        .furniture-item:active { cursor: grabbing; transform: scale(1.1); }

        /* Khu vực Shop & Kho (Bên phải) */
        .ui-panel {
            flex: 1;
            background: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 100;
        }

        .header-ui { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .score-box { background: #f1c40f; color: #333; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #eee; }
        .tab-btn.active { background: #3498db; color: white; }

        .items-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            overflow-y: auto; 
            flex: 1; 
        }

        .shop-item {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .shop-item:hover { border-color: #3498db; background: #f0f8ff; }
        .shop-item .icon { font-size: 2.5rem; display: block; margin-bottom: 5px; }
        .shop-item .price { color: #e67e22; font-weight: bold; font-size: 0.9rem; }
        .shop-item button { 
            width: 100%; margin-top: 5px; background: #2ecc71; color: white; border: none; padding: 5px; border-radius: 5px; cursor: pointer; 
        }

        .inventory-item {
            background: #f9f9f9; border: 2px dashed #ccc;
        }

        .action-btns { margin-top: 10px; display: flex; gap: 10px; }
        .save-btn { flex: 1; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem;}
        .back-btn { background: #95a5a6; padding: 12px; border: none; border-radius: 8px; color: white; cursor: pointer;}
    </style>
</head>
<body>

<div class="main-container">
    <div class="house-area">
        <div class="room-3d" id="room">
            <div class="room-floor"></div>
            </div>
    </div>

    <div class="ui-panel">
        <div class="header-ui">
            <h2>🏡 Trang Trí Nhà</h2>
            <div class="score-box">💎 Điểm: <span id="user-score">0</span></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('shop')">🛒 Cửa Hàng</button>
            <button class="tab-btn" onclick="switchTab('inventory')">🎒 Kho Đồ</button>
        </div>

        <div id="shop-list" class="items-grid"></div>
        <div id="inventory-list" class="items-grid" style="display:none;"></div>

        <div class="action-btns">
            <button class="back-btn" onclick="window.location.href='index.html'">⬅️ Về</button>
            <button class="save-btn" onclick="saveHouse()">💾 LƯU NHÀ</button>
        </div>
    </div>
</div>

<script>
    let myScore = 0;
    let myInventory = [];
    let shopData = [];
    let placedItems = [];
    
    // --- KHỞI TẠO ---
    async function init() {
        try {
            const res = await fetch('/api/house/info');
            if(res.status === 401) window.location.href = 'login.html';
            const data = await res.json();
            
            myScore = data.score;
            myInventory = data.inventory;
            shopData = data.shopItems;
            
            updateUI();
            
            // Load đồ đã đặt trong nhà
            if(data.houseData) {
                data.houseData.forEach(item => {
                    placeItemVisual(item.id, item.x, item.y, item.uniqueId);
                });
            }
        } catch(e) { console.error(e); }
    }

    // --- XỬ LÝ GIAO DIỆN ---
    function updateUI() {
        document.getElementById('user-score').textContent = myScore;
        
        // Render Shop
        const shopEl = document.getElementById('shop-list');
        shopEl.innerHTML = '';
        shopData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'shop-item';
            div.innerHTML = `
                <span class="icon">${item.icon}</span>
                <div>${item.name}</div>
                <div class="price">${item.price} điểm</div>
                <button onclick="buyItem('${item.id}')">Mua</button>
            `;
            shopEl.appendChild(div);
        });

        // Render Kho
        const invEl = document.getElementById('inventory-list');
        invEl.innerHTML = '';
        if(myInventory.length === 0) invEl.innerHTML = '<p style="text-align:center; color:#999;">Kho trống</p>';
        
        // Đếm số lượng đồ trong kho
        const counts = {};
        myInventory.forEach(id => counts[id] = (counts[id] || 0) + 1);

        for (const [id, count] of Object.entries(counts)) {
            const item = shopData.find(i => i.id === id);
            if(item) {
                const div = document.createElement('div');
                div.className = 'shop-item inventory-item';
                div.innerHTML = `
                    <span class="icon">${item.icon}</span>
                    <div>${item.name} (x${count})</div>
                    <button onclick="spawnItem('${id}')" style="background:#3498db">👇 Đặt ra</button>
                `;
                invEl.appendChild(div);
            }
        }
    }

    function switchTab(tab) {
        document.getElementById('shop-list').style.display = tab === 'shop' ? 'grid' : 'none';
        document.getElementById('inventory-list').style.display = tab === 'inventory' ? 'grid' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(tab === 'shop') document.querySelector('.tabs button:nth-child(1)').classList.add('active');
        else document.querySelector('.tabs button:nth-child(2)').classList.add('active');
    }

    // --- LOGIC MUA & ĐẶT ĐỒ ---
    async function buyItem(id) {
        try {
            const res = await fetch('/api/house/buy', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ itemId: id })
            });
            const d = await res.json();
            if(res.ok) {
                alert(d.message);
                myScore = d.newScore;
                myInventory.push(id);
                updateUI();
            } else {
                alert(d.message);
            }
        } catch(e) { alert("Lỗi kết nối!"); }
    }

    function spawnItem(itemId) {
        // Lấy từ kho ra (Xóa 1 cái trong kho client để tránh đặt vô hạn)
        const idx = myInventory.indexOf(itemId);
        if(idx > -1) {
            myInventory.splice(idx, 1);
            updateUI();
            // Đặt vào giữa phòng
            placeItemVisual(itemId, 250, 200, Date.now()); 
        }
    }

    // --- LOGIC KÉO THẢ (DRAG & DROP) ---
    function placeItemVisual(itemId, x, y, uniqueId) {
        const itemInfo = shopData.find(i => i.id === itemId);
        if(!itemInfo) return;

        const el = document.createElement('div');
        el.className = 'furniture-item';
        el.textContent = itemInfo.icon;
        el.id = uniqueId || Date.now();
        el.dataset.itemId = itemId;
        
        // Vị trí
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        // Khi nhấn chuột phải (hoặc nhấn giữ trên mobile), món đồ sẽ biến mất
        el.oncontextmenu = (e) => {
            e.preventDefault(); // Ngăn menu chuột phải hiện lên
            removeItem(el.id, itemId);
        };
        // Sự kiện kéo thả
        el.onmousedown = dragMouseDown;
        el.ontouchstart = dragMouseDown;

        document.getElementById('room').appendChild(el);
        
        // Thêm vào danh sách quản lý
        placedItems.push({ uniqueId: el.id, itemId: itemId, element: el });
    }

    function dragMouseDown(e) {
        e.preventDefault();
        let elm = e.target;
        // Đưa lên trên cùng
        elm.style.zIndex = 1000;
        
        let pos3 = e.clientX || e.touches[0].clientX;
        let pos4 = e.clientY || e.touches[0].clientY;

        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
        document.ontouchend = closeDragElement;
        document.ontouchmove = elementDrag;

        function elementDrag(e) {
            e.preventDefault();
            let clientX = e.clientX || e.touches[0].clientX;
            let clientY = e.clientY || e.touches[0].clientY;

            let pos1 = pos3 - clientX;
            let pos2 = pos4 - clientY;
            pos3 = clientX;
            pos4 = clientY;

            // Tính toán vị trí mới
            let newTop = (elm.offsetTop - pos2);
            let newLeft = (elm.offsetLeft - pos1);
            
            // Giới hạn trong phòng
            const room = document.getElementById('room');
            if(newTop < 0) newTop = 0;
            if(newLeft < 0) newLeft = 0;
            if(newTop > room.clientHeight - 50) newTop = room.clientHeight - 50;
            if(newLeft > room.clientWidth - 50) newLeft = room.clientWidth - 50;

            elm.style.top = newTop + "px";
            elm.style.left = newLeft + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
            elm.style.zIndex = ""; // Trả lại zIndex
        }
    }
function removeItem(uniqueId, itemId) {
    // 1. Xóa phần tử khỏi màn hình (DOM)
    const el = document.getElementById(uniqueId);
    if (el) el.remove();

    // 2. Xóa khỏi danh sách các đồ đang đặt
    placedItems = placedItems.filter(item => item.uniqueId != uniqueId);

    // 3. Trả lại món đồ đó vào kho đồ (inventory)
    myInventory.push(itemId);

    // 4. Cập nhật lại giao diện Kho Đồ để bé thấy món đồ quay trở lại
    updateUI();
    
    console.log("Đã thu hồi món đồ:", itemId);
}
    // --- LƯU NHÀ ---
    // --- LƯU NHÀ ---
async function saveHouse() {
    // 1. Thu thập vị trí các đồ vật đang đặt trong phòng
    const itemsToSave = placedItems.map(obj => ({
        id: obj.itemId,
        uniqueId: obj.uniqueId,
        x: obj.element.offsetLeft,
        y: obj.element.offsetTop
    }));

    try {
        // 2. Gọi API để lưu đồng thời cả vị trí đồ đạc và kho đồ (inventory)
        const res = await fetch('/api/house/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                items: itemsToSave, 
                inventory: myInventory 
            })
        });
        const result = await res.json();
        alert("🎉 " + result.message);
    } catch(e) { 
        alert("❌ Lỗi kết nối!"); 
        console.error(e);
    }
}

// KHỞI CHẠY HỆ THỐNG KHI TẢI TRANG
init();
</script>

</body>
</html>
