<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Speaking Master - 100 Levels</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            font-family: 'Baloo 2', cursive;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            margin: 0; padding: 20px; box-sizing: border-box;
        }
        h1 {
            color: #fff; text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            font-size: 2.8rem; margin: 10px 0 20px; text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 30px; border-radius: 50px;
        }
        .container {
            width: 100%; max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center; border: 4px solid #fff;
        }
        .level-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px; max-height: 60vh; overflow-y: auto; padding: 10px;
        }
        .level-btn {
            width: 100%; aspect-ratio: 1; border-radius: 20px; border: none; 
            font-weight: 800; font-size: 1.2rem; cursor: pointer;
            background: #dfe6e9; color: #b2bec3; 
            box-shadow: 0 5px 0 #b2bec3; font-family: inherit;
        }
        .level-btn.unlocked { background: linear-gradient(to bottom, #74b9ff, #0984e3); color: white; box-shadow: 0 5px 0 #06528d; }
        .level-btn.current { background: linear-gradient(to bottom, #ffeaa7, #fab1a0); color: #d35400; transform: scale(1.1); border: 3px solid #fff; }
        #game-area { display: none; }
        .sentence-card { background: #fff; border-radius: 25px; padding: 30px 20px; margin: 20px auto; box-shadow: 0 10px 25px rgba(108, 92, 231, 0.15); }
        .sentence-text { font-size: 2.5rem; color: #2d3436; margin: 0; font-weight: 800; }
        .translation { font-size: 1.2rem; color: #636e72; background: #f1f2f6; display: inline-block; padding: 5px 15px; border-radius: 20px; margin-top: 10px;}
        .mic-btn { width: 90px; height: 90px; border-radius: 50%; border: none; background: linear-gradient(135deg, #0984e3, #74b9ff); color: white; font-size: 2.5rem; cursor: pointer; margin: 20px auto; display: block; box-shadow: 0 10px 20px rgba(9, 132, 227, 0.3); transition: 0.3s; }
        .mic-btn.recording { background: linear-gradient(135deg, #ff7675, #d63031); transform: scale(1.1); }
        .result-box { min-height: 80px; padding: 15px; border-radius: 15px; margin-top: 10px; }
        .score-text { font-size: 1.8rem; font-weight: bold; margin-top: 5px; }
        .btn-action { padding: 12px 25px; border-radius: 30px; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; color: white; font-family: inherit; }
        .btn-home { background: #636e72; } .btn-back { background: #a29bfe; }
    </style>
</head>
<body>

    <h1>🇬🇧 English Master 🇬🇧</h1>

    <div class="container">
        <div id="level-selection-area">
            <h2>🏆 Chọn Cấp Độ (Select Level)</h2>
            <div class="level-grid" id="level-buttons"></div>
            <a href="index.html" class="btn-action btn-home">🏠 Về Trang Chủ</a>
        </div>

        <div id="game-area">
            <h3 id="level-title" style="color: #0984e3; margin-top: 0;">LEVEL 1</h3>
            <div class="sentence-card">
                <p id="text-to-read" class="sentence-text">Hello world</p>
                <p id="text-translation" class="translation">Xin chào thế giới</p>
            </div>
            
            <button id="record-btn" class="mic-btn">🎙️</button>
            
            <div class="result-box" id="result-container">
                <p id="result-text" style="color: #636e72; font-style: italic;">Nhấn vào micro và đọc to nhé!</p>
                <div id="score-display" class="score-text"></div>
            </div>

            <button id="back-to-levels-btn" class="btn-action btn-back">⬅️ Chọn bài khác</button>
        </div>
    </div>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        }

        // --- DỮ LIỆU LEVEL ---
        const levels = [
            { id: 1, text: 'Cat', trans: 'Con mèo' },
            { id: 2, text: 'Dog', trans: 'Con chó' },
            { id: 3, text: 'Apple', trans: 'Quả táo' },
            { id: 4, text: 'Ball', trans: 'Quả bóng' },
            { id: 5, text: 'Hello', trans: 'Xin chào' },
            { id: 6, text: 'Red', trans: 'Màu đỏ' },
            { id: 7, text: 'Blue', trans: 'Màu xanh dương' },
            { id: 8, text: 'Good morning', trans: 'Chào buổi sáng' },
            { id: 9, text: 'Thank you', trans: 'Cảm ơn' },
            { id: 10, text: 'I like milk', trans: 'Tôi thích sữa' }
        ];
        // Tạo thêm level giả
        while(levels.length < 100) {
            let nextId = levels.length + 1;
            levels.push({ id: nextId, text: 'I can speak English', trans: 'Tôi có thể nói tiếng Anh' });
        }

        let unlockedLevel = 1;
        let currentLevel = 1;
        
        async function init() {
            try {
                const res = await fetch('/api/user/progress');
                if (res.ok) {
                    const data = await res.json();
                    unlockedLevel = data.englishSpeechLevel || 1;
                }
            } catch(e) {}
            renderLevels();
        }

        function renderLevels() {
            const list = document.getElementById('level-buttons');
            list.innerHTML = '';
            levels.forEach(lvl => {
                const btn = document.createElement('button');
                const icon = lvl.id <= unlockedLevel ? lvl.id : '🔒';
                btn.innerHTML = `<span>${icon}</span>`;
                btn.className = `level-btn ${lvl.id <= unlockedLevel ? 'unlocked' : ''} ${lvl.id === unlockedLevel ? 'current' : ''}`;
                if (lvl.id <= unlockedLevel) btn.onclick = () => startGame(lvl.id);
                else btn.disabled = true;
                list.appendChild(btn);
            });
        }

        function startGame(id) {
            currentLevel = id;
            const data = levels.find(l => l.id === id);
            document.getElementById('level-selection-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('level-title').textContent = `LEVEL ${id}`;
            document.getElementById('text-to-read').textContent = data.text;
            document.getElementById('text-translation').textContent = data.trans;
            resetGameUI();
        }

        function resetGameUI() {
            document.getElementById('result-text').textContent = "Nhấn vào micro và đọc to nhé!";
            document.getElementById('score-display').textContent = "";
            document.getElementById('record-btn').classList.remove('recording');
            document.getElementById('result-container').style.background = "transparent";
        }

        // --- THUẬT TOÁN SO SÁNH (LEVENSHTEIN) ---
        function similarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        // --- XỬ LÝ GHI ÂM ---
        const recordBtn = document.getElementById('record-btn');
        recordBtn.addEventListener('click', () => {
            if (!recognition) return alert("Trình duyệt không hỗ trợ!");
            if (recordBtn.classList.contains('recording')) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                    recordBtn.classList.add('recording');
                    document.getElementById('result-text').textContent = "Đang nghe... Bé đọc đi nào!";
                } catch(e) {}
            }
        });

        if (recognition) {
            recognition.onresult = (event) => {
                recordBtn.classList.remove('recording');
                const spoken = event.results[0][0].transcript;
                document.getElementById('result-text').textContent = `Bé đã nói: "${spoken}"`;
                checkResult(spoken);
            };
            recognition.onerror = () => {
                recordBtn.classList.remove('recording');
                document.getElementById('result-text').textContent = "Không nghe rõ, thử lại nhé!";
            };
            recognition.onspeechend = () => recordBtn.classList.remove('recording');
        }
        // --- THUẬT TOÁN SO SÁNH CHÍNH XÁC (LEVENSHTEIN) ---
        function similarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }
        function checkResult(spoken) {
            const target = levels.find(l => l.id === currentLevel).text;
            // Làm sạch chuỗi
            const cleanSpoken = spoken.toLowerCase().replace(/[.,!?]/g, '').trim();
            const cleanTarget = target.toLowerCase().replace(/[.,!?]/g, '').trim();

            // Tính độ chính xác
            const accuracy = similarity(cleanSpoken, cleanTarget);
            const percent = Math.round(accuracy * 100);
            
            const scoreDisplay = document.getElementById('score-display');
            const resultContainer = document.getElementById('result-container');

            if (percent >= 70) {
                // ĐÚNG (>= 70%)
                scoreDisplay.innerHTML = `🎉 CHÍNH XÁC! (${percent}%) 🎉`;
                scoreDisplay.style.color = "#27ae60";
                resultContainer.style.background = "#dff9fb";
                saveWin();
            } else {
                // SAI
                scoreDisplay.innerHTML = `Chưa đạt (${percent}%). Cần 70% để qua màn! 😅`;
                scoreDisplay.style.color = "#d63031";
                resultContainer.style.background = "#ffeaa7";
            }
        }

        async function saveWin() {
            if (currentLevel === unlockedLevel && unlockedLevel < 100) unlockedLevel++;
            try {
                const res = await fetch('/api/game/english-speech-win', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ level: currentLevel, score: 10 })
                });
                const d = await res.json();
                if(d.newLevel) unlockedLevel = d.newLevel;
                setTimeout(() => document.getElementById('back-to-levels-btn').click(), 2000);
            } catch(e) {}
        }

        document.getElementById('back-to-levels-btn').addEventListener('click', () => {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('level-selection-area').style.display = 'block';
            renderLevels();
        });

        init();
    </script>
</body>
</html>
