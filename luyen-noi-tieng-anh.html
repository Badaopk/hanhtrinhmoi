        let unlockedLevel = 1;
        let currentLevel = 1;
        
        async function init() {
            try {
                const res = await fetch('/api/user/progress');
                if (res.ok) {
                    const data = await res.json();
                    unlockedLevel = data.englishSpeechLevel || 1;
                }
            } catch(e) {}
            renderLevels();
        }

        function renderLevels() {
    const list = document.getElementById('level-buttons');
    list.innerHTML = '';
    
    levels.forEach(lvl => {
        const btn = document.createElement('button');
        // Icon: Nếu mở khóa rồi thì hiện số, chưa thì hiện ổ khóa
        const icon = lvl.id <= unlockedLevel ? lvl.id : '🔒';
        
        btn.innerHTML = `<span>${icon}</span>`;
        
        // Thêm class màu sắc
        btn.className = `level-btn ${lvl.id <= unlockedLevel ? 'unlocked' : ''} ${lvl.id === unlockedLevel ? 'current' : ''}`;
        
        // Xử lý sự kiện click
        if (lvl.id <= unlockedLevel) {
            btn.onclick = () => startGame(lvl.id);
        } else {
            btn.disabled = true;
        }
        
        list.appendChild(btn);

        // --- NÂNG CẤP: Tự động cuộn đến màn đang chơi ---
        if (lvl.id === unlockedLevel) {
            setTimeout(() => {
                btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500); // Đợi 0.5s cho giao diện vẽ xong rồi cuộn
        }
    });
}
// --- HÀM ĐỌC MẪU (TEXT TO SPEECH) ---
function speakSample() {
    // Lấy nội dung chữ tiếng Anh hiện tại
    const text = document.getElementById('text-to-read').textContent;
    
    // Tạo đối tượng giọng nói
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US'; // Giọng Mỹ
    utterance.rate = 0.8;     // Tốc độ 0.8 (Hơi chậm để bé dễ nghe)
    utterance.pitch = 1.1;    // Tông giọng cao hơn xíu cho vui tai
    
    // Hủy các giọng đang đọc dở (nếu có) và đọc câu mới
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
}

        function startGame(id) {
            currentLevel = id;
            const data = levels.find(l => l.id === id);
            document.getElementById('level-selection-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('level-title').textContent = `LEVEL ${id}`;
            document.getElementById('text-to-read').textContent = data.text;
            document.getElementById('text-translation').textContent = data.trans;
            resetGameUI();
        }

        function resetGameUI() {
            document.getElementById('result-text').textContent = "Nhấn vào micro và đọc to nhé!";
            document.getElementById('score-display').textContent = "";
            document.getElementById('record-btn').classList.remove('recording');
            document.getElementById('result-container').style.background = "transparent";
        }

        // --- THUẬT TOÁN SO SÁNH (LEVENSHTEIN) ---
        function similarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        // --- XỬ LÝ GHI ÂM ---
        const recordBtn = document.getElementById('record-btn');
        recordBtn.addEventListener('click', () => {
            if (!recognition) return alert("Trình duyệt không hỗ trợ!");
            if (recordBtn.classList.contains('recording')) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                    recordBtn.classList.add('recording');
                    document.getElementById('result-text').textContent = "Đang nghe... Bé đọc đi nào!";
                } catch(e) {}
            }
        });

        if (recognition) {
            recognition.onresult = (event) => {
                recordBtn.classList.remove('recording');
                const spoken = event.results[0][0].transcript;
                document.getElementById('result-text').textContent = `Bé đã nói: "${spoken}"`;
                checkResult(spoken);
            };
            recognition.onerror = () => {
                recordBtn.classList.remove('recording');
                document.getElementById('result-text').textContent = "Không nghe rõ, thử lại nhé!";
            };
            recognition.onspeechend = () => recordBtn.classList.remove('recording');
        }
        // --- THUẬT TOÁN SO SÁNH CHÍNH XÁC (LEVENSHTEIN) ---
        function similarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }
        function checkResult(spoken) {
            const target = levels.find(l => l.id === currentLevel).text;
            // Làm sạch chuỗi
            const cleanSpoken = spoken.toLowerCase().replace(/[.,!?]/g, '').trim();
            const cleanTarget = target.toLowerCase().replace(/[.,!?]/g, '').trim();

            // Tính độ chính xác
            const accuracy = similarity(cleanSpoken, cleanTarget);
            const percent = Math.round(accuracy * 100);
            
            const scoreDisplay = document.getElementById('score-display');
            const resultContainer = document.getElementById('result-container');

            if (percent >= 70) {
                // ĐÚNG (>= 70%)
                scoreDisplay.innerHTML = `🎉 CHÍNH XÁC! (${percent}%) 🎉`;
                scoreDisplay.style.color = "#27ae60";
                resultContainer.style.background = "#dff9fb";
                saveWin();
            } else {
                // SAI
                scoreDisplay.innerHTML = `Chưa đạt (${percent}%). Cần 70% để qua màn! 😅`;
                scoreDisplay.style.color = "#d63031";
                resultContainer.style.background = "#ffeaa7";
            }
        }

        async function saveWin() {
            if (currentLevel === unlockedLevel && unlockedLevel < 400) unlockedLevel++;
            try {
                const res = await fetch('/api/game/english-speech-win', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ level: currentLevel, score: 10 })
                });
                const d = await res.json();
                if(d.newLevel) unlockedLevel = d.newLevel;
                setTimeout(() => document.getElementById('back-to-levels-btn').click(), 2000);
            } catch(e) {}
        }

        document.getElementById('back-to-levels-btn').addEventListener('click', () => {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('level-selection-area').style.display = 'block';
            renderLevels();
        });

        init();
    </script>
