<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Quản Lý Hành Tinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #f1f2f6; font-family: 'Baloo 2', cursive; margin: 0; padding: 20px; }
        .admin-container { max-width: 1500px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* Layout Công cụ phía trên */
        .top-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #fdfdfd; border: 1px solid #eee; padding: 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; color: #2980b9; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .form-group label { width: 100px; font-weight: bold; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; }

        /* Bảng người dùng */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; table-layout: fixed; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 0.85rem; word-wrap: break-word; }
        th { background: #f8f9fa; color: #333; text-align: center; }
        
        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
        .level-grid input { width: 100%; padding: 4px; box-sizing: border-box; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; }
        
        .quest-box { max-height: 80px; overflow-y: auto; background: #fffcf0; padding: 5px; border-radius: 5px; font-size: 0.75rem; border: 1px solid #f9e79f; }
        .quest-line { border-bottom: 1px solid #eee; padding: 2px 0; }

        /* Nút bấm */
        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-family: inherit; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-save { background: #2ecc71; width: 100%; margin-bottom: 4px; }
        .btn-quest { background: #8e44ad; width: 100%; margin-bottom: 4px; }
        .btn-lock { background: #7f8c8d; width: 48%; }
        .btn-lock.active { background: #e74c3c; }
        .btn-delete { background: #c0392b; width: 48%; }
        .btn-reset { background: #3498db; width: 100%; margin-top: 4px; }
        .btn-transfer { background: #1abc9c; width: 100%; margin-top: 4px; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-content h2 { margin-top: 0; color: #8e44ad; }
        .modal-content label { display: block; margin: 10px 0 5px; font-weight: bold; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .role-suspended { color: #e74c3c; text-decoration: line-through; opacity: 0.6; }
        #message-log { text-align: center; font-weight: bold; margin: 10px 0; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>🚀 QUẢN TRỊ HÀNH TINH MƠ ƯỚC</h1>

    <div id="message-log"></div>

    <div class="top-tools">
        <div class="card">
            <h3>👤 Tạo Tài Khoản</h3>
            <form id="create-user-form">
                <div class="form-group">
                    <label>Tên:</label>
                    <input type="text" id="new-username" required minlength="3">
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="new-password" required minlength="3">
                </div>
                <div class="form-group">
                    <label>Vai trò:</label>
                    <select id="new-role" onchange="toggleParentCode()">
                        <option value="parent">Phụ Huynh</option>
                        <option value="child">Trẻ Em</option>
                    </select>
                </div>
                <div class="form-group" id="p-code-group" style="display:none">
                    <label>Mã PH:</label>
                    <input type="text" id="new-parentCode" placeholder="Nhập mã PH của cha/mẹ">
                </div>
                <button type="submit" class="btn btn-save" style="margin-top:10px">Tạo Ngay</button>
            </form>
        </div>

        <div class="card" style="background: #fffbe6;">
            <h3>⚙️ Hệ Thống</h3>
            <div class="form-group">
                <label>Broadcast:</label>
                <textarea id="bc-msg" rows="2" placeholder="Gửi tin nhắn toàn server..."></textarea>
            </div>
            <button class="btn btn-quest" onclick="sendBroadcast()">📢 Phát Thông Báo</button>
            <hr style="margin: 15px 0; border: 0.5px solid #eee;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="mt-status" style="font-weight: bold;">Trạng thái: ---</span>
                <button id="mt-btn" class="btn" style="width: 150px;" onclick="toggleMaintenance()">Đang tải...</button>
            </div>
        </div>

        <div class="card">
            <h3>🤖 Tạo Bot Thử Nghiệm</h3>
            <p style="font-size: 0.8rem; color: #666;">Tạo nhanh các cặp tài khoản ảo.</p>
            <div class="form-group">
                <label>Số lượng:</label>
                <input type="number" id="bot-count" value="5" min="1" max="50">
            </div>
            <button class="btn btn-reset" style="background:#e67e22" onclick="createBots()">Chạy Tạo Bot</button>
        </div>
    </div>

    <table id="user-table">
        <thead>
            <tr>
                <th style="width: 12%;">Tên Bé</th>
                <th style="width: 7%;">Vai trò</th>
                <th style="width: 8%;">Điểm</th>
                <th style="width: 22%;">Cấp Độ (Vua|Car|GH|OC)</th>
                <th style="width: 18%;">Nhiệm Vụ</th>
                <th style="width: 8%;">Hạn Chơi</th>
                <th style="width: 25%;">Hành Động</th>
            </tr>
        </thead>
        <tbody id="user-body">
            <tr><td colspan="7" style="text-align:center;">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>
</div>

<div id="quest-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-user-title">Giao Nhiệm Vụ</h2>
        <label>Loại Trò Chơi:</label>
        <select id="q-type">
            <option value="Thám tử">🕵️ Thám Tử</option>
            <option value="Ô Chữ">🧩 Ô Chữ</option>
            <option value="Tiếng Anh">🇬🇧 Tiếng Anh</option>
            <option value="Cờ Vua">♟️ Cờ Vua</option>
            <option value="Ghép Hình">🖼️ Ghép Hình</option>
            <option value="Sáng Tác">✍️ Sáng Tác</option>
            <option value="Cờ Vây">⚫ Cờ Vây</option>
            <option value="Phục Kích">🟢 Phục Kích</option>
            <option value="Kiểm Tra">📝 Bài Kiểm Tra</option>
        </select>
        <label>Số lần cần hoàn thành:</label>
        <input type="number" id="q-target" value="1" min="1">
        <label>Điểm thưởng (+):</label>
        <input type="number" id="q-reward" value="100">
        <label>Điểm phạt quá giờ (-):</label>
        <input type="number" id="q-penalty" value="20">
        <label>Hạn giờ (Giây - 0 là không hạn):</label>
        <input type="number" id="q-time" value="0">
        <button class="btn btn-save" onclick="submitQuest()">Xác Nhận Giao</button>
        <button class="btn btn-lock" style="width:100%; margin-top:5px" onclick="closeModal()">Hủy</button>
    </div>
</div>

<script>
    let currentEditingUser = "";

    // 1. Tải danh sách người dùng
    async function fetchUsers() {
        try {
            const res = await fetch('/api/admin/all-users');
            if (!res.ok) throw new Error("Từ chối truy cập");
            const users = await res.json();
            renderTable(users);
        } catch (e) {
            document.getElementById('user-body').innerHTML = `<tr><td colspan="7" style="color:red; text-align:center">Lỗi: ${e.message}. Vui lòng đăng nhập lại Admin.</td></tr>`;
        }
    }

    function renderTable(users) {
        const body = document.getElementById('user-body');
        body.innerHTML = '';
        users.sort((a,b) => a.role.localeCompare(b.role)).forEach(u => {
            if(u.role === 'admin' && u.username !== 'Admin') return;

            const isLocked = u.isSuspended === true;
            const qSum = (u.quests || []).map(q => `
                <div class="quest-line">
                    ${q.isDaily ? '📅' : '🌟'} ${q.taskType}: ${q.progress}/${q.target}
                </div>`).join('') || '<span style="color:#999">Trống</span>';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong class="${isLocked ? 'role-suspended' : ''}">${u.username}</strong></td>
                <td><span style="font-weight:bold; color:${u.role==='parent'?'#2980b9':'#2c3e50'}">${u.role}</span></td>
                <td><input type="number" id="score-${u.username}" value="${u.score}" style="width:60px;"></td>
                <td>
                    <div class="level-grid">
                        <input type="number" id="chess-${u.username}" value="${u.chessLevel || 1}" title="Cờ Vua">
                        <input type="number" id="caro-${u.username}" value="${u.caroLevel || 1}" title="Caro">
                        <input type="number" id="memory-${u.username}" value="${u.memoryLevel || 1}" title="Ghép Hình">
                        <input type="number" id="crossword-${u.username}" value="${u.crosswordLevel || 1}" title="Ô Chữ">
                    </div>
                </td>
                <td><div class="quest-box">${qSum}</div></td>
                <td><input type="number" id="limit-${u.username}" value="${u.playtimeLimitMinutes || 0}" style="width:45px;"></td>
                <td>
                    <button class="btn btn-save" onclick="saveUser('${u.username}')">Lưu</button>
                    <button class="btn btn-quest" onclick="openModal('${u.username}')" ${u.role !== 'child' ? 'disabled' : ''}>Giao NV</button>
                    <div style="display:flex; gap:4px">
                        <button class="btn btn-lock ${isLocked ? 'active' : ''}" onclick="toggleLock('${u.username}')">${isLocked ? 'Mở' : 'Khóa'}</button>
                        <button class="btn btn-delete" onclick="deleteUser('${u.username}')">Xóa</button>
                    </div>
                    <button class="btn btn-reset" onclick="resetPassword('${u.username}')">Reset PW</button>
                    ${u.role === 'child' ? `<button class="btn btn-transfer" onclick="transferParent('${u.username}')">Chuyển PH</button>` : ''}
                </td>
            `;
            body.appendChild(row);
        });
    }

    // 2. Các hàm xử lý dữ liệu
    async function saveUser(username) {
        const data = {
            username,
            score: document.getElementById(`score-${username}`).value,
            chessLevel: document.getElementById(`chess-${username}`).value,
            caroLevel: document.getElementById(`caro-${username}`).value,
            memoryLevel: document.getElementById(`memory-${username}`).value,
            crosswordLevel: document.getElementById(`crossword-${username}`).value,
            playtimeLimitMinutes: document.getElementById(`limit-${username}`).value
        };
        const res = await fetch('/api/admin/update-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if(res.ok) { showMessage("✅ Đã lưu thay đổi!"); fetchUsers(); }
    }

    async function deleteUser(username) {
        if(!confirm(`Xóa vĩnh viễn ${username}?`)) return;
        await fetch('/api/admin/delete-user', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username}) });
        fetchUsers();
    }

    async function toggleLock(username) {
        await fetch('/api/admin/toggle-suspend', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username}) });
        fetchUsers();
    }

    async function resetPassword(username) {
        if(!confirm(`Đặt lại mật khẩu ${username} về 123456?`)) return;
        const res = await fetch('/api/admin/reset-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({username}) });
        const d = await res.json(); alert(d.message);
    }

    async function transferParent(childUsername) {
        const newCode = prompt(`Nhập Mã Phụ Huynh mới cho ${childUsername}:`);
        if(!newCode) return;
        const res = await fetch('/api/admin/transfer-child', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({childUsername, newParentCode: newCode}) });
        const d = await res.json(); alert(d.message); fetchUsers();
    }

    // 3. Logic Nhiệm vụ (Modal)
    function openModal(username) {
        currentEditingUser = username;
        document.getElementById('modal-user-title').innerText = "Giao NV cho: " + username;
        document.getElementById('quest-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('quest-modal').style.display = 'none'; }

    async function submitQuest() {
        const data = {
            username: currentEditingUser,
            taskType: document.getElementById('q-type').value,
            target: document.getElementById('q-target').value,
            reward: document.getElementById('q-reward').value,
            penalty: document.getElementById('q-penalty').value,
            timeLimit: document.getElementById('q-time').value
        };
        const res = await fetch('/api/admin/assign-quest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        alert(result.message);
        closeModal();
        fetchUsers();
    }

    // 4. Các công cụ hệ thống
    async function sendBroadcast() {
        const msg = document.getElementById('bc-msg').value;
        if(!msg) return;
        await fetch('/api/admin/broadcast', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({message: msg}) });
        alert("📢 Đã phát tin nhắn toàn hệ thống!");
        document.getElementById('bc-msg').value = '';
    }

    async function createBots() {
        const count = document.getElementById('bot-count').value;
        if(!confirm(`Tạo ${count} cặp bot thử nghiệm?`)) return;
        const res = await fetch('/api/admin/create-random-batch', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({count}) });
        const d = await res.json(); alert(d.message); fetchUsers();
    }

    async function checkMT() {
        const res = await fetch('/api/admin/maintenance-status');
        const data = await res.json();
        const btn = document.getElementById('mt-btn');
        const statusText = document.getElementById('mt-status');
        
        statusText.innerText = "Trạng thái: " + (data.maintenanceMode ? "ĐANG BẢO TRÌ ⚠️" : "HOẠT ĐỘNG ✅");
        statusText.style.color = data.maintenanceMode ? "#e74c3c" : "#2ecc71";
        btn.innerText = data.maintenanceMode ? "TẮT BẢO TRÌ" : "BẬT BẢO TRÌ";
        btn.className = data.maintenanceMode ? "btn btn-save" : "btn btn-lock active";
    }

    async function toggleMaintenance() {
        if(!confirm("Thay đổi trạng thái bảo trì hệ thống?")) return;
        await fetch('/api/admin/maintenance-toggle', { method: 'POST' });
        checkMT();
    }

    // 5. Logic form tạo user
    function toggleParentCode() {
        document.getElementById('p-code-group').style.display = document.getElementById('new-role').value === 'child' ? 'flex' : 'none';
    }

    document.getElementById('create-user-form').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            username: document.getElementById('new-username').value,
            password: document.getElementById('new-password').value,
            role: document.getElementById('new-role').value,
            parentCode: document.getElementById('new-parentCode').value
        };
        const res = await fetch('/api/admin/create-user', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
        const d = await res.json();
        alert(d.message);
        if(res.ok) { e.target.reset(); toggleParentCode(); fetchUsers(); }
    };

    function showMessage(msg) {
        const log = document.getElementById('message-log');
        log.innerText = msg; log.style.color = "#2ecc71";
        setTimeout(() => log.innerText = "", 3000);
    }

    // Khởi chạy
    fetchUsers();
    checkMT();
</script>
</body>
</html>
