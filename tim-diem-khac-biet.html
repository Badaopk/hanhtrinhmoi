<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thám Tử Tài Ba - 100 Cấp Độ</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #2c3e50; font-family: 'Baloo 2', cursive; color: white; text-align: center; margin: 0; user-select: none; }
        
        .header { padding: 15px; background: rgba(0,0,0,0.2); margin-bottom: 10px; }
        .info-bar { display: flex; justify-content: center; gap: 30px; font-size: 1.3rem; font-weight: bold; }
        
        .game-area { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
            max-width: 100%; padding: 10px;
        }
        
        .canvas-wrapper { position: relative; }
        
        canvas { 
            background: white; border-radius: 15px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: crosshair; touch-action: none;
            border: 4px solid #fff;
        }

        /* Marker đánh dấu */
        .marker { 
            position: absolute; width: 40px; height: 40px; 
            border: 4px solid #2ecc71; border-radius: 50%; 
            transform: translate(-50%, -50%); pointer-events: none; 
            box-shadow: 0 0 10px #2ecc71, inset 0 0 10px #2ecc71;
            animation: pulse 0.5s;
        }
        
        .error-marker { 
            position: absolute; width: 30px; height: 30px; 
            border: 3px solid #e74c3c; background: rgba(231,76,60,0.3); 
            border-radius: 50%; transform: translate(-50%, -50%); 
            animation: fadeOut 0.5s forwards; pointer-events: none;
        }

        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } }

        .btn { padding: 12px 25px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; margin: 10px; font-size: 1rem; transition: 0.2s; color: white; font-family: inherit;}
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0 0 10px 0; text-shadow: 2px 2px 0 #000;">🕵️ THÁM TỬ TÀI BA</h1>
        <div class="info-bar">
            <span style="color:#f1c40f">Cấp độ: <span id="lvl">1</span></span>
            <span style="color:#2ecc71">Tìm: <span id="found-count">0</span>/<span id="total-count">5</span></span>
        </div>
    </div>

    <div class="game-area">
        <div class="canvas-wrapper" id="box1">
            <div style="position:absolute; top:5px; left:10px; color:#333; font-weight:bold; background:rgba(255,255,255,0.7); padding:2px 8px; border-radius:5px;">ẢNH GỐC</div>
            <canvas id="c1" width="450" height="350"></canvas>
        </div>
        <div class="canvas-wrapper" id="box2">
            <div style="position:absolute; top:5px; left:10px; color:#333; font-weight:bold; background:rgba(255,255,255,0.7); padding:2px 8px; border-radius:5px;">TÌM ĐIỂM KHÁC</div>
            <canvas id="c2" width="450" height="350"></canvas>
        </div>
    </div>

    <div>
        <button class="btn" style="background:#3498db;" onclick="useHint()">💡 Gợi Ý (<span id="hints">3</span>)</button>
        <button class="btn" style="background:#e74c3c;" onclick="window.location.href='index.html'">🚪 Thoát</button>
    </div>

    <script>
        let level = 1;
        let diffs = []; 
        let found = [];
        let items = []; // Lưu trữ toàn bộ vật thể để vẽ lại
        let hintCount = 3;
        let startTime;
        
        const canvas1 = document.getElementById('c1');
        const canvas2 = document.getElementById('c2');
        const ctx1 = canvas1.getContext('2d');
        const ctx2 = canvas2.getContext('2d');

        // Bộ sưu tập khó hơn (các hình giống nhau)
        const assets = {
            nature: ['🌲','🌳','🌴','🌵','🌿','☘️','🍀','🍁','🍂','🍄'],
            animals: ['🐶','🐕','🐩','🐺','🦊','🐱','🐈','🦁','🐯','🐆'],
            faces: ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇'],
            food: ['🍎','🍏','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🍒'],
            symbols: ['❤️','🧡','💛','💚','💙','💜','🤎','🖤','🤍','💔']
        };

        async function init() {
            try {
                const r = await fetch('/api/user/progress');
                const d = await r.json();
                level = d.detectiveLevel || 1;
            } catch(e) {}
            startLevel();
        }

        function startLevel() {
            startTime = Date.now();
            document.getElementById('lvl').textContent = level;
            document.querySelectorAll('.marker').forEach(e => e.remove()); // Xóa marker cũ
            
            generateLevelData();
            drawGame();
        }

        // --- 1. THUẬT TOÁN SINH MÀN CHƠI (NÂNG CAO) ---
        function generateLevelData() {
            items = [];
            diffs = [];
            found = [];

            // Độ khó tăng dần
            const itemCount = 20 + Math.floor(level * 1.5); // Càng cao càng nhiều đồ (rối mắt)
            const diffCount = Math.min(3 + Math.floor(level / 10), 7); // Từ 3 đến 7 điểm khác biệt
            
            // Chọn chủ đề
            const keys = Object.keys(assets);
            const theme = assets[keys[Math.floor(Math.random() * keys.length)]];
            const bgColors = ['#FFFAF0', '#F0FFF0', '#F0F8FF', '#FFF0F5', '#F5F5DC'];
            const bgColor = bgColors[Math.floor(Math.random() * bgColors.length)];

            // Sinh vật thể nền
            for(let i=0; i<itemCount; i++) {
                items.push({
                    char: theme[Math.floor(Math.random() * theme.length)],
                    x: 30 + Math.random() * (canvas1.width - 60),
                    y: 40 + Math.random() * (canvas1.height - 60),
                    size: 25 + Math.random() * 20, // Kích thước ngẫu nhiên
                    rotation: (Math.random() - 0.5) * 1, // Xoay nhẹ
                    isDiff: false
                });
            }

            // Chọn ra các điểm khác biệt
            let diffIndices = [];
            while(diffIndices.length < diffCount) {
                let idx = Math.floor(Math.random() * itemCount);
                if(!diffIndices.includes(idx)) diffIndices.push(idx);
            }

            diffIndices.forEach(idx => {
                let original = items[idx];
                let type = 'missing'; // Mặc định

                // Phân loại độ khó khác biệt
                if (level < 10) type = 'missing'; // Dễ: Mất hình
                else if (level < 30) type = Math.random() > 0.5 ? 'swap' : 'missing'; // Trung bình: Đổi hình
                else if (level < 60) type = 'rotate'; // Khó: Xoay ngược
                else if (level < 80) type = 'size'; // Rất khó: Bé đi / To lên
                else type = 'opacity'; // Siêu khó: Mờ đi

                // Tạo dữ liệu khác biệt
                let diffData = { ...original, type: type };
                
                if (type === 'swap') {
                    // Đổi thành hình khác trong cùng bộ (gây lú)
                    diffData.char = theme[(theme.indexOf(original.char) + 1) % theme.length];
                } else if (type === 'rotate') {
                    diffData.rotation += Math.PI; // Xoay 180 độ
                } else if (type === 'size') {
                    diffData.size *= 0.6; // Nhỏ đi
                } else if (type === 'opacity') {
                    diffData.opacity = 0.3; // Mờ đi
                }

                original.isDiff = true;
                original.diffData = diffData;
                diffs.push({ 
                    x: original.x, 
                    y: original.y, 
                    r: original.size, 
                    index: idx 
                });
            });

            document.getElementById('total-count').textContent = diffs.length;
            document.getElementById('found-count').textContent = 0;
            
            // Vẽ nền
            [ctx1, ctx2].forEach(ctx => {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas1.width, canvas1.height);
            });
        }

        // --- 2. HỆ THỐNG VẼ (RENDER) ---
        function drawGame() {
            // Vẽ lại toàn bộ item
            items.forEach(item => {
                // Vẽ bên trái (Luôn là gốc)
                drawItem(ctx1, item);

                // Vẽ bên phải
                if (item.isDiff) {
                    if (item.diffData.type !== 'missing') {
                        drawItem(ctx2, item.diffData);
                    }
                    // Nếu missing thì không vẽ gì
                } else {
                    drawItem(ctx2, item); // Vẽ y hệt
                }
            });
        }

        function drawItem(ctx, item) {
            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.rotate(item.rotation || 0);
            if (item.opacity) ctx.globalAlpha = item.opacity;
            
            ctx.font = `${item.size}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(item.char, 0, 0);
            
            ctx.restore();
        }

        // --- 3. XỬ LÝ TƯƠNG TÁC ---
        function handleInput(e) {
            const rect = e.target.getBoundingClientRect();
            // Tính tỉ lệ scale nếu canvas bị CSS co lại
            const scaleX = canvas2.width / rect.width;
            const scaleY = canvas2.height / rect.height;
            
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            let hit = false;

            diffs.forEach((d, i) => {
                if (!found.includes(i)) {
                    // Khoảng cách click
                    const dist = Math.sqrt((clickX - d.x)**2 + (clickY - d.y)**2);
                    // Bán kính click rộng hơn size vật thể một chút cho dễ bấm
                    if (dist < d.r * 1.2) {
                        hit = true;
                        found.push(i);
                        markDiff(d.x, d.y); // Đánh dấu
                        updateProgress();
                    }
                }
            });

            if (!hit) {
                // Hiệu ứng click sai (trên màn hình CSS)
                const errorX = e.clientX - rect.left;
                const errorY = e.clientY - rect.top;
                showError(errorX, errorY, e.target.parentElement);
                
                // Trừ thời gian hoặc điểm nếu muốn (Optional)
            }
        }

        // Hỗ trợ cả chuột và chạm
        canvas2.addEventListener('mousedown', handleInput);
        // canvas2.addEventListener('touchstart', (e) => handleInput(e.touches[0])); // Mobile logic

        function markDiff(x, y) {
            // Quy đổi tọa độ Canvas -> CSS % để đặt marker chính xác
            const leftPct = (x / canvas1.width) * 100 + '%';
            const topPct = (y / canvas1.height) * 100 + '%';

            ['box1', 'box2'].forEach(boxId => {
                const m = document.createElement('div');
                m.className = 'marker';
                m.style.left = leftPct;
                m.style.top = topPct;
                document.getElementById(boxId).appendChild(m);
            });
        }

        function showError(x, y, parent) {
            const m = document.createElement('div');
            m.className = 'error-marker';
            m.style.left = x + 'px';
            m.style.top = y + 'px';
            parent.appendChild(m);
            setTimeout(() => m.remove(), 500);
        }

        function updateProgress() {
            document.getElementById('found-count').textContent = found.length;
            if (found.length === diffs.length) {
                setTimeout(doWin, 500);
            }
        }

        function useHint() {
            if (hintCount <= 0) return alert("Hết lượt gợi ý!");
            const target = diffs.find((d, i) => !found.includes(i));
            if (target) {
                hintCount--;
                document.getElementById('hints').textContent = hintCount;
                markDiff(target.x, target.y);
                found.push(diffs.indexOf(target));
                updateProgress();
            }
        }

        async function doWin() {
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
            const timeSpent = Math.floor((Date.now() - startTime) / 1000);
            
            try {
                const res = await fetch('/api/game/detective-win', { 
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ timeTaken: timeSpent }) 
                });
                const d = await res.json();
                
                setTimeout(() => {
                    let msg = `🎉 XUẤT SẮC!\nBạn tìm ra hết trong ${timeSpent} giây.`;
                    if(d.newLevel) {
                        msg += `\n🆙 Lên cấp độ ${d.newLevel}!`;
                        level = d.newLevel;
                    } else {
                        level++;
                    }
                    alert(msg);
                    startLevel();
                }, 1000);
            } catch(e) {
                level++;
                setTimeout(startLevel, 2000);
            }
        }

        init();
    </script>
</body>
</html>
