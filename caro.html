<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cờ Caro Thử Thách - 100 Cấp Độ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: radial-gradient(circle, #3498db, #2980b9); color: white; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; font-family: 'Baloo 2', cursive; overscroll-behavior: none; }
        .game-layout { display: flex; gap: 20px; justify-content: center; padding: 20px; flex-wrap: wrap; width: 100%; box-sizing: border-box; }
        
        /* Bàn cờ */
        .board-container { background: #fff; padding: 10px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .caro-grid { display: grid; background: #bdc3c7; border: 2px solid #2c3e50; transition: opacity 0.3s; touch-action: manipulation; }
        .caro-grid.game-over { pointer-events: none; opacity: 0.8; }
        
        .cell { width: 30px; height: 30px; background: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; color: #333; border: 1px solid #ddd; }
        .cell:active { background: #f1f2f6; }
        .cell.X { color: #3498db; } .cell.O { color: #e74c3c; }
        .cell.last-move { background: #fff9c4; border: 2px solid #f1c40f; } /* Sửa lại highlight cho rõ */
        .cell.win { background: #2ecc71 !important; color: white; animation: pulse 0.5s infinite; }

        /* Sidebar & Menu */
        .sidebar { width: 95%; max-width: 350px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; text-align: center; min-height: 300px; }
        
        /* Tabs */
        .mode-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; opacity: 0.7; transition: 0.3s; font-family: inherit; font-size: 0.9rem; }
        .tab-btn.active { opacity: 1; transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .tab-pve { background: #f1c40f; color: #333; }
        .tab-pvp { background: #3498db; color: white; }
        .tab-local { background: #9b59b6; color: white; } /* Thêm style cho nút Local */

        .mode-content { display: none; }
        .mode-content.active { display: block; }

        .btn-game { width: 100%; padding: 12px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; margin-bottom: 8px; color: white; transition: 0.2s; font-size: 1rem; font-family: inherit; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn-game:active { transform: translateY(2px); box-shadow: none; }
        .btn-new { background: #2ecc71; } .btn-online { background: #3498db; } .btn-undo { background: #f39c12; }
        .room-input { width: 60%; padding: 10px; border-radius: 8px; border: none; text-align: center; font-weight: bold; font-size: 1rem; }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        /* Ẩn hiện menu */
        #menu-area { display: block; }
        #control-area { display: none; }
    </style>
</head>
<body>
    <div id="tourney-timer" style="background:#e74c3c; color:white; padding:10px; border-radius:10px; margin-bottom:10px; display:none; position:fixed; top:10px; right:10px; z-index:100;">
        ⚠️ GIẢI ĐẤU: Bé còn <span id="time-left" style="font-size:1.5rem; font-weight:bold;">10:00</span>
    </div>
    
    <div class="header-bar" style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 10px 20px; box-sizing: border-box;">
        <button class="btn-game" style="width: auto; background: #e74c3c; padding: 5px 15px;" onclick="window.location.href='index.html'">⬅️ Về</button>
        <h1 style="text-shadow: 2px 2px 0 #2c3e50; margin: 0; flex-grow: 1; text-align: center;">⭕ CARO ĐẠI CHIẾN ❌</h1>
        <div style="width: 50px;"></div>
    </div>

    <div class="game-layout">
        <div class="board-container" id="play-area" style="display:none;">
            <div id="caro-board" class="caro-grid"></div>
        </div>

        <div class="sidebar">
            <div class="mode-tabs">
                <button class="tab-btn tab-pve active" onclick="switchMode('pve')">🤖 Đấu Máy</button>
                <button class="tab-btn tab-pvp" onclick="switchMode('pvp')">⚔️ Online</button>
                <button class="tab-btn tab-local" onclick="switchMode('local')">👥 2 Người</button>
            </div>

            <div style="background: #f1c40f; padding: 10px; border-radius: 10px; margin: 15px 0; color:#333; font-weight:bold;">
                <span id="info-display">Cấp độ hiện tại: <span id="lvl-display" style="font-size: 1.5rem;">1</span></span>
            </div>
            
            <div id="status" style="margin-bottom: 15px; font-weight:bold; min-height:25px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 5px;">Chọn chế độ chơi...</div>

            <div id="pve-panel" class="mode-content active">
                <select id="ai-level-select" style="width:100%; padding:10px; border-radius:8px; margin-bottom:10px; font-size: 1rem;"></select>
                <select id="board-size-select" style="width:100%; padding:10px; border-radius:8px; margin-bottom:10px; font-size: 1rem;">
                    <option value="15">Bàn nhỏ (15x15)</option>
                    <option value="20" selected>Bàn lớn (20x20)</option>
                </select>
                <button class="btn-game btn-new" onclick="startAiGame()">▶️ Bắt Đầu</button>
            </div>

            <div id="pvp-panel" class="mode-content">
                <button class="btn-game btn-online" onclick="findRandomMatch()">🎲 Ghép Ngẫu Nhiên</button>
                <hr style="border:0.5px solid rgba(255,255,255,0.3); margin:10px 0;">
                <div style="display:flex; gap:5px;">
                    <button class="btn-game btn-new" style="flex:1" onclick="createRoom()">Tạo</button>
                    <input id="room-code" class="room-input" placeholder="Mã...">
                    <button class="btn-game btn-online" style="width:auto" onclick="joinRoom()">Vào</button>
                </div>
            </div>

            <div id="local-panel" class="mode-content">
                <p style="margin-bottom: 10px;">Chơi cùng bạn bè trên thiết bị này!</p>
                <select id="local-size-select" style="width:100%; padding:10px; border-radius:8px; margin-bottom:10px; font-size: 1rem;">
                    <option value="15">Bàn nhỏ (15x15)</option>
                    <option value="20" selected>Bàn lớn (20x20)</option>
                </select>
                <button class="btn-game btn-new" onclick="startLocalGame()">▶️ Bắt Đầu</button>
            </div>

            <div id="control-area">
                <button class="btn-game btn-undo" id="undo-btn" onclick="undoMove()">↩️ Đi Lại</button>
                <button class="btn-game" style="background:#e74c3c" onclick="location.reload()">🚪 Thoát</button>
            </div>
            
            <button class="btn-game" style="background:#636e72; margin-top: 10px;" onclick="window.location.href='index.html'">🏠 Về Trang Chủ</button>
        </div>
    </div>

    <script>
        const boardEl = document.getElementById('caro-board');
        const statusEl = document.getElementById('status');
        let size = 15, board = [], gameOver = false, history = [], currentMode = 'pve';
        let playerSym = 'X', aiSym = 'O', currentTurn = 'X';
        let aiLevel = 1;
        let gameStartTime;
        let matchTimer = null;
        let secondsLeft = 600;
        let roomName = "";

        // --- 1. KHỞI TẠO SOCKET ---
        const socket = io();

        // --- SOCKET EVENTS ---
        socket.on('roomCreated', (id) => {
            roomName = id;
            document.getElementById('room-code').value = id;
            statusEl.textContent = `Mã phòng: ${id} (Đợi...)`;
        });

        socket.on('matchFound', (data) => {
            currentMode = 'pvp';
            roomName = data.room;
            // Xác định quân cờ
            playerSym = data.role === 'O' ? 'O' : 'X'; 
            aiSym = playerSym === 'X' ? 'O' : 'X'; // Đối thủ
            currentTurn = 'X'; // X luôn đi trước

            size = 20; 
            gameStartTime = Date.now();
            startGameCommon(size);
            
            // Cập nhật trạng thái
            if (playerSym === 'X') {
                statusEl.textContent = "Bạn đi trước (X)";
                statusEl.style.color = "#2ecc71";
            } else {
                statusEl.textContent = "Đợi đối thủ đi trước (X)...";
                statusEl.style.color = "#fff";
            }
            startTournamentTimer(data.matchDuration || 30);
        });

        socket.on('opponentMove', (d) => {
            makeMove(d.r, d.c, aiSym); // Đánh quân đối thủ
            statusEl.textContent = `Lượt của BẠN (${playerSym})`;
            statusEl.style.color = "#2ecc71";
        });
        
        socket.on('notification', (msg) => alert(msg));
        socket.on('gameOver', (data) => {
            gameOver = true;
            boardEl.classList.add('game-over');
            clearInterval(matchTimer);
            if(data.reason === 'timeout') {
                const isMe = data.loser === localStorage.getItem('currentUser');
                alert(isMe ? "⌛ Hết giờ! Bạn thua." : `🎉 Đối thủ hết giờ. BẠN THẮNG!`);
            }
            setTimeout(() => { location.href = 'giai-dau.html'; }, 2000); 
        });

        // --- LOGIC GAME CHUNG ---

        function startTournamentTimer(mins) {
            clearInterval(matchTimer);
            secondsLeft = mins * 60;
            if(document.getElementById('tourney-timer')) {
                document.getElementById('tourney-timer').style.display = 'block';
            }
            matchTimer = setInterval(() => {
                if (currentMode === 'pvp' && !gameOver && playerSym === currentTurn) {
                    secondsLeft--;
                    const m = Math.floor(secondsLeft / 60);
                    const s = secondsLeft % 60;
                    const display = document.getElementById('time-left');
                    if(display) display.textContent = `${m}:${s < 10 ? '0'+s : s}`;

                    if (secondsLeft <= 0) {
                        clearInterval(matchTimer);
                        socket.emit('timeoutLoss', { 
                            room: roomName, 
                            loserUsername: localStorage.getItem('currentUser'),
                            gameType: 'Cờ Caro'
                        });
                    }
                }
            }, 1000);
        }

        async function init() {
            try {
                const res = await fetch('/api/user/progress');
                const data = await res.json();
                aiLevel = data.caroLevel || 1;
                document.getElementById('lvl-display').textContent = aiLevel;
                renderLevelOpts(aiLevel);
            } catch(e) {}
            
            // Check phòng giải đấu nếu có
            const tourRoom = localStorage.getItem('joinTournamentRoom');
            if (tourRoom) {
                socket.emit('joinCaroRoom', tourRoom); 
                localStorage.removeItem('joinTournamentRoom');
            }
        }

        function renderLevelOpts(maxLvl) {
            const sel = document.getElementById('ai-level-select');
            sel.innerHTML = ''; 
            for (let i = 1; i <= 100; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                if (i <= maxLvl) opt.textContent = `Cấp độ ${i}`;
                else {
                    opt.textContent = `🔒 Cấp độ ${i}`;
                    opt.disabled = true;
                }
                sel.appendChild(opt);
            }
            sel.value = maxLvl;
        }

        // --- HÀM KHỞI TẠO BÀN CỜ CHUNG ---
        function startGameCommon(boardSize) {
            document.querySelectorAll('.mode-content').forEach(el => el.style.display = 'none');
            // document.getElementById('control-area').style.display = 'block'; // Sẽ hiện sau khi render
            
            // Hiện/Ẩn nút Undo
            document.getElementById('undo-btn').style.display = (currentMode === 'pvp') ? 'none' : 'block';

            // Reset dữ liệu
            board = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));
            gameOver = false;
            history = [];
            
            // Render bàn cờ
            boardEl.innerHTML = ''; 
            boardEl.style.gridTemplateColumns = `repeat(${boardSize}, 30px)`;
            boardEl.classList.remove('game-over');
            document.getElementById('play-area').style.display = 'block';
            document.getElementById('control-area').style.display = 'block'; // Hiện nút điều khiển

            for(let r=0; r<boardSize; r++) {
                for(let c=0; c<boardSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => onMove(r, c);
                    boardEl.appendChild(cell);
                }
            }
        }

        // --- CÁC HÀM START TỪNG CHẾ ĐỘ ---
        function startAiGame() {
            currentMode = 'pve';
            playerSym = 'X'; aiSym = 'O'; currentTurn = 'X';
            size = parseInt(document.getElementById('board-size-select').value);
            gameStartTime = Date.now();
            startGameCommon(size);
            statusEl.textContent = "Lượt của bạn (X)!";
        }

        function startLocalGame() {
            currentMode = 'local';
            size = parseInt(document.getElementById('local-size-select').value);
            currentTurn = 'X'; // Mặc định X đi trước
            startGameCommon(size);
            statusEl.textContent = "Lượt của: X";
            document.getElementById('info-display').textContent = "Chế độ: 2 Người chơi";
        }

        // --- LOGIC XỬ LÝ NƯỚC ĐI ---
        function onMove(r, c) {
            if(gameOver || board[r][c]) return;

            // 1. Chế độ PVE (Đấu máy)
            if (currentMode === 'pve') {
                if (currentTurn !== playerSym) return; // Chưa đến lượt
                makeMove(r, c, playerSym);
                
                if (!gameOver) {
                    currentTurn = aiSym;
                    statusEl.textContent = "Máy đang tính...";
                    setTimeout(aiTurn, 100);
                }
            }
            // 2. Chế độ PVP (Online)
            else if (currentMode === 'pvp') {
                if (currentTurn !== playerSym) return; // Chưa đến lượt
                makeMove(r, c, playerSym);
                
                socket.emit('caroMove', { room: roomName, r, c }); 
                currentTurn = aiSym; // Đổi lượt sang đối thủ (logic cục bộ)
                statusEl.textContent = "Đợi đối thủ...";
                statusEl.style.color = "#bdc3c7";
            }
            // 3. Chế độ LOCAL (2 người)
            else if (currentMode === 'local') {
                makeMove(r, c, currentTurn);
                if (!gameOver) {
                    // Đổi lượt X <-> O
                    currentTurn = currentTurn === 'X' ? 'O' : 'X';
                    statusEl.textContent = `Lượt của: ${currentTurn}`;
                    statusEl.style.color = currentTurn === 'X' ? '#3498db' : '#e74c3c';
                }
            }
        }

        function makeMove(r, c, sym) {
            board[r][c] = sym;
            const idx = r * size + c;
            const cell = boardEl.children[idx];
            cell.textContent = sym;
            cell.className = `cell ${sym} last-move`;
            history.push({r, c, sym}); // Lưu thêm sym để undo chính xác
            
            // Xóa highlight nước đi trước đó
            if(history.length > 1) {
                const prev = history[history.length-2];
                // Chỉ xóa class last-move, giữ nguyên class X/O
                boardEl.children[prev.r*size + prev.c].classList.remove('last-move');
            }

            const win = checkWin(r, c, sym);
            if(win) endGame(sym, win);
        }

        // --- AI (Giữ nguyên logic của bạn) ---
        function aiTurn() {
            if(gameOver) return;
            const lvl = parseInt(document.getElementById('ai-level-select').value);
            const errorChance = Math.max(0, 40 - (lvl / 2.5)); 
            
            if (Math.random() * 100 < errorChance) {
                const moves = getEmptyCells();
                const m = moves[Math.floor(Math.random() * moves.length)];
                makeMove(m.r, m.c, aiSym);
            } else {
                const best = findBestMove(lvl);
                makeMove(best.r, best.c, aiSym);
            }
            
            if(!gameOver) { 
                currentTurn = playerSym; 
                statusEl.textContent = "Lượt của bạn!"; 
            }
        }

        // ... (Giữ nguyên các hàm findBestMove, evalPos, getEmptyCells, hasNeighbor, checkWin cũ của bạn) ...
        // ĐỂ CODE GỌN, TÔI KHÔNG COPY LẠI CÁC HÀM AI VÌ BẠN ĐÃ CÓ RỒI.
        // HÃY ĐẢM BẢO BẠN GIỮ LẠI CHÚNG TRONG CODE CỦA BẠN.

        // Bổ sung hàm AI vào đây (nếu bạn chưa có thì copy từ file cũ vào)
        function findBestMove(lvl) {
            let maxScore = -Infinity; let move = null;
            const empties = getEmptyCells();
            if(empties.length === size*size) return {r: Math.floor(size/2), c: Math.floor(size/2)};
            for(const m of empties) {
                const atk = evalPos(m.r, m.c, aiSym);
                const def = evalPos(m.r, m.c, playerSym);
                const defWeight = 0.8 + (lvl / 100); 
                const score = atk + (def * defWeight);
                if(score > maxScore) { maxScore = score; move = m; }
            }
            return move || empties[0];
        }
        function evalPos(r, c, sym) {
            let score = 0; const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for(const [dr, dc] of dirs) {
                let count = 0, block = 0;
                for(let k=1; k<5; k++) {
                    const nr=r+dr*k, nc=c+dc*k;
                    if(nr<0||nr>=size||nc<0||nc>=size) { block++; break; }
                    if(board[nr][nc] === sym) count++;
                    else if(board[nr][nc] !== null) { block++; break; }
                    else break;
                }
                for(let k=1; k<5; k++) {
                    const nr=r-dr*k, nc=c-dc*k;
                    if(nr<0||nr>=size||nc<0||nc>=size) { block++; break; }
                    if(board[nr][nc] === sym) count++;
                    else if(board[nr][nc] !== null) { block++; break; }
                    else break;
                }
                if(count >= 4) score += 100000;
                else if(count === 3 && block === 0) score += 10000;
                else if(count === 2 && block === 0) score += 100;
                else if(count === 1) score += 10;
            }
            return score;
        }
        function getEmptyCells() {
            let cells = [];
            for(let r=0; r<size; r++) for(let c=0; c<size; c++) if(!board[r][c] && hasNeighbor(r, c)) cells.push({r, c});
            return cells.length ? cells : [{r:Math.floor(size/2),c:Math.floor(size/2)}];
        }
        function hasNeighbor(r, c) {
            for(let i=r-2; i<=r+2; i++) for(let j=c-2; j<=c+2; j++) if(i>=0 && i<size && j>=0 && j<size && board[i][j]) return true;
            return false;
        }
        function checkWin(r, c, sym) {
            const dirs = [[0,1],[1,0],[1,1],[1,-1]];
            for(const [dr, dc] of dirs) {
                let count = 1, cells = [{r, c}];
                for(let k=1; k<5; k++) { if(board[r+dr*k]?.[c+dc*k] === sym) { count++; cells.push({r:r+dr*k, c:c+dc*k}); } else break; }
                for(let k=1; k<5; k++) { if(board[r-dr*k]?.[c-dc*k] === sym) { count++; cells.push({r:r-dr*k, c:c-dc*k}); } else break; }
                if(count >= 5) return cells;
            }
            return null;
        }

        async function endGame(winner, cells) {
            gameOver = true;
            boardEl.classList.add('game-over');
            cells.forEach(p => boardEl.children[p.r * size + p.c].classList.add('win'));
            clearInterval(matchTimer);

            const modal = document.getElementById('result-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-msg');
            const btnNext = document.getElementById('btn-next-lvl');
            
            // Xử lý thông báo thắng thua cho từng chế độ
            if (currentMode === 'local') {
                title.textContent = `🏆 ${winner} THẮNG!`;
                title.style.color = winner === 'X' ? "#3498db" : "#e74c3c";
                msg.textContent = "Chơi tiếp ván nữa nhé?";
                btnNext.style.display = "none";
                confetti();
            } 
            else if (currentMode === 'pve') {
                if (winner === playerSym) {
                    title.textContent = "🏆 THẮNG RỒI!";
                    title.style.color = "#2ecc71";
                    confetti();
                    const timeSpent = Math.floor((Date.now() - gameStartTime) / 1000);
                    // API Call... (Giữ nguyên)
                    try {
                        const lvl = parseInt(document.getElementById('ai-level-select').value);
                        const res = await fetch('/api/game/caro-win', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ level: lvl, timeTaken: timeSpent })
                        });
                        const data = await res.json();
                        if (data.addedPoints > 0) {
                            msg.textContent = `Bé nhận được ${data.addedPoints} 💎!`;
                            if(lvl === aiLevel) { aiLevel++; renderLevelOpts(aiLevel); }
                        } else {
                            msg.textContent = "Bé chơi rất giỏi!";
                        }
                    } catch(e) {}
                    btnNext.style.display = "block";
                } else {
                    title.textContent = "😢 MÁY THẮNG!";
                    title.style.color = "#e74c3c";
                    msg.textContent = "Thử lại nhé!";
                    btnNext.style.display = "none";
                }
            } else {
                // Online
                title.textContent = winner === playerSym ? "🏆 BẠN THẮNG!" : "😢 BẠN THUA!";
                msg.textContent = "Trận đấu kết thúc.";
                btnNext.style.display = "none";
            }

            modal.style.display = 'flex';
        }

        // --- HÀM XỬ LÝ UNDO (ĐI LẠI) ---
        function undoMove() {
            if (gameOver) return;
            
            // 1. Chế độ PVE: Đi lại 2 nước (Của mình và của máy)
            if (currentMode === 'pve' && history.length >= 2) {
                const m1 = history.pop();
                const m2 = history.pop();
                board[m1.r][m1.c] = null;
                board[m2.r][m2.c] = null;
                
                // Xóa hiển thị trên bàn cờ
                const cell1 = boardEl.children[m1.r*size + m1.c];
                cell1.textContent = ''; cell1.className = 'cell';
                
                const cell2 = boardEl.children[m2.r*size + m2.c];
                cell2.textContent = ''; cell2.className = 'cell';
                
                // Khôi phục highlight cho nước đi trước đó nữa (nếu có)
                if (history.length > 0) {
                    const last = history[history.length-1];
                    const lastCell = boardEl.children[last.r*size + last.c];
                    lastCell.classList.add('last-move');
                    lastCell.classList.add(last.sym); // Thêm lại class màu
                }
            } 
            // 2. Chế độ LOCAL: Đi lại 1 nước (Của người vừa đi)
            else if (currentMode === 'local' && history.length >= 1) {
                const m = history.pop();
                board[m.r][m.c] = null;
                
                const cell = boardEl.children[m.r*size + m.c];
                cell.textContent = ''; cell.className = 'cell';
                
                // Đổi lại lượt
                currentTurn = (currentTurn === 'X') ? 'O' : 'X';
                statusEl.textContent = `Lượt của: ${currentTurn}`;

                if (history.length > 0) {
                    const last = history[history.length-1];
                    const lastCell = boardEl.children[last.r*size + last.c];
                    lastCell.classList.add('last-move');
                    lastCell.classList.add(last.sym);
                }
            }
        }

        // --- TAB SWITCHER ---
        window.switchMode = function(mode) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mode-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab-${mode}`).classList.add('active');
            document.getElementById(`${mode}-panel`).classList.add('active');
            
            // Ẩn bàn cờ khi chuyển tab để người dùng nhấn Bắt đầu lại
            document.getElementById('play-area').style.display = 'none';
            document.getElementById('menu-area').style.display = 'block';
            document.getElementById('control-area').style.display = 'none';
        }

        // --- BUTTON ACTIONS ---
        window.createRoom = () => { socket.emit('createCaroRoom'); statusEl.textContent = "Đang tạo..."; };
        window.joinRoom = () => { socket.emit('joinCaroRoom', document.getElementById('room-code').value.toUpperCase()); };
        window.findRandomMatch = () => { socket.emit('findMatch', 'caro'); statusEl.textContent = "Đang tìm..."; };
        
        function goToNextLevel() {
            document.getElementById('result-modal').style.display = 'none';
            if(aiLevel <= 100) {
                document.getElementById('ai-level-select').value = aiLevel;
                startAiGame();
            }
        }
        function replayCurrentLevel() {
            document.getElementById('result-modal').style.display = 'none';
            if(currentMode === 'local') startLocalGame();
            else if(currentMode === 'pve') startAiGame();
        }
        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
            switchMode(currentMode); // Quay lại menu của chế độ đó
        }

        init();
    </script>

    <div id="result-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;">
        <div style="background: white; padding: 30px; border-radius: 30px; text-align: center; width: 100%; max-width: 320px; color: #333;">
            <h2 id="modal-title" style="margin: 0; color: #e74c3c; font-size: 2rem;">🏆 THẮNG RỒI!</h2>
            <div id="modal-stars" style="font-size: 2rem; margin: 10px 0;">⭐⭐⭐⭐⭐</div>
            <p id="modal-msg" style="font-weight: bold; color: #555;">Bé đã vượt qua Cấp độ 1!</p>
            
            <button class="btn-game btn-new" id="btn-next-lvl" onclick="goToNextLevel()">MÀN TIẾP THEO ➡️</button>
            <button class="btn-game" style="background:#3498db" onclick="replayCurrentLevel()">CHƠI LẠI 🔄</button>
            <button class="btn-game" style="background:#95a5a6" onclick="closeModal()">QUAY LẠI MENU</button>
        </div>
    </div>
</body>
</html>
