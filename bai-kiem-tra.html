<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài Kiểm Tra Tổng Hợp</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Baloo 2', cursive;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: white; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); margin-bottom: 20px; }
        
        .test-container { 
            width: 100%; max-width: 800px; 
            background: white; padding: 30px; 
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        }

        .control-panel { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 20px; }
        select, button { padding: 12px 20px; border-radius: 12px; border: 2px solid #dfe6e9; font-family: 'Baloo 2'; font-size: 1rem; font-weight: bold; outline: none; }
        select:focus { border-color: #0984e3; }
        
        button { background: #0984e3; color: white; border: none; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #06528d; }
        button:active { transform: translateY(4px); box-shadow: none; }
        button:hover { background: #74b9ff; }
        
        .question-card { background: #f1f2f6; padding: 20px; margin-bottom: 15px; border-radius: 15px; border-left: 6px solid #b2bec3; }
        .question-text { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; color: #2d3436; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

        .option-label { 
            display: flex; align-items: center; 
            background: white; padding: 12px; border-radius: 10px; 
            cursor: pointer; border: 2px solid #dfe6e9; transition: 0.2s; 
        }
        .option-label:hover { border-color: #0984e3; background: #f0f8ff; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); }

        /* Kết quả */
        .correct-answer { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .wrong-answer { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        
        .result-note { font-weight: bold; margin-top: 10px; font-size: 0.95rem; display: block; }
        
        #timer-box { 
            position: sticky; top: 10px; z-index: 100;
            background: #fff; padding: 10px 20px; border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 1.2rem; color: #d63031; font-weight: bold;
            display: inline-block; margin-bottom: 20px; border: 2px solid #d63031;
        }

        #result-area { display: none; text-align: center; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .score-big { font-size: 4rem; color: #e74c3c; font-weight: 800; display: block; margin: 10px 0; }
        .feedback { font-size: 1.5rem; color: #2d3436; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>📝 Phòng Thi Trắc Nghiệm 📝</h1>

    <div class="test-container">
        <div class="control-panel" id="selection-area">
            <select id="subject-select">
                <option value="toan">🧮 Toán Học</option>
                <option value="tieng-viet">📚 Tiếng Việt</option>
                <option value="tieng-anh">🇬🇧 Tiếng Anh</option>
                <option value="khoa-hoc">🔬 Khoa Học</option>
                <option value="lich-su">🛡️ Lịch Sử</option>
                <option value="dia-ly">🌏 Địa Lý</option>
            </select>
            <select id="grade-select">
                <option value="1">Lớp 1</option>
                <option value="2">Lớp 2</option>
                <option value="3">Lớp 3</option>
                <option value="4">Lớp 4</option>
                <option value="5">Lớp 5</option>
                <option value="9">Lớp 9 (Ôn thi)</option>
            </select>
            <select id="difficulty-select">
                <option value="easy">Dễ</option>
                <option value="medium">Trung Bình</option>
                <option value="hard">Khó</option>
            </select>
            <button onclick="startTest()">🚀 Bắt Đầu Làm Bài</button>
        </div>

        <div id="quiz-area" style="display: none;">
            <div style="text-align: right;">
                <div id="timer-box">⏱️ <span id="time-left">10:00</span></div>
            </div>
            <h2 id="test-title" style="text-align: center; color: #0984e3;">Đề thi...</h2>
            <div id="questions-list"></div>
            <button onclick="submitTest()" style="width: 100%; margin-top: 20px; background: #2ecc71; font-size: 1.2rem;">NỘP BÀI NGAY</button>
        </div>

        <div id="result-area">
            <h2>🏆 KẾT QUẢ BÀI THI</h2>
            <span class="score-big" id="final-score">0/10</span>
            <p id="feedback-msg" class="feedback"></p>
            
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button onclick="location.reload()">🔄 Làm Bài Khác</button>
                <button onclick="window.location.href='index.html'" style="background: #636e72;">🏠 Về Trang Chủ</button>
            </div>
        </div>
    </div>

<script>
    let currentQuestions = [];
    let testTimer;

    async function startTest() {
        const subject = document.getElementById('subject-select').value;
        const grade = document.getElementById('grade-select').value;
        const diff = document.getElementById('difficulty-select').value;

        try {
            const res = await fetch(`/api/test?subject=${subject}&grade=${grade}&difficulty=${diff}`);
            const data = await res.json();

            if (res.status !== 200) {
                alert(data.message || "Chưa có đề thi cho lựa chọn này. Bé hãy chọn môn khác nhé!");
                return;
            }

            currentQuestions = data;
            renderQuestions(data);
            
            // Chuyển màn hình
            document.getElementById('selection-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            
            const subName = document.getElementById('subject-select').options[document.getElementById('subject-select').selectedIndex].text;
            document.getElementById('test-title').textContent = `${subName} - Lớp ${grade} (${diff === 'easy' ? 'Dễ' : (diff === 'medium' ? 'Trung Bình' : 'Khó')})`;
            
            // BẮT ĐẦU ĐẾM GIỜ (10 phút = 600 giây)
            startTimer(600); 

        } catch (e) {
            console.error(e);
            alert("Lỗi kết nối server! Hãy kiểm tra mạng.");
        }
    }

    function startTimer(durationSeconds) {
        let timer = durationSeconds;
        const display = document.getElementById('time-left');
        
        // Xóa timer cũ nếu có
        if (testTimer) clearInterval(testTimer);

        testTimer = setInterval(() => {
            let minutes = Math.floor(timer / 60);
            let seconds = timer % 60;
            display.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

            if (--timer < 0) {
                clearInterval(testTimer);
                alert("⏰ Đã hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.");
                submitTest(); // Tự động nộp
            }
        }, 1000);
    }

    function renderQuestions(questions) {
        const container = document.getElementById('questions-list');
        container.innerHTML = '';

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `card-${q.id}`;
            
            let html = `<div class="question-text">Câu ${index + 1}: ${q.q}</div>`;
            html += `<div class="options-grid">`;
            
            q.a.forEach(opt => {
                // Tạo ID duy nhất cho mỗi label để lát tô màu
                // Dùng btoa để mã hóa chuỗi đáp án thành ID an toàn (tránh ký tự đặc biệt)
                const safeId = `opt-${q.id}-${btoa(encodeURIComponent(opt)).replace(/=/g, '')}`;
                
                html += `
                    <label class="option-label" id="${safeId}">
                        <input type="radio" name="q_${q.id}" value="${opt}"> 
                        <span>${opt}</span>
                    </label>
                `;
            });
            
            html += `</div><div id="note-${q.id}" class="result-note"></div>`;
            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    async function submitTest() {
        // Dừng đồng hồ
        clearInterval(testTimer);

        // 1. Thu thập đáp án
        const answers = {};
        let answeredCount = 0;

        currentQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
            if (selected) {
                answers[q.id] = selected.value;
                answeredCount++;
            }
        });

        // Cảnh báo nếu chưa làm hết (trừ khi hết giờ thì nộp luôn)
        const timeLeftText = document.getElementById('time-left').textContent;
        if (answeredCount < currentQuestions.length && timeLeftText !== "0:00") {
             if(!confirm(`Bạn mới làm ${answeredCount}/${currentQuestions.length} câu. Bạn có chắc muốn nộp bài không?`)) {
                 startTimer(parseInt(timeLeftText.split(':')[0]) * 60 + parseInt(timeLeftText.split(':')[1])); // Chạy lại timer
                 return;
             }
        }

        // 2. Gửi lên server chấm
        try {
            const res = await fetch('/api/submit-test', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ answers: answers })
            });
            const result = await res.json();

            // 3. HIỂN THỊ KẾT QUẢ
            document.querySelector('#quiz-area button').style.display = 'none'; // Ẩn nút nộp
            document.getElementById('result-area').style.display = 'block';
            
            // Cuộn lên đầu để xem điểm
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Hiệu ứng số điểm nhảy
            animateScore(result.score, result.total);
            document.getElementById('feedback-msg').textContent = result.message;

            // Pháo hoa nếu điểm cao (> 80%)
            if (result.score >= result.total * 0.8) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            }

            // 4. TÔ MÀU CHI TIẾT
            const details = result.details;
            for (const [qid, info] of Object.entries(details)) {
                // Vô hiệu hóa input
                const inputs = document.getElementsByName(`q_${qid}`);
                inputs.forEach(i => i.disabled = true);

                // Tìm label đáp án ĐÚNG
                const correctSafeId = `opt-${qid}-${btoa(encodeURIComponent(info.correct)).replace(/=/g, '')}`;
                const correctLabel = document.getElementById(correctSafeId);
                
                if (correctLabel) {
                    correctLabel.classList.add('correct-answer');
                    correctLabel.innerHTML += ` <span style="margin-left:auto">✅</span>`;
                }

                // Nếu chọn SAI -> Tô màu đỏ
                if (!info.isCorrect && info.userChosen) {
                    const wrongSafeId = `opt-${qid}-${btoa(encodeURIComponent(info.userChosen)).replace(/=/g, '')}`;
                    const wrongLabel = document.getElementById(wrongSafeId);
                    if (wrongLabel) {
                        wrongLabel.classList.add('wrong-answer');
                        wrongLabel.innerHTML += ` <span style="margin-left:auto">❌</span>`;
                    }
                }

                // Hiện chú thích text
                const noteDiv = document.getElementById(`note-${qid}`);
                if (info.isCorrect) {
                    noteDiv.style.color = "#27ae60";
                    noteDiv.innerText = "Chính xác! Giỏi quá!";
                } else {
                    noteDiv.style.color = "#e74c3c";
                    noteDiv.innerHTML = `Tiếc quá! Đáp án đúng là: <b>${info.correct}</b>`;
                }
            }

        } catch (e) {
            console.error(e);
            alert("Có lỗi khi chấm bài! Vui lòng thử lại.");
        }
    }

    function animateScore(score, total) {
        let current = 0;
        const el = document.getElementById('final-score');
        const interval = setInterval(() => {
            el.textContent = `${current}/${total}`;
            if (current >= score) clearInterval(interval);
            current++;
        }, 100);
    }
</script>
</body>
</html>
