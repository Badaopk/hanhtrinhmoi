<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hành Tinh Mơ Ước</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="style.css">
    <style>
/* Hiệu ứng cho Thông báo nhắc lịch thi đấu */
.match-notification {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 320px;
    background: white;
    border-left: 10px solid #f1c40f;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    z-index: 10001;
    animation: slideIn 0.5s ease-out forwards;
    color: #333;
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
}

.notif-btn {
    width: 100%;
    margin-top: 10px;
    background: #2ecc71;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-family: 'Baloo 2', cursive;
}
        .user-access {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .auth-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background-color: #ff6347;
            color: white;
            font-family: 'Baloo 2', cursive;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .auth-btn:hover {
            background-color: #e5533d;
        }
        .auth-btn.secondary {
            background-color: #1E90FF;
        }
         .auth-btn.secondary:hover {
            background-color: #1c80e3;
        }
        /* Style cho nút Admin */
        .auth-btn.admin {
            background-color: #8e44ad;
        }
        .auth-btn.admin:hover {
            background-color: #732d91;
        }
        .user-greeting {
            font-weight: bold;
            font-size: 1.1rem;
            color: #333;
        }
/* Container chứa chuông */
.notif-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.2);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    transition: 0.3s;
    border: 2px solid rgba(255, 255, 255, 0.4);
}

.notif-wrapper:hover {
    background: white;
    transform: scale(1.1);
}

/* Biểu tượng chuông */
.notif-bell-icon {
    font-size: 1.5rem;
}

/* Vòng tròn đỏ báo số tin nhắn */
.notif-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff4757;
    color: white;
    font-size: 0.75rem;
    font-weight: bold;
    min-width: 18px;
    height: 18px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
    border: 2px solid white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* Hiệu ứng chuông reo khi có tin mới */
.ringing {
    animation: ring-animation 0.5s ease-in-out infinite;
}

@keyframes ring-animation {
    0% { transform: rotate(0); }
    15% { transform: rotate(15deg); }
    30% { transform: rotate(-15deg); }
    45% { transform: rotate(10deg); }
    60% { transform: rotate(-10deg); }
    100% { transform: rotate(0); }
}
    </style>
</head>
<body>
    <div class="user-access" id="auth-container">
        </div>

    <h1 class="header-title">Hành Tinh Mơ Ước</h1>
    <p style="font-size: 1.5rem; color: #555;">Hãy chọn một nơi để khám phá nào!</p>

    <div class="planet-container">
        <a href="thanh-pho-sang-tao.html" class="planet planet-creative">🎨<br>Thành Phố Sáng Tạo</a>
        <a href="thu-vien-tri-thuc.html" class="planet planet-knowledge">📚<br>Thư Viện Tri Thức</a>
        
        <a href="nhiem-vu.html" class="planet" style="border-color: #e67e22;">🏆<br>Nhiệm Vụ Hàng Ngày</a>
        
        <a href="dau-truong-thu-thach.html" class="planet planet-challenge">🎯<br>Đấu Trường Thử Thách</a>
        <a href="choi-co.html" class="planet" style="border-color: #8e44ad;">🎲<br>Đấu Trường Cờ</a>
        <a href="bai-kiem-tra.html" class="planet" style="border-color: #f39c12;">📝<br>Bài Kiểm Tra</a>
        <a href="ngoi-nha-cua-be.html" class="planet planet-home">🏡<br>Ngôi Nhà Của Bé</a>
        <a href="giai-dau.html" class="planet" style="border-color: #e74c3c; background: #fff5f5; animation: pulse 2s infinite;">
          🏆<br>Giải Đấu Hành Tinh
        </a>
        <a href="trang-tri-phong.html" class="planet p-home" style="background: radial-gradient(circle at 30% 30%, #00b894, #00cec9);">
            <span class="icon">🛋️</span>
            <span class="name">Trang Trí Phòng</span>
        </a>
        <a href="phong-trung-bay.html" class="planet p-gallery">
            <span class="icon">🏛️</span>
            <span class="name">Bảo Tàng & Quà</span>
        </a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    
    <script src="global-client.js"></script>

    <script>
// Khởi tạo socket nếu chưa có (đặt ở đầu thẻ script)
const socket = io();
// Hàm lấy số lượng thông báo từ server
async function updateNotificationCount() {
    try {
        const res = await fetch('/api/notifications');
        const data = await res.json();
        const badge = document.getElementById('notif-count-badge');
        
        if (data.length > 0) {
            badge.innerText = data.length > 9 ? '9+' : data.length;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    } catch (e) { console.error("Không lấy được số thông báo"); }
}

// Lắng nghe Socket để rung chuông khi Admin vừa đăng tin mới
socket.on('adminNotification', (data) => {
    // 1. Cập nhật số lượng trên badge
    const badge = document.getElementById('notif-count-badge');
    let currentCount = parseInt(badge.innerText) || 0;
    badge.innerText = currentCount + 1;
    badge.style.display = 'flex';

    // 2. Làm chuông rung lên trong 3 giây để thu hút bé
    const bell = document.getElementById('bell-container');
    if (bell) {
        bell.classList.add('ringing');
        setTimeout(() => bell.classList.remove('ringing'), 3000);
    }
});
// Lắng nghe thông báo nhắc lịch thi đấu từ Server
socket.on('matchNotice', (data) => {
    // Tạo phần tử thông báo
    const notif = document.createElement('div');
    notif.className = 'match-notification';
    notif.innerHTML = `
        <h3 style="margin:0; color:#e67e22;">${data.title}</h3>
        <p style="margin:10px 0; font-size:0.9rem;">${data.message}</p>
        <button class="notif-btn" onclick="window.location.href='giai-dau.html'">🏟️ ĐẾN SÂN VẬN ĐỘNG</button>
    `;

    document.body.appendChild(notif);

    // Tự động biến mất sau 12 giây để bé kịp đọc
    setTimeout(() => {
        notif.style.animation = "slideOut 0.5s ease-in forwards";
        setTimeout(() => notif.remove(), 500);
    }, 300000);
});
// Lắng nghe thông báo TOÀN SERVER từ Admin
socket.on('adminNotification', (data) => {
    const notif = document.createElement('div');
    notif.className = 'match-notification'; // Dùng chung style đẹp lúc nãy
    notif.style.borderLeftColor = '#8e44ad'; // Đổi sang màu tím cho uy nghiêm
    
    notif.innerHTML = `
        <h3 style="margin:0; color:#8e44ad;">📢 ${data.title}</h3>
        <p style="margin:10px 0; font-weight: bold;">${data.message}</p>
        <button class="notif-btn" style="background:#8e44ad" onclick="this.parentElement.remove()">ĐÃ HIỂU</button>
    `;

    document.body.appendChild(notif);

    // --- CHỈNH THỜI GIAN TẮT Ở ĐÂY ---
    // Ví dụ: 15000 là 15 giây. Bạn muốn bao lâu thì sửa con số này.
    const displayTime = 300000; 

    setTimeout(() => {
        if (notif) {
            notif.style.animation = "slideOut 0.5s ease-in forwards";
            setTimeout(() => notif.remove(), 500);
        }
    }, displayTime);
});
// Lắng nghe cập nhật giải đấu (để làm mới dữ liệu nếu cần)
socket.on('tournamentUpdated', () => {
    console.log("Giải đấu có cập nhật mới!");
});
        document.addEventListener('DOMContentLoaded', async () => {
            const authContainer = document.getElementById('auth-container');
            
            try {
                const response = await fetch('/api/user/progress');
                if (!response.ok) {
                    authContainer.innerHTML = `<a href="login.html"><button class="auth-btn">Đăng Nhập / Đăng Ký</button></a>`;
                    return;
                }

                const user = await response.json();
                
                // Cần thiết để global-client.js biết user là ai
                localStorage.setItem('currentUser', user.username);
                let specialButton = '';

                // Phân quyền nút đặc biệt
                if (user.role === 'parent') {
                    specialButton = `<a href="phu-huynh.html"><button class="auth-btn secondary">👤 Bảng Phụ Huynh</button></a>`;
                } else if (user.role === 'admin') {
                    specialButton = `<a href="admin-panel.html"><button class="auth-btn admin">⚙️ Bảng Admin</button></a>`;
                }

                authContainer.innerHTML = `
                    <div class="notif-wrapper" onclick="window.location.href='thong-bao.html'" id="bell-container">
                    <span class="notif-bell-icon">🔔</span>
                    <span id="notif-count-badge" class="notif-badge" style="display:none">0</span>
                    </div>

                    <span class="user-greeting">Chào, ${user.username}!</span>
                    ${specialButton}
                    <button id="logout-btn" class="auth-btn">Đăng Xuất</button>
                `;

                // Gọi hàm lấy số lượng thông báo ngay khi tải xong
                updateNotificationCount();
                document.getElementById('logout-btn').addEventListener('click', async () => {
                    await fetch('/api/logout', { method: 'POST' });
                    // Cần thiết để global-client.js ngừng hoạt động
                    localStorage.removeItem('currentUser');
                    window.location.href = '/login.html';
                });

            } catch (error) {
                console.error('Lỗi kiểm tra trạng thái đăng nhập:', error);
                authContainer.innerHTML = `<a href="login.html"><button class="auth-btn">Đăng Nhập / Đăng Ký</button></a>`;
            }
        });
    </script>
</body>
</html>
