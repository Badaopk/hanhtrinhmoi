<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tỷ Phú Thiên Hà - Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --bg-dark: #1a1a2e; --primary: #e94560; --accent: #0f3460; --text: #fff; }
        body { margin: 0; font-family: 'Nunito', sans-serif; background: var(--bg-dark); color: var(--text); overflow: hidden; }
        
        /* --- MÀN HÌNH CHÀO & SẢNH CHỜ --- */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; }
        .hidden { display: none !important; }
        
        /* Home Screen */
        #home-screen { background: radial-gradient(circle at center, #16213e, #1a1a2e); z-index: 100; }
        .game-title { font-family: 'Fredoka One', cursive; font-size: 4rem; color: var(--primary); text-shadow: 0 0 20px rgba(233, 69, 96, 0.5); margin-bottom: 30px; letter-spacing: 2px; }
        
        .menu-box { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); width: 350px; text-align: center; }
        .btn-modern { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-modern:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-create { background: linear-gradient(45deg, #00b894, #00cec9); }
        .btn-join { background: linear-gradient(45deg, #6c5ce7, #a29bfe); }
        .input-modern { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #0f3460; background: #0f3460; color: white; font-size: 1.2rem; text-align: center; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .input-modern:focus { border-color: var(--primary); }

        /* Lobby Screen */
        #lobby-screen { background: #16213e; z-index: 90; }
        .lobby-header { text-align: center; margin-bottom: 20px; }
        .room-code-display { font-size: 3rem; font-weight: bold; color: #f1c40f; letter-spacing: 5px; background: rgba(0,0,0,0.3); padding: 10px 30px; border-radius: 15px; display: inline-block; margin-top: 10px; border: 2px dashed #f1c40f; }
        
        .player-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 80%; max-width: 800px; margin-bottom: 30px; }
        .player-slot { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; text-align: center; border: 2px solid transparent; transition: 0.3s; }
        .player-slot.filled { background: rgba(255,255,255,0.15); border-color: var(--primary); animation: popIn 0.3s ease; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background: #ccc; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        
        /* Game Screen */
        #game-screen { display: flex; flex-direction: row; }
        .game-sidebar { width: 280px; background: #16213e; padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .player-list-mini { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .p-card { background: #0f3460; padding: 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; border-left: 5px solid transparent; transition: 0.3s; }
        .p-card.active-turn { background: #2d3436; border-left-color: #00b894; transform: scale(1.02); }
        .p-money { margin-left: auto; font-weight: bold; color: #f1c40f; }

        .board-area { flex: 1; background: #0f3460; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Bàn cờ Responsive (CSS Grid) */
        .board { 
            display: grid; 
            grid-template-columns: repeat(11, 1fr); 
            grid-template-rows: repeat(11, 1fr); 
            width: 90vh; height: 90vh; 
            background: #dfe6e9; border: 5px solid #2d3436; box-shadow: 0 0 50px rgba(0,0,0,0.5); border-radius: 5px;
        }
        .tile { border: 1px solid #b2bec3; position: relative; font-size: 0.6rem; display: flex; flex-direction: column; text-align: center; }
        .tile-header { height: 20%; width: 100%; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .tile-name { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2px; font-weight: bold; color: #2d3436; }
        .tile-price { font-weight: bold; color: #636e72; padding-bottom: 2px; }
        
        .center-board { 
            grid-column: 2 / 11; grid-row: 2 / 11; background: #16213e; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; border: 2px solid #2d3436; 
        }
        
        .dice-area { font-size: 4rem; margin-bottom: 20px; animation: bounce 1s infinite; }
        .control-panel button { width: 200px; margin: 5px; padding: 15px; border-radius: 50px; border:none; font-weight:bold; font-size:1.1rem; cursor:pointer; }
        
        /* Token (Quân cờ) */
        .token { width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; position: absolute; bottom: 5px; left: 5px; transition: all 0.5s ease; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="home-screen" class="screen">
        <div class="game-title">TỶ PHÚ THIÊN HÀ</div>
        <div class="menu-box">
            <button class="btn-modern btn-create" onclick="createRoom()">
                <span>🏠</span> Tạo Phòng Mới
            </button>
            <div style="margin: 20px 0; color: #aaa;">- HOẶC -</div>
            <input type="text" id="code-input" class="input-modern" placeholder="Nhập mã phòng" maxlength="5">
            <button class="btn-modern btn-join" onclick="joinRoom()">
                <span>🚀</span> Tham Gia Ngay
            </button>
            <button onclick="window.location.href='index.html'" style="background:transparent; border:none; color:#aaa; margin-top:15px; cursor:pointer;">⬅️ Về trang chủ</button>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <div class="lobby-header">
            <h2 style="color:white; margin:0;">MÃ PHÒNG CỦA BẠN</h2>
            <div id="room-code-display" class="room-code-display">---</div>
            <p style="color:#aaa;">Hãy chia sẻ mã này để bạn bè cùng chơi (Max 8 người)</p>
        </div>
        
        <div class="player-grid" id="lobby-players">
            </div>

        <button id="btn-start-game" class="btn-modern btn-create" style="width: 300px; display: none;" onclick="startGame()">
            👑 BẮT ĐẦU TRẬN ĐẤU
        </button>
        <div id="waiting-msg" style="color: #f1c40f; font-weight: bold;">Đang đợi chủ phòng bắt đầu...</div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="game-sidebar">
            <h3 style="color:#f1c40f; text-align:center; border-bottom:1px solid #333; padding-bottom:10px;">XẾP HẠNG</h3>
            <div id="in-game-players" class="player-list-mini"></div>
            <div style="margin-top:auto; height: 150px; background:#0f3460; padding:10px; border-radius:10px; overflow-y:auto; font-size:0.8rem; color:#ccc;" id="game-log">
                <div>Chào mừng đến với Tỷ Phú Thiên Hà!</div>
            </div>
        </div>
        <div class="board-area">
            <div class="board" id="board-grid">
                <div class="center-control">
                    <div id="dice-val" class="dice-area">🎲🎲</div>
                    <div class="control-panel">
                        <button id="btn-roll" style="background: #e94560; color: white;" onclick="rollDice()" disabled>GIEO XÚC XẮC</button>
                        <button id="btn-end" style="background: #2d3436; color: white; display:none;" onclick="endTurn()">KẾT THÚC LƯỢT</button>
                    </div>
                    <div id="turn-msg" style="margin-top:20px; font-weight:bold; color: #00b894;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="buy-modal" class="modal hidden">
        <div class="menu-box" style="background: white; color: #333;">
            <h2 style="color: #2c3e50;">Mua Tài Sản?</h2>
            <p id="buy-desc">Bạn có muốn mua khu đất này không?</p>
            <div style="display:flex; gap:10px;">
                <button class="btn-modern btn-create" onclick="confirmBuy(true)">MUA NGAY</button>
                <button class="btn-modern" style="background:#e74c3c" onclick="confirmBuy(false)">BỎ QUA</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="monopoly-data.js"></script> 
    
    <script>
        const socket = io();
        let currentRoom = null;
        let myId = null;

        socket.on('connect', () => { myId = socket.id; });

        // --- UI FUNCTIONS ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        // --- LOBBY LOGIC ---
        function createRoom() { socket.emit('createMonopolyRoom'); }
        function joinRoom() {
            const code = document.getElementById('code-input').value.toUpperCase();
            if(code.length < 5) return alert("Mã phòng không hợp lệ!");
            socket.emit('joinMonopolyRoom', code);
        }

        socket.on('lobbyUpdate', (data) => {
            currentRoom = data.roomId;
            document.getElementById('room-code-display').innerText = data.roomId;
            showScreen('lobby-screen');

            // Render người chơi trong sảnh chờ
            const grid = document.getElementById('lobby-players');
            grid.innerHTML = '';
            
            // Xử lý hiển thị nút Bắt đầu
            const amIHost = data.isHost; 
            document.getElementById('btn-start-game').style.display = amIHost ? 'block' : 'none';
            document.getElementById('waiting-msg').style.display = amIHost ? 'none' : 'block';

            data.players.forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-slot filled';
                div.innerHTML = `
                    <div class="avatar" style="background:${p.color}">👤</div>
                    <div style="font-weight:bold">${p.username}</div>
                    ${p.isHost ? '<small style="color:#f1c40f">👑 Chủ phòng</small>' : ''}
                `;
                grid.appendChild(div);
            });
        });

        socket.on('errorMsg', (msg) => alert(msg));

        // --- GAME START ---
        function startGame() { socket.emit('startMonopolyGame', currentRoom); }

        socket.on('gameStarted', (data) => {
            showScreen('game-screen');
            renderBoard(); // Vẽ bàn cờ
            updatePlayerList(data.players);
        });

        // --- GAMEPLAY LOGIC ---
        function updatePlayerList(players) {
            const list = document.getElementById('in-game-players');
            list.innerHTML = '';
            // Xóa token cũ
            document.querySelectorAll('.token').forEach(t => t.remove());

            players.forEach((p, idx) => {
                // 1. Cập nhật thẻ bên trái
                const card = document.createElement('div');
                card.className = `p-card ${p.id === currentTurnPlayerId ? 'active-turn' : ''}`;
                card.id = `card-${p.id}`;
                card.innerHTML = `
                    <div style="width:30px;height:30px;border-radius:50%;background:${p.color}"></div>
                    <div>
                        <div style="font-weight:bold; font-size:0.9rem;">${p.username}</div>
                        <small style="color:#aaa">Vị trí: ${p.position}</small>
                    </div>
                    <div class="p-money">$${p.money}</div>
                `;
                list.appendChild(card);

                // 2. Vẽ quân cờ lên bàn
                const cell = document.getElementById(`cell-${p.position}`);
                if(cell) {
                    const token = document.createElement('div');
                    token.className = 'token';
                    token.style.backgroundColor = p.color;
                    // Xếp token lệch nhau để không đè lên nhau
                    token.style.left = `${5 + (idx*5)}px`; 
                    token.style.bottom = `${5 + (idx*2)}px`;
                    cell.appendChild(token);
                }
            });
        }

        let currentTurnPlayerId = null;
        socket.on('turnChanged', (data) => {
            currentTurnPlayerId = data.turn;
            const isMyTurn = (data.turn === myId);
            document.getElementById('btn-roll').disabled = !isMyTurn;
            document.getElementById('turn-msg').innerText = isMyTurn ? "🎲 ĐẾN LƯỢT BẠN!" : "⏳ Đối thủ đang đi...";
            
            // Cập nhật UI active
            document.querySelectorAll('.p-card').forEach(c => c.classList.remove('active-turn'));
            const activeCard = document.getElementById(`card-${data.turn}`);
            if(activeCard) activeCard.classList.add('active-turn');
        });

        function rollDice() { socket.emit('rollDice', currentRoom); }
        function endTurn() { 
            document.getElementById('btn-end').style.display = 'none';
            socket.emit('endTurn', currentRoom); 
        }

        socket.on('diceRolled', (d) => {
            document.getElementById('dice-val').innerText = `🎲 ${d.d1} - ${d.d2}`;
        });

        socket.on('playerMoved', (data) => {
            // Cập nhật vị trí và tiền (tiền có thể trừ phí đi qua)
            // (Thực tế nên nhận full list players để update cho chuẩn)
        });
        
        // Nhận cập nhật tiền toàn cục
        socket.on('moneyUpdate', (players) => {
            updatePlayerList(players); // Vẽ lại
        });

        socket.on('gameLog', (logs) => {
            const logBox = document.getElementById('game-log');
            logs.forEach(l => {
                const p = document.createElement('div');
                p.style.marginBottom = "5px";
                p.innerText = l;
                logBox.prepend(p); // Tin mới nhất lên đầu
            });
        });

        socket.on('enableEndTurn', () => {
            if(currentTurnPlayerId === myId) document.getElementById('btn-end').style.display = 'block';
        });

        // --- MUA ĐẤT ---
        socket.on('askBuyProperty', (prop) => {
            document.getElementById('buy-modal').classList.remove('hidden');
            document.getElementById('buy-desc').innerText = `Bạn đang ở ${prop.name}. Giá: $${prop.price}. Mua nhé?`;
        });

        function confirmBuy(choice) {
            document.getElementById('buy-modal').classList.add('hidden');
            socket.emit('buyProperty', { roomId: currentRoom, choice: choice });
        }

        // --- RENDER BÀN CỜ (Hàm phụ trợ) ---
        function renderBoard() {
            const board = document.getElementById('board-grid');
            board.innerHTML = '<div class="center-control">' + document.querySelector('.center-control').innerHTML + '</div>';
            
            // Render 40 ô (Logic grid style)
            // Giả sử boardData có 40 phần tử (import từ monopoly-data.js)
            // Nếu không có file data, tạo dummy data ở đây
            const dummyMap = Array.from({length:40}, (_, i) => ({ id: i, name: `Ô số ${i}`, price: i*10, color: i%5===0?'red':'blue' }));
            
            (typeof boardData !== 'undefined' ? boardData : dummyMap).forEach((cell, i) => {
                const div = document.createElement('div');
                div.className = 'tile';
                div.id = `cell-${i}`;
                
                // Tính vị trí Grid (CSS Grid cho viền bàn cờ)
                // Bottom row: 10->0, Left col: 19->11, Top row: 20->30, Right col: 31->39
                if (i >= 0 && i <= 10) { div.style.gridRow = 11; div.style.gridColumn = 11 - i; }
                else if (i >= 11 && i <= 20) { div.style.gridColumn = 1; div.style.gridRow = 11 - (i - 10); }
                else if (i >= 21 && i <= 30) { div.style.gridRow = 1; div.style.gridColumn = i - 20 + 1; }
                else { div.style.gridColumn = 11; div.style.gridRow = i - 30 + 1; }

                div.innerHTML = `
                    <div class="tile-header" style="background:${cell.color || '#bdc3c7'}"></div>
                    <div class="tile-name">${cell.name}</div>
                    ${cell.price ? `<div class="tile-price">$${cell.price}</div>` : ''}
                `;
                board.appendChild(div);
            });
        }
    </script>
</body>
</html>
