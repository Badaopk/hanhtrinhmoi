<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tỷ Phú Thiên Hà 3D - Hành Tinh Mơ Ước</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg-dark: #0a0a1a; --primary: #e94560; --floor: #dfe6e9; }
        body { margin: 0; font-family: 'Nunito', sans-serif; background: var(--bg-dark); color: white; overflow: hidden; }

        /* --- KHUNG NHÌN 3D --- */
        .viewport {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            perspective: 2000px;
        }

        .world {
            position: relative;
            width: 800px; height: 800px;
            transform-style: preserve-3d;
            transform: rotateX(50deg) rotateZ(-45deg); /* Góc nhìn Isometric */
            transition: transform 0.5s ease;
        }

        /* --- BÀN CỜ 3D --- */
        .board-3d {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            width: 800px; height: 800px;
            background: #2d3436;
            border: 10px solid #636e72;
            transform-style: preserve-3d;
            box-shadow: 0 0 100px rgba(0,0,0,0.8), inset 0 0 50px rgba(233, 69, 96, 0.2);
        }

        .tile {
            background: #f5f6fa; border: 1px solid #b2bec3;
            position: relative; display: flex; flex-direction: column;
            text-align: center; color: #2d3436; transform-style: preserve-3d;
        }

        /* Hiệu ứng đứng cho các phi hành gia */
        .token-3d {
            position: absolute; width: 40px; height: 40px;
            pointer-events: none; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d; z-index: 100;
        }
        .astronaut {
            font-size: 3rem; display: block;
            transform: rotateX(-90deg) rotateY(45deg) translateY(-35px); /* Đứng thẳng trên bàn cờ */
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.5));
            animation: float 1s infinite alternate;
        }
        @keyframes float { from { transform: rotateX(-90deg) rotateY(45deg) translateY(-35px); } to { transform: rotateX(-90deg) rotateY(45deg) translateY(-45px); } }

        /* Trung tâm bàn cờ (Vùng tham quan) */
        .center-void {
            grid-column: 2 / 11; grid-row: 2 / 11;
            background: radial-gradient(circle, #16213e, #0a0a1a);
            transform: translateZ(-5px); /* Hơi lõm xuống */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid #34495e;
        }

        /* --- UI OVERLAY --- */
        .ui-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .ui-element { pointer-events: auto; }

        .sidebar {
            position: absolute; left: 20px; top: 20px; bottom: 20px; width: 280px;
            background: rgba(22, 33, 62, 0.9); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        .control-center {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 50px;
            display: flex; gap: 20px; align-items: center;
        }

        .btn-dice {
            width: 80px; height: 80px; border-radius: 50%; background: var(--primary);
            border: none; font-size: 2rem; cursor: pointer; color: white;
            box-shadow: 0 0 20px var(--primary); transition: 0.3s;
        }
        .btn-dice:disabled { background: #636e72; box-shadow: none; }

        /* --- CSS TIỆN ÍCH --- */
        .tile-header { height: 15px; width: 100%; }
        .hidden { display: none !important; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: #333; padding: 30px; border-radius: 20px; z-index: 2000; text-align: center; box-shadow: 0 0 100px rgba(0,0,0,0.5); }
.house-box {
    position: absolute;
    bottom: 2px;
    right: 2px;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    width: 100%;
    pointer-events: none;
}
.house-box span {
    filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5));
    transform: translateZ(5px); /* Đẩy nhà nổi lên mặt bàn cờ */
}
    </style>
</head>
<body>

<div class="viewport">
    <div class="world" id="game-world">
        <div class="board-3d" id="main-board">
            <div class="center-void">
                <div id="dice-result" style="font-size: 5rem; margin-bottom: 20px;">🌌</div>
                <h2 id="turn-indicator" style="font-family: 'Fredoka One'; color: #f1c40f;">ĐANG TẢI...</h2>
            </div>
        </div>
    </div>
</div>

<div class="ui-overlay">
    <div id="home-screen" class="screen modal ui-element" style="width: 400px;">
        <h1 style="font-family: 'Fredoka One'; color: var(--primary);">TỶ PHÚ 3D</h1>
        <button class="btn-dice" onclick="createRoom()" style="width: 100%; border-radius: 15px; font-size: 1.2rem; margin-bottom: 10px;">🏠 TẠO PHÒNG</button>
        <button class="btn-dice" onclick="findRandomMatch()" style="width: 100%; border-radius: 15px; font-size: 1.2rem; background: #e67e22; box-shadow: 0 0 20px #e67e22;">🎲 GHÉP NHANH</button>
        <div style="margin: 15px 0;">- HOẶC -</div>
        <input type="text" id="join-code" placeholder="NHẬP MÃ PHÒNG" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #ccc; text-align: center; font-size: 1.2rem;">
        <button onclick="joinRoom()" style="width: 100%; margin-top: 10px; padding: 15px; border-radius: 10px; background: #3498db; color: white; border: none; font-weight: bold; cursor: pointer;">🚀 THAM GIA</button>
    </div>

    <div id="lobby-screen" class="screen modal ui-element hidden" style="width: 500px;">
        <h2>SẢNH CHỜ PHÒNG: <span id="display-code" style="color:var(--primary)">-</span></h2>
        <div id="lobby-list" style="display: flex; justify-content: center; gap: 10px; margin: 20px 0;"></div>
        <button id="start-btn" onclick="startGame()" class="btn-dice" style="width: 100%; border-radius: 10px; font-size: 1.2rem; display: none;">👑 BẮT ĐẦU NGAY</button>
        <p id="waiting-text" style="color: #666;">Đợi chủ phòng...</p>
    </div>

    <div id="game-ui" class="ui-element hidden">
        <div class="sidebar">
            <h2 style="text-align: center; color: #f1c40f;">HÀNH TINH</h2>
            <div id="player-list-ui"></div>
            <div id="log-box" style="margin-top: 20px; height: 150px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; font-size: 0.8rem; border-radius: 10px;"></div>
        </div>

        <div class="control-center">
    <button id="roll-btn" class="btn-dice" onclick="rollDice()" disabled>🎲</button>
    
    <button id="btn-build" class="btn-dice" style="background:#f1c40f; box-shadow: 0 0 20px #f1c40f; display:none;" onclick="requestBuild()">🏗️</button>
    
    <button id="end-turn-btn" class="btn-dice" style="background:#2ecc71; box-shadow: 0 0 20px #2ecc71; display:none;" onclick="endTurn()">DONE</button>
    
    <div id="timer-display" style="font-size: 1.5rem; font-weight: bold; color: #e74c3c;"></div>
</div>
    </div>

    <div id="buy-modal" class="modal ui-element hidden">
        <h3>MUA THIÊN THẠCH?</h3>
        <p id="buy-info"></p>
        <div style="display: flex; gap: 10px;">
            <button onclick="confirmBuy(true)" style="flex:1; padding:15px; background:#2ecc71; color:white; border:none; border-radius:10px; cursor:pointer;">MUA</button>
            <button onclick="confirmBuy(false)" style="flex:1; padding:15px; background:#95a5a6; color:white; border:none; border-radius:10px; cursor:pointer;">BỎ QUA</button>
        </div>
    </div>
    <div id="auction-modal" class="modal hidden" style="background: rgba(44, 62, 80, 0.9);">
    <div class="menu-box">
        <h2 style="color: #f1c40f;">🔨 ĐẤU GIÁ TÀI SẢN</h2>
        <p id="auction-info"></p>
        <h1 id="current-bid" style="font-size: 3rem;">$10</h1>
        <p id="bidder-name" style="color: #00b894;">Chưa có người trả giá</p>
        <div id="auction-timer-ui" style="font-size: 2rem; color: #e74c3c;">10s</div>
        <button class="btn-modern btn-create" onclick="placeBid()">TRẢ GIÁ +$20</button>
    </div>
</div>
</div>
<script src="monopoly-data.js"></script>
<script>
    const socket = io();
    let myId = null;
    let roomCode = null;
    let currentTileId = null;
    let currentTurnPlayerId = null;
    let playersData = [];
    let boardData = []; // Dữ liệu 40 ô cờ
    let currentAuctionBid = 10;

socket.on('auctionStarted', (data) => {
    document.getElementById('auction-modal').classList.remove('hidden');
    document.getElementById('auction-info').innerText = "Đang đấu giá: " + data.tile.name;
    currentAuctionBid = data.auction.highestBid;
});

socket.on('auctionUpdate', (data) => {
    currentAuctionBid = data.highestBid;
    document.getElementById('current-bid').innerText = "$" + data.highestBid;
    document.getElementById('bidder-name').innerText = "Người trả giá cao nhất: " + data.highestBidder;
});

socket.on('auctionTimer', (time) => {
    document.getElementById('auction-timer-ui').innerText = time + "s";
});

socket.on('auctionEnded', () => {
    document.getElementById('auction-modal').classList.add('hidden');
});

function placeBid() {
    socket.emit('placeBid', { roomId: roomCode, bidAmount: currentAuctionBid + 20 });
}
    socket.on('connect', () => { myId = socket.id; });

    // --- 1. LOBBY LOGIC ---
    function createRoom() { socket.emit('createMonopolyRoom'); }
    function joinRoom() { 
        const code = document.getElementById('join-code').value.toUpperCase();
        if(code) socket.emit('joinMonopolyRoom', code); 
    }
    function findRandomMatch() { socket.emit('findMonopolyMatch'); }
    function startGame() { socket.emit('startMonopoly', roomCode); }

    socket.on('lobbyUpdate', (data) => {
        roomCode = data.roomId;
        document.getElementById('display-code').innerText = data.roomId;
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
        
        const list = document.getElementById('lobby-list');
        list.innerHTML = '';
        data.players.forEach(p => {
            list.innerHTML += `<div style="padding:10px; background:${p.color}; border-radius:50%; width:40px; height:40px; text-align:center;">👤</div>`;
        });

        const isHost = (myId === data.hostId);
        document.getElementById('start-btn').style.display = isHost ? 'block' : 'none';
        document.getElementById('waiting-text').style.display = isHost ? 'none' : 'block';
    });

    // --- 2. GAME LOGIC ---
    socket.on('monopolyUpdate', (data) => {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        
        playersData = data.players;
        renderPlayers();
        
        if (data.logs) {
            const logBox = document.getElementById('log-box');
            data.logs.forEach(l => {
                logBox.innerHTML = `<div>${l}</div>` + logBox.innerHTML;
            });
        }
        Object.keys(data.propertyHouses).forEach(tileId => {
        const count = data.propertyHouses[tileId];
        const container = document.getElementById(`house-container-${tileId}`);
        if (container) {
            // Nếu 5 nhà thì hiện 1 Khách sạn đỏ (🏨), dưới 5 thì hiện số nhà xanh (🏡)
            if (count === 5) {
                container.innerHTML = `<span style="font-size:1.2rem; transform: translateZ(10px);">🏨</span>`;
            } else {
                container.innerHTML = `<span style="font-size:0.8rem;">${"🏡".repeat(count)}</span>`;
            }
        }
    });

    // Hiện biểu tượng Ở Tù
    data.players.forEach(p => {
        if (p.inJail) {
            const sidebarP = document.getElementById(`p-info-${p.id}`);
            if (sidebarP) sidebarP.innerHTML += " ⛓️";
        }
    });
    });

    socket.on('turnChanged', (data) => {
        currentTurnPlayerId = data.turn;
        const isMyTurn = (data.turn === myId);
        document.getElementById('roll-btn').disabled = !isMyTurn;
        document.getElementById('turn-indicator').innerText = isMyTurn ? "ĐẾN LƯỢT BÉ!" : "ĐANG ĐỢI...";
        document.getElementById('turn-indicator').style.color = isMyTurn ? "#2ecc71" : "#f1c40f";
    });

    socket.on('diceRolled', (d) => {
        document.getElementById('dice-result').innerText = `🎲 ${d.d1} + ${d.d2}`;
    });

    socket.on('askBuyProperty', (pos) => {
        currentTileId = pos; // Lưu vị trí ô đất lại để dùng cho hàm confirmBuy
        const prop = boardData[pos];
        document.getElementById('buy-info').innerText = `${prop.name} - Giá: ${prop.price}💎`;
        document.getElementById('buy-modal').classList.remove('hidden');
    });
    socket.on('enableEndTurn', () => {
    if(currentTurnPlayerId === myId) {
        document.getElementById('end-turn-btn').style.display = 'block';
        
        // KIỂM TRA: Nếu đang đứng trên đất của mình, hiện nút Xây Nhà
        const tile = boardData[currentTileId];
        if (tile && tile.type === 'property') {
            document.getElementById('btn-build').style.display = 'block';
        }
    }
});
    function rollDice() { socket.emit('rollDice', roomCode); }
    function endTurn() { 
        document.getElementById('end-turn-btn').style.display = 'none';
        socket.emit('endTurn', roomCode); 
    }
    function confirmBuy(choice) {
    document.getElementById('buy-modal').classList.add('hidden');
    if (!choice) {
        // Nếu bé không mua, báo server bắt đầu Đấu Giá cho cả phòng
        socket.emit('startAuction', { roomId: roomCode, tileId: currentTileId });
    } else {
        socket.emit('buyProperty', { roomId: roomCode, choice: true });
    }
}
function requestBuild(tileId) {
    socket.emit('buildHouse', { roomId: roomCode, tileId: tileId });
}

socket.on('buildSuccess', (msg) => {
    alert("🏗️ " + msg);
});
    // --- 3. 3D RENDERING ---
function setupBoard() {
    const board = document.getElementById('main-board');
    boardData.forEach((cell, i) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;
        
        // Logic CSS Grid cũ...
        if (i <= 10) { tile.style.gridRow = 11; tile.style.gridColumn = 11 - i; }
        else if (i <= 20) { tile.style.gridColumn = 1; tile.style.gridRow = 11 - (i - 10); }
        else if (i <= 30) { tile.style.gridRow = 1; tile.style.gridColumn = i - 20 + 1; }
        else { tile.style.gridColumn = 11; tile.style.gridRow = i - 30 + 1; }
        
        // Vẽ giao diện ô đất
        tile.innerHTML = `
            <div class="tile-header" style="background:${cell.color || '#dfe6e9'}"></div>
            <div style="padding: 2px;">
                <div style="font-size: 0.6rem; font-weight: 800; line-height: 1;">${cell.name}</div>
                <div style="font-size: 0.5rem; color: #e67e22; margin-top: 2px;">${cell.price > 0 ? '$'+cell.price : ''}</div>
            </div>
            <div id="house-container-${i}" class="house-box"></div> `;
        board.appendChild(tile);
    });
}

    function renderPlayers() {
        // Cập nhật danh sách bên Sidebar
        const listUI = document.getElementById('player-list-ui');
        listUI.innerHTML = '';
        
        playersData.forEach((p, idx) => {
            // Sidebar UI
            listUI.innerHTML += `
                <div style="display:flex; justify-content:space-between; padding:10px; margin-bottom:5px; background:rgba(255,255,255,0.1); border-radius:10px; border-left: 5px solid ${p.color}">
                    <span>${p.username}</span>
                    <span style="color:#f1c40f; font-weight:bold;">${p.money} 💎</span>
                </div>
            `;

            // 3D Avatar trên bàn cờ
            let token = document.getElementById(`token-${p.id}`);
            if(!token) {
                token = document.createElement('div');
                token.id = `token-${p.id}`;
                token.className = 'token-3d';
                token.innerHTML = `<span class="astronaut">🏃</span>`;
                token.querySelector('.astronaut').style.color = p.color;
                document.getElementById('main-board').appendChild(token);
            }

            // Di chuyển token đến ô tương ứng
            const targetTile = document.getElementById(`tile-${p.position}`);
            if (targetTile) {
                token.style.left = targetTile.offsetLeft + (idx * 5) + 'px';
                token.style.top = targetTile.offsetTop + (idx * 5) + 'px';
                token.style.zIndex = 100 + idx;
            }
        });
    }

    // Lắng nghe phím mũi tên để đi dạo (Chỉ di chuyển nhân vật cục bộ để giải trí)
    window.addEventListener('keydown', (e) => {
        if (document.getElementById('game-ui').classList.contains('hidden')) return;
        const myToken = document.getElementById(`token-${myId}`);
        if (!myToken) return;
        
        let l = parseInt(myToken.style.left);
        let t = parseInt(myToken.style.top);
        if (e.key === 'ArrowUp') t -= 10;
        if (e.key === 'ArrowDown') t += 10;
        if (e.key === 'ArrowLeft') l -= 10;
        if (e.key === 'ArrowRight') l += 10;
        
        myToken.style.left = l + 'px';
        myToken.style.top = t + 'px';
    });

    setupBoard();
</script>
</body>
</html>
