<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Luyện Nói Cùng Bé</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
            font-family: 'Baloo 2', cursive;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        
        .mic-container {
            position: relative;
            margin: 30px auto;
            width: 100px; height: 100px;
        }

        .mic-btn {
            width: 100%; height: 100%;
            border-radius: 50%; border: none;
            background: #3498db; color: white; font-size: 3rem;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
            position: relative; z-index: 2;
        }

        /* Hiệu ứng sóng âm khi đang nghe */
        .listening-ring {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; background: rgba(52, 152, 219, 0.5);
            z-index: 1; opacity: 0;
        }
        .mic-btn.active + .listening-ring { animation: ripple 1.5s infinite; }
        .mic-btn.active { background: #e74c3c; transform: scale(1.1); }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        .sentence-card {
            background: white; padding: 20px 40px; border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px;
            border: 3px solid #f1c40f;
        }

        .nav-btn {
            padding: 10px 25px; border-radius: 30px; border: none; font-weight: bold;
            font-size: 1.1rem; cursor: pointer; color: white; font-family: inherit;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: 0.2s;
        }
        .nav-btn:active { transform: translateY(3px); box-shadow: none; }
        
        .level-info {
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 15px; border-radius: 15px;
            margin-bottom: 10px; color: #27ae60; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 style="color: #2c3e50; text-shadow: 2px 2px 0 white; font-size: 3rem; margin-top: 20px;">🎤 Họa Mi Tập Hót 🎤</h1>
    
    <div class="level-info">Cấp độ hiện tại: <span id="current-level-display">1</span></div>

    <div style="text-align: center; max-width: 600px; padding: 20px;">
        
        <div class="sentence-card">
            <p style="color: #7f8c8d; font-size: 1.1rem; margin:0;">Hãy đọc to câu này:</p>
            <h2 id="target-phrase" style="color: #d35400; font-size: 2.2rem; margin: 10px 0;">"Con mèo trèo cây cau"</h2>
        </div>
        
        <div class="mic-container">
            <button id="record-btn" class="mic-btn">🎙️</button>
            <div class="listening-ring"></div>
        </div>
        
        <p id="result-text" style="font-size: 1.3rem; color: #34495e; min-height: 30px; font-style: italic;">Nhấn micro để bắt đầu...</p>
        <div id="score-area" style="min-height: 40px;"></div>
        
        <div style="margin-top: 30px; display: flex; gap: 20px; justify-content: center;">
            <button onclick="window.location.href='index.html'" class="nav-btn" style="background: #95a5a6;">🏠 Về Nhà</button>
            <button id="next-btn" class="nav-btn" style="background: #2ecc71; display: none;" onclick="nextSentence()">Câu Tiếp Theo ➡️</button>
        </div>

    </div>
<script>
        // --- DANH SÁCH CÂU LUYỆN TẬP ---
        // --- DANH SÁCH 100 CÂU LUYỆN NÓI (TỪ DỄ ĐẾN KHÓ) ---
const phrases = [
    // Cấp 1-10: Từ đơn và từ đôi đơn giản
    "Bà", "Mẹ", "Bố", "Cá", "Gà", 
    "Quả cam", "Con mèo", "Cái bàn", "Quyển sách", "Đi học",

    // Cấp 11-20: Câu 3 chữ
    "Bé đi học", "Mẹ đi làm", "Bố đọc báo", "Bà kể chuyện", "Em ăn cơm",
    "Gà cục tác", "Mèo meo meo", "Chó gâu gâu", "Cây xanh xanh", "Hoa đỏ thắm",

    // Cấp 21-30: Từ láy và phụ âm khó (L/N, Tr/Ch)
    "Lấp lánh", "Lung linh", "Náo nức", "Ninh ních", "Tròn trĩnh",
    "Chăm chỉ", "Sạch sẽ", "Xinh xắn", "Mũm mĩm", "Lon ton",

    // Cấp 31-40: Câu 4-5 chữ về gia đình & nhà trường
    "Gia đình em rất vui", "Trường của em rất đẹp", "Cô giáo em hiền dịu",
    "Bạn bè cùng trang lứa", "Học tập thật chăm chỉ", "Vâng lời ông bà cha mẹ",
    "Giúp đỡ bạn bè khó khăn", "Giữ gìn vệ sinh chung", "Ăn quả nhớ kẻ trồng cây",
    "Uống nước nhớ nguồn",

    // Cấp 41-50: Các câu nói líu lưỡi (Tongue Twisters) - Mức dễ
    "Lúa nếp là lúa nếp làng", "Lúa lên lớp lớp lòng nàng lâng lâng",
    "Con lươn nó luồn qua lườn", "Chị lặt rau rồi luộc", 
    "Buổi trưa ăn bưởi chua", "Lá lành đùm lá rách",
    "Ông bụt ở chùa bùi cầm bùa đuổi chuột", "Đầu làng có con lợn nái",
    "Con cá rô rục rịch trong rổ", "Trèo trẹo chân trượt trẹo chân",

    // Cấp 51-60: Ca dao, Tục ngữ quen thuộc
    "Công cha như núi Thái Sơn", "Nghĩa mẹ như nước trong nguồn chảy ra",
    "Bầu ơi thương lấy bí cùng", "Tuy rằng khác giống nhưng chung một giàn",
    "Nhiễu điều phủ lấy giá gương", "Người trong một nước phải thương nhau cùng",
    "Anh em như thể tay chân", "Rách lành đùm bọc dở hay đỡ đần",
    "Một cây làm chẳng nên non", "Ba cây chụm lại nên hòn núi cao",

    // Cấp 61-70: Câu miêu tả thiên nhiên & Cảm xúc
    "Bầu trời hôm nay trong xanh và cao vút", 
    "Những đám mây trắng bồng bềnh trôi nhẹ nhàng",
    "Tiếng chim hót líu lo chào ngày mới",
    "Cánh đồng lúa chín vàng ươm trải dài tít tắp",
    "Em cảm thấy rất hạnh phúc khi được điểm mười",
    "Mùa hè ve kêu râm ran khắp phố phường",
    "Mùa thu lá vàng rơi xào xạc trên sân trường",
    "Mùa đông gió bấc thổi lạnh buốt đôi bàn tay",
    "Mùa xuân hoa đào nở rực rỡ cả một góc trời",
    "Dòng sông quê hương hiền hòa chảy quanh năm",

    // Cấp 71-80: Các câu nói líu lưỡi - Mức khó (Thử thách L/N, R/D/Gi)
    "Nồi đồng nấu ốc nồi đất nấu ếch", 
    "Ông nấu ốc nồi đồng tôi nấu ếch nồi đất",
    "Lúc nào lên núi lấy nứa về làm lán",
    "Phụ nữ Việt Nam trung hậu đảm đang",
    "Giặc đến nhà đàn bà cũng đánh",
    "Con két con kẹp con két cái",
    "Con cá mòi béo để gốc quéo cho mèo đói ăn",
    "Luộc hột vịt lộn luộc lộn hột vịt lạc",
    "Ăn hột vịt lộn lại luộc lại hột vịt lộn",
    "Vạch vách đút bánh đúc cho chồng ăn",

    // Cấp 81-90: Đoạn văn ngắn & Thơ
    "Hạt gạo làng ta / Có vị phù sa / Của sông Kinh Thầy",
    "Có hương sen thơm / Trong hồ nước đầy / Có lời mẹ hát",
    "Đường vô xứ Nghệ quanh quanh / Non xanh nước biếc như tranh họa đồ",
    "Tháp Mười đẹp nhất bông sen / Việt Nam đẹp nhất có tên Bác Hồ",
    "Trăm năm trong cõi người ta / Chữ tài chữ mệnh khéo là ghét nhau",
    "Cày đồng đang buổi ban trưa / Mồ hôi thánh thót như mưa ruộng cày",
    "Ai ơi bưng bát cơm đầy / Dẻo thơm một hạt đắng cay muôn phần",
    "Quê hương là chùm khế ngọt / Cho con trèo hái mỗi ngày",
    "Quê hương là đường đi học / Con về rợp bướm vàng bay",
    "Việt Nam đất nước ta ơi / Mênh mông biển lúa đâu trời đẹp hơn",

    // Cấp 91-100: Thử thách Thần đồng Tiếng Việt (Câu dài & Phức tạp)
    "Tôi yêu tiếng nước tôi từ khi mới ra đời người ơi",
    "Tiếng Việt phong phú và giàu bản sắc văn hóa dân tộc",
    "Giữ gìn sự trong sáng của Tiếng Việt là trách nhiệm của mỗi người",
    "Dù ai đi ngược về xuôi nhớ ngày giỗ tổ mùng mười tháng ba",
    "Non sông gấm vóc Việt Nam do phụ nữ ta trẻ cũng như già dệt thêu mà thêm tốt đẹp rực rỡ",
    "Đoàn kết đoàn kết đại đoàn kết thành công thành công đại thành công",
    "Học thầy không tày học bạn học vạn sự đời",
    "Đi một ngày đàng học một sàng khôn",
    "Lá rụng về cội nước chảy về nguồn con người nhớ về tổ tiên",
    "Chúc mừng bé đã hoàn thành xuất sắc thử thách luyện nói tiếng Việt"
];        
        let currentLevel = 1;
    let currentIndex = 0;

    // Hàm khởi tạo thông minh (Thay cho window.onload)
    async function init() {
        try {
            const res = await fetch('/api/user/progress');
            if (res.ok) {
                const data = await res.json();
                // Lấy đúng biến vietSpeechLevel
                currentLevel = data.vietSpeechLevel || 1; 
            }
        } catch(e) { console.error("Lỗi tải cấp độ:", e); }

        // --- LOGIC ĐỒNG BỘ QUAN TRỌNG ---
        // Cấp 1 tương ứng với phần tử 0 trong mảng
        currentIndex = currentLevel - 1; 
        
        // Cập nhật giao diện số cấp độ
        document.getElementById('current-level-display').textContent = currentLevel;

        // Cập nhật câu chữ hiển thị
        showCurrentSentence();
    }

    // Hàm hiển thị câu (Tách riêng để dùng lại)
    function showCurrentSentence() {
        // Đảm bảo không bị lỗi nếu phá đảo 100 cấp
        if (currentIndex >= phrases.length) currentIndex = phrases.length - 1;
        
        targetEl.textContent = `"${phrases[currentIndex]}"`;
        scoreArea.innerHTML = "";
        resultText.textContent = "Nhấn micro để bắt đầu...";
        nextBtn.style.display = 'none';
    }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const btn = document.getElementById('record-btn');
        const resultText = document.getElementById('result-text');
        const scoreArea = document.getElementById('score-area');
        const targetEl = document.getElementById('target-phrase');
        const nextBtn = document.getElementById('next-btn');

        if (!SpeechRecognition) {
            alert("Trình duyệt không hỗ trợ. Hãy dùng Google Chrome!");
            btn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.continuous = false;
            recognition.interimResults = false;

            btn.onclick = () => {
                try {
                    recognition.start();
                    btn.classList.add('active');
                    resultText.textContent = "Đang nghe...";
                    resultText.style.color = "#e67e22";
                    scoreArea.innerHTML = "";
                    nextBtn.style.display = 'none';
                } catch(e) {}
            };

            recognition.onend = () => { btn.classList.remove('active'); };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                resultText.textContent = `Bé nói: "${text}"`;
                resultText.style.color = "#34495e";
                checkResult(text);
            };
        }

        // --- THUẬT TOÁN SO SÁNH CHÍNH XÁC (LEVENSHTEIN) ---
        function similarity(s1, s2) {
            let longer = s1, shorter = s2;
            if (s1.length < s2.length) { longer = s2; shorter = s1; }
            let longerLength = longer.length;
            if (longerLength === 0) return 1.0;
            return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else {
                        if (j > 0) {
                            let newValue = costs[j - 1];
                            if (s1.charAt(i - 1) != s2.charAt(j - 1))
                                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                            costs[j - 1] = lastValue;
                            lastValue = newValue;
                        }
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        function checkResult(spokenText) {
            const target = phrases[currentIndex];
            const cleanSpoken = spokenText.toLowerCase().replace(/[.,!?;:"-]/g, '').trim().replace(/\s+/g, ' ');
            const cleanTarget = target.toLowerCase().replace(/[.,!?;:"-]/g, '').trim().replace(/\s+/g, ' ');

            // Tính độ chính xác (0.0 -> 1.0)
            const score = similarity(cleanSpoken, cleanTarget);
            const percent = Math.round(score * 100);
            
            console.log(`Độ giống: ${percent}%`);

            // Đúng trên 75% là đạt
            if (percent >= 75) {
                scoreArea.innerHTML = `<h3 style='color:#27ae60; margin:0;'>🎉 CHÍNH XÁC! (${percent}%) 🎉</h3>`;
                nextBtn.style.display = 'block';
                
                // SỬA: Gọi đúng API viet-speech-win
                fetch('/api/game/viet-speech-win', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level: currentLevel, timeTaken: 0 }) 
                })        
                .then(res => res.json())
                .then(data => {
                    if (data.newLevel) {
                        currentLevel = data.newLevel;
                        document.getElementById('current-level-display').textContent = currentLevel;
                    }
                });
            } else {
                scoreArea.innerHTML = `<h3 style='color:#e74c3c; margin:0;'>Chưa đúng lắm (${percent}%)! Thử lại nhé 💪</h3>`;
            }
        }

        function nextSentence() {
            currentIndex = (currentIndex + 1) % phrases.length;
            targetEl.textContent = `"${phrases[currentIndex]}"`;
            scoreArea.innerHTML = "";
            resultText.textContent = "Nhấn micro để bắt đầu...";
            nextBtn.style.display = 'none';
        }
    </script>    
</body>
</html>
