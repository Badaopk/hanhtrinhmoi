<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vua Ô Chữ - 100 Cấp</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f39c12; font-family: 'Baloo 2', cursive; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .container { 
            background: white; width: 90%; max-width: 800px; 
            margin: 20px; padding: 20px; border-radius: 20px; 
            box-shadow: 0 10px 0 rgba(0,0,0,0.1); 
            text-align: center;
        }

        /* Màn hình chọn Level */
        #level-select-screen { display: block; }
        .level-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); 
            gap: 10px; max-height: 60vh; overflow-y: auto; padding: 10px;
        }
        .lvl-btn { 
            padding: 10px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; 
            background: #eee; color: #555; transition: 0.2s;
        }
        .lvl-btn.unlocked { background: #2ecc71; color: white; box-shadow: 0 4px 0 #27ae60; }
        .lvl-btn.current { background: #e67e22; color: white; transform: scale(1.1); box-shadow: 0 4px 0 #d35400; }
        .lvl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Màn hình chơi */
        #game-screen { display: none; }
        .crossword-table { margin: 20px auto; border-collapse: collapse; border: 4px solid #2c3e50; }
        .cw-cell { 
            width: 40px; height: 40px; border: 1px solid #95a5a6; 
            position: relative; padding: 0;
        }
        .cw-cell.black { background: #2c3e50; }
        .cw-cell.white { background: #fff; }
        
        .cw-cell input { 
            width: 100%; height: 100%; border: none; text-align: center; 
            font-size: 1.2rem; font-weight: bold; text-transform: uppercase; 
            color: #2c3e50; background: transparent; outline: none; 
            font-family: inherit;
        }
        .cw-cell input:focus { background: #fff3cd; }
        .cw-cell .num { 
            position: absolute; top: 1px; left: 2px; 
            font-size: 0.6rem; color: #7f8c8d; pointer-events: none;
        }

        .clues-area { 
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; 
            text-align: left; background: #ecf0f1; padding: 15px; border-radius: 10px;
        }
        .clue-col { flex: 1; min-width: 200px; }
        .clue-col h3 { margin-top: 0; color: #e67e22; border-bottom: 2px solid #bdc3c7; padding-bottom: 5px; }
        ul { padding-left: 20px; margin: 0; }
        li { margin-bottom: 5px; font-size: 0.95rem; }

        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 20px; border-radius: 50px; border: none; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(2px); box-shadow: none; }
    </style>
</head>
<body>

    <h1 style="color: white; margin: 10px 0; text-shadow: 2px 2px 0 rgba(0,0,0,0.2);">🧩 VUA Ô CHỮ 🧩</h1>

    <div class="container">
        <div id="level-select-screen">
            <h2>Chọn Thử Thách</h2>
            <div class="level-grid" id="level-list">Đang tải...</div>
            <button class="btn" style="background:#e74c3c; margin-top:20px;" onclick="window.location.href='index.html'">🏠 Về Trang Chủ</button>
        </div>

        <div id="game-screen">
            <h2 id="level-title" style="color:#2c3e50; margin:0;">Cấp độ 1</h2>
            
            <table class="crossword-table" id="cw-grid"></table>

            <div class="clues-area">
                <div class="clue-col">
                    <h3>Hàng Ngang</h3>
                    <ul id="across-list"></ul>
                </div>
                <div class="clue-col">
                    <h3>Hàng Dọc</h3>
                    <ul id="down-list"></ul>
                </div>
            </div>

            <div class="controls">
                <button class="btn" style="background:#f1c40f; color:#333" onclick="useHint()">💡 Gợi Ý (<span id="hint-count">3</span>)</button>
                <button class="btn" style="background:#2ecc71" onclick="checkWin()">✅ Kiểm Tra</button>
                <button class="btn" style="background:#95a5a6" onclick="backToMenu()">🔙 Thoát</button>
            </div>
        </div>
    </div>
<script>
    let currentLevel = 1;
    let unlockedLevel = 1;
    let hints = 3;
    let gameStartTime;

    // 1. KHO TỪ VỰNG CHO CÁC CẤP ĐỘ NGẪU NHIÊN (CẤP 6-100)
    const vocab = [
        {w:'MEO', h:'Con gì thích bắt chuột?'}, {w:'CHO', h:'Người bạn trung thành giữ nhà?'},
        {w:'GA', h:'Con gì gáy ò ó o?'}, {w:'VIT', h:'Con gì kêu cạp cạp?'},
        {w:'CA', h:'Con gì bơi dưới nước?'}, {w:'HEO', h:'Con gì ăn no lại nằm ngủ?'},
        {w:'VOI', h:'Con gì có cái vòi rất dài?'}, {w:'HO', h:'Được mệnh danh là Chúa sơn lâm?'},
        {w:'CAM', h:'Quả gì vỏ màu da cam, nhiều vitamin C?'}, {w:'TAO', h:'Quả gì mà Bạch Tuyết đã ăn?'},
        {w:'XOAI', h:'Quả gì hạt to, khi chín màu vàng rất thơm?'}, {w:'NHO', h:'Quả gì mọc thành từng chùm tím hoặc xanh?'},
        {w:'BAN', h:'Vật dùng để kê sách vở khi bé ngồi học?'}, {w:'GHE', h:'Vật dùng để bé ngồi vào bàn học?'},
        {w:'BUT', h:'Vật bé dùng để viết bài vào vở?'}, {w:'SACH', h:'Kho tàng tri thức của bé?'}
    ];

    // 2. DỮ LIỆU 5 CẤP ĐỘ ĐẦU TIÊN CỐ ĐỊNH CỰC CHUẨN
    const fixedLevels = [
        { 
            id: 1, size: 7, 
            words: [
                { d: 'a', r: 3, c: 1, w: 'MEO', h: 'Con gì thích bắt chuột?' }, 
                { d: 'd', r: 1, c: 3, w: 'HEO', h: 'Con gì ăn no lại nằm thở phì phò?' }
            ] 
        },
        { 
            id: 2, size: 7, 
            words: [
                { d: 'a', r: 2, c: 1, w: 'CHO', h: 'Người bạn trung thành giữ nhà?' }, 
                { d: 'd', r: 2, c: 1, w: 'CA', h: 'Động vật sống dưới nước?' }
            ] 
        },
        { 
            id: 3, size: 8, 
            words: [
                { d: 'a', r: 2, c: 2, w: 'CAM', h: 'Quả gì vỏ màu da cam?' }, 
                { d: 'd', r: 1, c: 4, w: 'MUA', h: 'Hiện tượng nước rơi từ mây xuống?' }
            ] 
        },
        { 
            id: 4, size: 8, 
            words: [
                { d: 'a', r: 4, c: 1, w: 'BUT', h: 'Vật dùng để viết vào vở?' }, 
                { d: 'd', r: 3, c: 1, w: 'BAN', h: 'Vật dùng để kê sách khi học?' }
            ] 
        },
        { 
            id: 5, size: 9, 
            words: [
                { d: 'a', r: 3, c: 2, w: 'SACH', h: 'Kho tàng tri thức của bé?' }, 
                { d: 'd', r: 1, c: 5, w: 'HOA', h: 'Vật có cánh và mùi thơm rực rỡ?' }
            ] 
        }
    ];

    // 3. KHỞI TẠO TIẾN TRÌNH TỪ SERVER
    async function init() {
        try {
            const res = await fetch('/api/user/progress');
            const data = await res.json();
            unlockedLevel = data.crosswordLevel || 1;
        } catch(e) { console.log("Lỗi tải tiến trình, chơi offline."); }
        renderLevelList();
    }

    function renderLevelList() {
        const list = document.getElementById('level-list');
        list.innerHTML = '';
        for(let i=1; i<=100; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = `lvl-btn ${i <= unlockedLevel ? 'unlocked' : ''} ${i === unlockedLevel ? 'current' : ''}`;
            btn.disabled = i > unlockedLevel;
            btn.onclick = () => startGame(i);
            list.appendChild(btn);
        }
    }

    // 4. BẮT ĐẦU CHƠI (ĐÃ SỬA LỖI LOGIC RETURN)
    function startGame(lvl) {
        currentLevel = lvl;
        gameStartTime = Date.now();
        let data = fixedLevels.find(l => l.id === lvl);
        
        // Nếu không có trong fixedLevels, tự tạo cấp độ ngẫu nhiên từ kho vocab
        if(!data) {
            const w1 = vocab[Math.floor(Math.random() * vocab.length)];
            let w2 = vocab.find(v => v.w !== w1.w) || vocab[0];
            data = {
                id: lvl, size: 10,
                words: [
                    { d: 'a', r: 4, c: 2, w: w1.w, h: w1.h },
                    { d: 'd', r: 3, c: 3, w: w2.w, h: w2.h }
                ]
            };
        }

        document.getElementById('level-select-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('level-title').textContent = `Cấp độ ${lvl}`;
        hints = 3; 
        document.getElementById('hint-count').textContent = hints;

        drawGrid(data);
    }

    // 5. VẼ LƯỚI Ô CHỮ VÀ KIỂM TRA ĐIỂM GIAO
    function drawGrid(data) {
        const table = document.getElementById('cw-grid');
        const aList = document.getElementById('across-list');
        const dList = document.getElementById('down-list');
        table.innerHTML = ''; aList.innerHTML = ''; dList.innerHTML = '';

        let grid = Array(data.size).fill(null).map(() => Array(data.size).fill(null));

        data.words.forEach((word, idx) => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${idx+1}.</strong> ${word.h}`;
            if(word.d === 'a') aList.appendChild(li); else dList.appendChild(li);

            for(let i=0; i<word.w.length; i++) {
                let r = word.r + (word.d==='d' ? i : 0);
                let c = word.c + (word.d==='a' ? i : 0);
                
                // Vá lỗi điểm giao: Nếu ô đã có chữ, kiểm tra xem có khớp không
                if (!grid[r][c]) {
                    grid[r][c] = { char: word.w[i], nums: [] };
                } else if (grid[r][c].char !== word.w[i]) {
                    console.error(`Lỗi giao nhau tại (${r},${c}): ${grid[r][c].char} != ${word.w[i]}`);
                }
                if (i === 0) grid[r][c].nums.push(idx + 1);
            }
        });

        for(let r=0; r<data.size; r++) {
            const tr = document.createElement('tr');
            for(let c=0; c<data.size; c++) {
                const td = document.createElement('td');
                const cell = grid[r][c];
                
                if(cell) {
                    td.className = 'cw-cell white';
                    if(cell.nums.length > 0) td.innerHTML += `<span class="num">${cell.nums.join('/')}</span>`;
                    const inp = document.createElement('input');
                    inp.maxLength = 1;
                    inp.dataset.ans = cell.char;
                    inp.oninput = function() { 
                        this.value = this.value.toUpperCase();
                        if(this.value) focusNext(this); 
                    };
                    td.appendChild(inp);
                } else {
                    td.className = 'cw-cell black';
                }
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
    }

    // 6. VÁ LỖI ĐIỀU HƯỚNG Ô NHẬP (THÔNG MINH THEO HÀNG/CỘT)
    function focusNext(currentInput) {
        const table = document.getElementById('cw-grid');
        const row = currentInput.parentElement.parentElement.rowIndex;
        const col = currentInput.parentElement.cellIndex;

        // Tìm ô tiếp theo bên phải (cho hàng ngang) hoặc bên dưới (cho hàng dọc)
        let nextCell = table.rows[row]?.cells[col + 1]?.querySelector('input') || 
                       table.rows[row + 1]?.cells[col]?.querySelector('input');
        
        if (nextCell) nextCell.focus();
    }

    // 7. HÀM GỢI Ý
    function useHint() {
        if(hints <= 0) return alert("Hết gợi ý rồi bé ơi!");
        const inputs = Array.from(document.querySelectorAll('input')).filter(i => !i.value);
        if(inputs.length === 0) return;
        
        const randomInput = inputs[Math.floor(Math.random() * inputs.length)];
        randomInput.value = randomInput.dataset.ans;
        randomInput.style.color = '#2980b9';
        hints--;
        document.getElementById('hint-count').textContent = hints;
    }

    // 8. KIỂM TRA THẮNG VÀ KẾT NỐI SERVER
    async function checkWin() {
        const inputs = document.querySelectorAll('input');
        let correct = true;
        inputs.forEach(i => {
            if(i.value.toUpperCase() !== i.dataset.ans) {
                i.style.color = 'red';
                correct = false;
            } else {
                i.style.color = '#2ecc71';
            }
        });

        if(correct) {
            const timeSpent = Math.floor((Date.now() - gameStartTime) / 1000);
            try {
                const res = await fetch('/api/game/crossword-win', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        level: currentLevel,
                        timeTaken: timeSpent // Gửi thời gian chuẩn để Admin tính điểm phạt
                    })
                });
                const d = await res.json();
                if(d.newLevel) unlockedLevel = d.newLevel;
                alert("🎉 GIỎI QUÁ! Bé đã vượt qua thử thách này!");
                backToMenu();
            } catch(e) {
                alert("Bé đã thắng rồi! (Lỗi kết nối server)");
                backToMenu();
            }
        } else {
            alert("Hic, có ô bị sai rồi. Bé kiểm tra lại các ô màu đỏ nhé!");
        }
    }

    function backToMenu() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('level-select-screen').style.display = 'block';
        init(); // Tải lại danh sách level để cập nhật trạng thái mới
    }

    init();
</script>
</body>
</html>
