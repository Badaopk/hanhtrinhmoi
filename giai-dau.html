    <meta charset="UTF-8">

<style>
@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
}
    body.tournament-bg {
        background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
        color: white; font-family: 'Baloo 2', cursive;
        min-height: 100vh; margin: 0; padding: 20px;
    }
    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px; padding: 30px;
        max-width: 800px; margin: 20px auto;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    h1 { font-size: 3rem; text-shadow: 0 0 20px #f1c40f; color: #f1c40f; margin-bottom: 30px; }
    
    /* Giao diện Card trận đấu */
    .match-card {
        background: linear-gradient(135deg, #ffffff 0%, #f1f2f6 100%);
        border-radius: 20px; padding: 20px; margin: 15px 0;
        color: #2c3e50; border-left: 10px solid #f1c40f;
        transition: 0.3s; position: relative; overflow: hidden;
    }
    .match-card:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3); }
    .match-header { font-size: 0.9rem; color: #7f8c8d; font-weight: bold; margin-bottom: 10px; }
    
    .vs-box { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 1.4rem; font-weight: 800; }
    .player-name { flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #eee; }
    .vs-badge { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 50%; font-size: 0.8rem; }
    
    .btn-play {
        background: linear-gradient(to bottom, #2ecc71, #27ae60);
        color: white; border: none; padding: 12px 30px;
        border-radius: 50px; cursor: pointer; font-weight: bold;
        font-size: 1.1rem; box-shadow: 0 5px 0 #1e8449; margin-top: 15px;
    }
    .btn-play:active { transform: translateY(3px); box-shadow: none; }

    .status-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-top: 10px; }
    .status-open { background: #2ecc71; color: white; }
    .status-playing { background: #e67e22; color: white; }
/* Nút Trở về Trang Chủ */
.btn-home {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    font-family: 'Baloo 2', cursive;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 1000;
}
.btn-home:hover {
    background: white;
    color: #2c3e50;
    transform: translateY(2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
/* --- CSS SƠ ĐỒ THI ĐẤU (BRACKET TREE) --- */
.tournament-bracket {
    display: flex;
    justify-content: center;
    padding: 20px 0;
}
.round {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin: 0 20px;
    gap: 20px;
}
.match-node {
    background: #ecf0f1;
    border: 2px solid #bdc3c7;
    border-radius: 10px;
    padding: 10px;
    width: 200px;
    position: relative;
    color: #2c3e50;
    transition: 0.2s;
}
/* Kẻ đường nối */
.match-node::after {
    content: ''; position: absolute; right: -22px; top: 50%;
    width: 20px; height: 2px; background: #bdc3c7;
}
.round:last-child .match-node::after { display: none; } /* Chung kết không có đường ra */

/* Đường nối dọc cho nhánh con */
.match-node.connector::before {
    content: ''; position: absolute; right: -22px; height: 50%; width: 2px; background: #bdc3c7;
    top: 50%; /* Sẽ chỉnh bằng JS nếu cần */
}

/* Trạng thái trận đấu */
.match-live { border-color: #e67e22; box-shadow: 0 0 10px #e67e22; animation: pulse 2s infinite; }
.match-finished { border-color: #27ae60; opacity: 0.8; }
.match-upcoming { border-color: #7f8c8d; }

/* Trận của BÉ */
.my-match {
    border: 3px solid #3498db !important;
    background: #eaf6ff !important;
    transform: scale(1.05);
}

.player-row { display: flex; justify-content: space-between; padding: 2px 0; font-weight: bold; }
.player-row.winner { color: #27ae60; }
.player-row.loser { color: #95a5a6; text-decoration: line-through; }
.match-time { font-size: 0.7rem; color: #7f8c8d; text-align: center; margin-bottom: 5px; border-bottom: 1px solid #ccc; }

/* Tab chuyển đổi */
.view-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
.tab-btn { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; background: rgba(255,255,255,0.2); color: white; }
.tab-btn.active { background: #f1c40f; color: #2c3e50; }
/* Thanh chọn bảng đấu (Group Tabs) */
.group-nav {
    display: flex;
    gap: 10px;
    overflow-x: auto; /* Cho phép cuộn ngang nếu nhiều bảng */
    padding-bottom: 10px;
    margin-bottom: 15px;
    border-bottom: 2px solid rgba(255,255,255,0.2);
}
.group-tab-btn {
    padding: 8px 15px;
    background: rgba(0,0,0,0.3);
    border: 1px solid #7f8c8d;
    color: #bdc3c7;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
    white-space: nowrap;
}
.group-tab-btn:hover { background: rgba(255,255,255,0.1); }
.group-tab-btn.active {
    background: #f1c40f;
    color: #2c3e50;
    border-color: #f1c40f;
    transform: translateY(2px); /* Hiệu ứng nhấn xuống */
}
</style>

<div class="container" id="bracket-view" style="display:none">
    <div class="view-tabs">
        <button class="tab-btn active" onclick="switchView('groups')">📊 Vòng Bảng</button>
        <button class="tab-btn" onclick="switchView('tree')">🌳 Sơ Đồ Đấu Loại</button>

    <script>
    const socket = io();
    let currentUser = localStorage.getItem('currentUser');
    // Nhận tín hiệu khi Server vừa tự động cập nhật lịch thi đấu
socket.on('tournamentUpdated', () => {
    console.log("Giải đấu vừa có cập nhật tự động từ Server...");
    loadTourney(); // Gọi hàm tải lại dữ liệu để cập nhật bảng điểm/nút bấm
});
    async function loadTourney() {
        const res = await fetch('/api/tournament/status');
        const tour = await res.json();
        
        const gameTitle = document.getElementById('game-title');
        const statusText = document.getElementById('tour-status-text');
        const joinBtn = document.getElementById('join-btn');

        if (tour.status === 'none' || !tour.status) {
            gameTitle.textContent = "Hiện chưa có giải đấu nào";
            statusText.textContent = "Bé hãy quay lại sau nhé!";
            joinBtn.style.display = 'none';
            return;
        }

        gameTitle.textContent = `Môn thi: ${tour.gameType.toUpperCase()}`;
        
        if (tour.status === 'open') {
            const deadline = new Date(tour.registrationDeadline);
            statusText.innerHTML = `
                <span class="status-badge status-open">Đang mở đăng ký</span><br>
                <p style="color:#f1c40f">⏰ Hạn chót: <b>${deadline.toLocaleString()}</b></p>
                <p>Số vận động viên: <b>${tour.participants.length}</b></p>
            `;            
            // VÁ LỖI: Kiểm tra nếu bé đã đăng ký
            if (tour.participants.includes(currentUser)) {
                joinBtn.style.display = 'none';
                statusText.innerHTML += "<br><br><b style='color:#3498db; font-size:1.3rem'>✅ Bé đã ghi danh thành công!</b><br>Hãy chờ Admin bắt đầu trận đấu nhé.";
            } else {
                joinBtn.style.display = 'inline-block';
            }
        } else if (tour.status === 'playing') {
            statusText.innerHTML = `<span class="status-badge status-playing">Trận đấu đang diễn ra</span>`;
            joinBtn.style.display = 'none';
            renderBrackets(tour);
        } else if (tour.status === 'finished') {
    statusText.innerHTML = `<span class="status-badge" style="background:#bdc3c7">Giải đấu đã kết thúc</span>`;
    joinBtn.style.display = 'none';
    
    // Hiển thị bảng vinh danh
    const modal = document.getElementById('victory-modal');
    if (modal.style.display === 'none') { // Chỉ nổ pháo hoa một lần khi vừa tải
        modal.style.display = 'flex';
        document.getElementById('top1-name').textContent = tour.winners.top1 || "Chưa rõ";
        document.getElementById('top2-name').textContent = tour.winners.top2 || "-";
        document.getElementById('top3-name').textContent = tour.winners.top3 || "-";
        
        // BẮT ĐẦU NỔ PHÁO HOA
        fireworks();
    }
}
        
    }
function fireworks() {
    var duration = 5 * 1000;
    var animationEnd = Date.now() + duration;
    var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };

    function randomInRange(min, max) { return Math.random() * (max - min) + min; }

    var interval = setInterval(function() {
        var timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        var particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
    }, 250);
}
// --- LOGIC HIỂN THỊ MỚI ---
function switchView(view) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    if(view === 'groups') {
        document.getElementById('group-stage-area').style.display = 'block';
        document.getElementById('knockout-tree-area').style.display = 'none';
    } else {
        document.getElementById('group-stage-area').style.display = 'none';
        document.getElementById('knockout-tree-area').style.display = 'flex';
    }
}

function renderBrackets(tour) {
    document.getElementById('bracket-view').style.display = 'block';
    const groupArea = document.getElementById('group-stage-area');
    const treeArea = document.getElementById('knockout-tree-area');
    
    groupArea.innerHTML = '';
    treeArea.innerHTML = '';

    // --- TRƯỜNG HỢP 1: VÒNG BẢNG (Có chia Tab A, B, C...) ---
    if (tour.phase === 'groups') {
        // 1. Tạo thanh điều hướng (Tabs)
        const navDiv = document.createElement('div');
        navDiv.className = 'group-nav';
        
        // 2. Tạo container chứa nội dung các bảng
        const contentDiv = document.createElement('div');
        
        let activeGroupIndex = 0; // Mặc định mở bảng đầu tiên

        tour.brackets.forEach((group, index) => {
            // Kiểm tra xem bé có nằm trong bảng này không
            if (group.members.includes(currentUser)) {
                activeGroupIndex = index;
            }

            // A. Tạo Nút Tab
            const btn = document.createElement('button');
            btn.className = 'group-tab-btn';
            btn.textContent = group.groupName;
            btn.onclick = () => openGroupTab(index);
            btn.id = `tab-btn-${index}`;
            navDiv.appendChild(btn);

            // B. Tạo Nội dung Bảng (Bị ẩn mặc định)
            const card = document.createElement('div');
            card.className = 'match-card group-content';
            card.id = `group-content-${index}`;
            card.style.display = 'none'; // Ẩn đi

            // --- Logic tính điểm bảng xếp hạng (Giữ nguyên) ---
            let stats = {};
            group.members.forEach(m => stats[m] = { p: 0, w: 0 });
            group.matches.forEach(m => {
                if(m.winner) { stats[m.winner].p += 3; stats[m.winner].w++; }
            });

            let html = `<h3 style="color:#e67e22; text-align:center; border-bottom:1px solid #ccc; padding-bottom:10px;">${group.groupName}</h3>
                        <table style="width:100%; text-align:center; margin-bottom:15px;">
                            <tr style="background:#dfe6e9; color:#2c3e50;"><th>Bé</th><th>Thắng</th><th>Điểm</th></tr>`;
            
            Object.entries(stats).sort((a,b) => b[1].p - a[1].p).forEach(([name, stat]) => {
                const isMe = name === currentUser;
                html += `<tr style="${isMe ? 'background:#eaf6ff; font-weight:bold; color:#2980b9' : ''}">
                            <td>${isMe ? '⭐ ' : ''}${name}</td>
                            <td>${stat.w}</td>
                            <td><b style="color:#2ecc71">${stat.p}</b></td>
                         </tr>`;
            });
            html += `</table><h4 style="margin-top:15px; color:#7f8c8d">📅 Lịch Thi Đấu:</h4>`;
            
            group.matches.forEach(m => { html += getMatchHtml(m, tour.gameType); });
            
            card.innerHTML = html;
            contentDiv.appendChild(card);
        });

        groupArea.appendChild(navDiv);
        groupArea.appendChild(contentDiv);

        // Kích hoạt bảng mặc định (Bảng có tên bé hoặc bảng A)
        openGroupTab(activeGroupIndex);
        switchView('groups');
    } 
    // --- TRƯỜNG HỢP 2: VÒNG LOẠI TRỰC TIẾP ---
    else {
        // ... (Giữ nguyên code vẽ sơ đồ cây ở câu trả lời trước) ...
        // Copy lại phần logic "else" của renderBrackets từ câu trả lời trước vào đây
        // (Phần vẽ cột round, match-node...)
        
        // (Dưới đây là tóm tắt để bạn dễ hình dung, hãy giữ nguyên phần Tree cũ)
        const matches = tour.brackets;
        let column = document.createElement('div');
        column.className = 'round';
        matches.forEach(m => {
             // ... logic vẽ node ...
             // (Copy lại đoạn tạo match-node từ câu trả lời trước)
             const node = document.createElement('div');
             // ...
             column.appendChild(node);
        });
        treeArea.appendChild(column);
        switchView('tree');
    }
}

// Hàm hỗ trợ chuyển Tab Bảng
function openGroupTab(index) {
    // 1. Ẩn tất cả nội dung, bỏ active tất cả nút
    document.querySelectorAll('.group-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.group-tab-btn').forEach(el => el.classList.remove('active'));

    // 2. Hiện nội dung được chọn
    const content = document.getElementById(`group-content-${index}`);
    const btn = document.getElementById(`tab-btn-${index}`);
    
    if(content && btn) {
        content.style.display = 'block';
        content.classList.add('fade-in'); // Thêm hiệu ứng hiện dần nếu thích
        btn.classList.add('active');
    }
}
// Hàm phụ trợ sinh HTML cho trận đấu dạng danh sách (Dùng cho vòng bảng)
function getMatchHtml(m, gameType) {
    const isMe = (m.p1 === currentUser || m.p2 === currentUser);
    const now = new Date();
    const start = new Date(m.startTime);
    const diff = (now - start) / 60000; 

    let statusLabel = `<span style="color:#95a5a6">${start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
    let actionBtn = ""; // Khởi tạo rỗng ở đây để tránh lỗi undefined

    if (m.winner) {
        statusLabel = `<b style="color:#27ae60">🏆 ${m.winner} thắng</b>`;
    } else if (diff > 10) {
        statusLabel = `<b style="color:#e74c3c">Hủy</b>`;
    } else if (diff >= 0) {
        statusLabel = `<b class="match-live" style="padding:2px 8px; border-radius:10px; color:#e67e22; border:1px solid #e67e22">🔥 LIVE</b>`;
        if (isMe) {
            actionBtn = `<button onclick="enterMatch('${gameType}', '${m.matchId}')" class="btn-play" style="padding:5px 15px; font-size:0.8rem; margin-left:10px;">Vào</button>`;
        }
    }

    return `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px dashed #ccc; ${isMe ? 'background:#fffbf0' : ''}">
            <div style="font-size:0.9rem; flex:1">
                ${m.p1} <b style="color:#e74c3c">vs</b> ${m.p2}
            </div>
            <div style="text-align:right; display: flex; align-items: center; justify-content: flex-end;">
                ${statusLabel} ${actionBtn}
            </div>
        </div>
    `;
}
// Hàm phụ trợ tạo Card trận đấu (để code gọn hơn)
function createMatchCard(m, tour) {
    const isMyMatch = (m.p1 === currentUser || m.p2 === currentUser);
    const card = document.createElement('div');
    card.className = 'match-card';
    
    const now = new Date();
    const startTime = new Date(m.startTime);
    const diffMs = now - startTime;
    const diffMins = diffMs / (1000 * 60); // Đổi ra phút

    let statusHtml = "";
    let canPlay = false;

    // Định dạng giờ hiển thị cho bé dễ xem
    const timeDisplay = startTime.toLocaleString('vi-VN', { 
        weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' 
    });

    if (m.winner) {
        statusHtml = `<b style="color:#27ae60">🏆 Kết thúc: ${m.winner} thắng</b>`;
    } else if (diffMins > 10) {
        // TRƯỜNG HỢP: QUÁ 10 PHÚT
        statusHtml = `<b style="color:#e74c3c">❌ Xử thua (Trễ quá 10 phút)</b>`;
        card.style.opacity = "0.5";
    } else if (diffMins >= 0 && diffMins <= 10) {
        // TRƯỜNG HỢP: ĐÚNG GIỜ (Trong khoảng 10 phút đầu)
        canPlay = true;
        statusHtml = isMyMatch ? 
            `<button class="btn-play" onclick="enterMatch('${tour.gameType}', '${m.matchId}')">⚡ VÀO ĐẤU NGAY</button>` : 
            `<b style="color:#e67e22">🔥 Đang thi đấu...</b>`;
    } else {
        // TRƯỜNG HỢP: CHƯA ĐẾN GIỜ
        statusHtml = `<span style="color:#7f8c8d">⏳ Sẽ đấu lúc: ${timeDisplay}</span>`;
    }

    card.innerHTML = `
        <div style="font-size:0.8rem; margin-bottom:5px;">📅 Lịch: ${timeDisplay}</div>
        <div class="vs-box">
            <span>${m.p1}</span> <span class="vs-badge">VS</span> <span>${m.p2}</span>
        </div>
        <div style="text-align:center; margin-top:10px;">${statusHtml}</div>
    `;
    return card;
}
    async function joinTourney() {
        const res = await fetch('/api/tournament/join', { method: 'POST' });
        const d = await res.json();
        alert(d.message);
        loadTourney(); // Tải lại để ẩn nút ngay lập tức
    }

    function enterMatch(gameType, matchId) {
        localStorage.setItem('joinTournamentRoom', matchId);
        const gameFiles = { 'chess': 'co-vua.html', 'caro': 'caro.html', 'go': 'co-vay.html', 'othello': 'othello.html' };
        location.href = gameFiles[gameType];
    }

    loadTourney();
    // Tự động cập nhật mỗi 5 giây để bé thấy đối thủ mới đăng ký hoặc kết quả trận đấu
    setInterval(loadTourney, 5000);
</script>

    <div id="podium-area" style="display:flex; align-items:flex-end; gap:20px; margin:40px 0;">
