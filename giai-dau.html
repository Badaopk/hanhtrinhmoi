<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sân Vận Động Hành Tinh</title>
    <link rel="stylesheet" href="style.css">
<style>
    body.tournament-bg {
        background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
        color: white; font-family: 'Baloo 2', cursive;
        min-height: 100vh; margin: 0; padding: 20px;
    }
    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 25px; padding: 30px;
        max-width: 800px; margin: 20px auto;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    h1 { font-size: 3rem; text-shadow: 0 0 20px #f1c40f; color: #f1c40f; margin-bottom: 30px; }
    
    /* Giao diện Card trận đấu */
    .match-card {
        background: linear-gradient(135deg, #ffffff 0%, #f1f2f6 100%);
        border-radius: 20px; padding: 20px; margin: 15px 0;
        color: #2c3e50; border-left: 10px solid #f1c40f;
        transition: 0.3s; position: relative; overflow: hidden;
    }
    .match-card:hover { transform: scale(1.02); box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3); }
    .match-header { font-size: 0.9rem; color: #7f8c8d; font-weight: bold; margin-bottom: 10px; }
    
    .vs-box { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 1.4rem; font-weight: 800; }
    .player-name { flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #eee; }
    .vs-badge { background: #e74c3c; color: white; padding: 5px 12px; border-radius: 50%; font-size: 0.8rem; }
    
    .btn-play {
        background: linear-gradient(to bottom, #2ecc71, #27ae60);
        color: white; border: none; padding: 12px 30px;
        border-radius: 50px; cursor: pointer; font-weight: bold;
        font-size: 1.1rem; box-shadow: 0 5px 0 #1e8449; margin-top: 15px;
    }
    .btn-play:active { transform: translateY(3px); box-shadow: none; }

    .status-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-top: 10px; }
    .status-open { background: #2ecc71; color: white; }
    .status-playing { background: #e67e22; color: white; }
</style>
    </head>
<body class="tournament-bg">
    <h1>🏆 GIẢI ĐẤU HÀNH TINH 🏆</h1>

    <div class="container" id="info-box">
        <h2 id="game-title" style="margin-top:0">Đang kiểm tra giải đấu...</h2>
        <div id="tour-status-area">
            <p id="tour-status-text" style="font-size: 1.2rem;"></p>
            <button id="join-btn" class="btn-play" style="display:none" onclick="joinTourney()">🚀 ĐĂNG KÝ THAM GIA</button>
        </div>
    </div>

    <div class="container" id="bracket-view" style="display:none">
        <h2 style="color:#3498db">📅 LỊCH THI ĐẤU CỦA BÉ</h2>
        <div id="match-list"></div>
    </div>
<script>
    let currentUser = localStorage.getItem('currentUser');

    async function loadTourney() {
        const res = await fetch('/api/tournament/status');
        const tour = await res.json();
        
        const gameTitle = document.getElementById('game-title');
        const statusText = document.getElementById('tour-status-text');
        const joinBtn = document.getElementById('join-btn');

        if (tour.status === 'none' || !tour.status) {
            gameTitle.textContent = "Hiện chưa có giải đấu nào";
            statusText.textContent = "Bé hãy quay lại sau nhé!";
            joinBtn.style.display = 'none';
            return;
        }

        gameTitle.textContent = `Môn thi: ${tour.gameType.toUpperCase()}`;
        
        if (tour.status === 'open') {
            statusText.innerHTML = `<span class="status-badge status-open">Đang mở đăng ký</span><br><br>Số vận động viên: <b>${tour.participants.length}</b>`;
            
            // VÁ LỖI: Kiểm tra nếu bé đã đăng ký
            if (tour.participants.includes(currentUser)) {
                joinBtn.style.display = 'none';
                statusText.innerHTML += "<br><br><b style='color:#3498db; font-size:1.3rem'>✅ Bé đã ghi danh thành công!</b><br>Hãy chờ Admin bắt đầu trận đấu nhé.";
            } else {
                joinBtn.style.display = 'inline-block';
            }
        } else if (tour.status === 'playing') {
            statusText.innerHTML = `<span class="status-badge status-playing">Trận đấu đang diễn ra</span>`;
            joinBtn.style.display = 'none';
            renderBrackets(tour);
        }
    }

    function renderBrackets(tour) {
        const view = document.getElementById('bracket-view');
        const list = document.getElementById('match-list');
        view.style.display = 'block';
        list.innerHTML = '';

        let allMatches = [];
        if (tour.format === 'group') {
            if (tour.brackets) {
                tour.brackets.forEach(group => {
                    if (group.matches) allMatches.push(...group.matches);
                });
            }
        } else {
            allMatches = tour.brackets || [];
        }

        if (allMatches.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:20px;">Đang cập nhật lịch thi đấu...</div>';
            return;
        }

        allMatches.forEach((m, index) => {
            const isMyMatch = (m.p1 === currentUser || m.p2 === currentUser);
            const card = document.createElement('div');
            card.className = 'match-card';
            if (isMyMatch) card.style.borderLeftColor = '#2ecc71';

            let actionHtml = '';
            if (m.winner) {
                actionHtml = `<div style="color:#27ae60; font-weight:800; font-size:1.2rem; margin-top:10px;">🏆 THẮNG CUỘC: ${m.winner}</div>`;
            } else if (isMyMatch) {
                actionHtml = `<button class="btn-play" onclick="enterMatch('${tour.gameType}', '${m.matchId}')">⚡ VÀO ĐẤU NGAY</button>`;
            } else {
                actionHtml = `<div style="color:#bdc3c7; margin-top:10px;">⏳ Trận đấu đang chờ...</div>`;
            }

            card.innerHTML = `
                <div class="match-header">TRẬN SỐ ${index + 1} • ⏱️ ${tour.matchDuration} PHÚT</div>
                <div class="vs-box">
                    <div class="player-name" style="${m.winner === m.p1 ? 'background:#f1c40f; border:2px solid #d35400' : ''}">${m.p1}</div>
                    <div class="vs-badge">VS</div>
                    <div class="player-name" style="${m.winner === m.p2 ? 'background:#f1c40f; border:2px solid #d35400' : ''}">${m.p2}</div>
                </div>
                <div style="text-align:center">${actionHtml}</div>
            `;
            list.appendChild(card);
        });
    }

    async function joinTourney() {
        const res = await fetch('/api/tournament/join', { method: 'POST' });
        const d = await res.json();
        alert(d.message);
        loadTourney(); // Tải lại để ẩn nút ngay lập tức
    }

    function enterMatch(gameType, matchId) {
        localStorage.setItem('joinTournamentRoom', matchId);
        const gameFiles = { 'chess': 'co-vua.html', 'caro': 'caro.html', 'go': 'co-vay.html', 'othello': 'othello.html' };
        location.href = gameFiles[gameType];
    }

    loadTourney();
    // Tự động cập nhật mỗi 5 giây để bé thấy đối thủ mới đăng ký hoặc kết quả trận đấu
    setInterval(loadTourney, 5000);
</script>
    </body>
</html>
