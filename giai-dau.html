<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Giải Đấu Hành Tinh</title><link rel="stylesheet" href="modern-ui.css"><script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#071226;--panel:#101f3b;--line:#28406b;--gold:#ffd65b;--blue:#4b7cff;--green:#24c887;--red:#ff6577;--text:#f5f8ff;--muted:#9fb0d0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0,#1b3563,#071226 55%);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}.top{max-width:1250px;margin:auto;padding:22px 18px 10px;display:flex;align-items:center;gap:14px}.home{color:white;text-decoration:none;background:#ffffff18;border:1px solid #ffffff2d;border-radius:13px;padding:10px 14px;font-weight:800}.top h1{margin:0;flex:1;font-size:clamp(1.45rem,4vw,2.4rem);color:var(--gold);text-shadow:0 0 22px #ffd65b55}.refresh{border:0;border-radius:12px;padding:10px 14px;background:#31598f;color:white;font-weight:800;cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:14px 18px 40px}.hero,.panel{background:linear-gradient(145deg,#122544ee,#0c1932ee);border:1px solid #2d4775;border-radius:22px;box-shadow:0 18px 55px #0005}.hero{padding:24px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}.hero h2{margin:0 0 8px;font-size:clamp(1.4rem,4vw,2.2rem)}.hero p{color:var(--muted);margin:6px 0}.badge{display:inline-block;padding:7px 12px;border-radius:999px;font-weight:900}.open{background:#24c88725;color:#66e8b3;border:1px solid #24c887}.playing{background:#ffb12f22;color:#ffd574;border:1px solid #ffb12f}.finished{background:#6d7d9c2d;color:#cad5e9;border:1px solid #6d7d9c}.join{border:0;border-radius:15px;padding:14px 22px;background:linear-gradient(135deg,#24c887,#0da368);color:white;font-size:1.05rem;font-weight:900;cursor:pointer;box-shadow:0 8px 24px #24c88733}.join:disabled{opacity:.55;cursor:not-allowed}.metrics{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:10px;margin-top:16px}.metric{background:#ffffff0b;border:1px solid #ffffff17;border-radius:15px;padding:12px}.metric small{display:block;color:var(--muted)}.metric b{display:block;font-size:1.2rem;margin-top:4px}.panel{padding:20px;margin-top:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #365281;background:#132744;color:#b9c8e4;border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer}.tab.active{background:var(--blue);color:white;border-color:var(--blue)}.section{display:none}.section.active{display:block}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.group{border:1px solid var(--line);border-radius:18px;background:#0d1b34;padding:15px}.group h3{margin:0 0 12px;color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid #23385f}th{color:#92a7cc}.matches{display:grid;gap:10px;margin-top:13px}.match{border:1px solid #29436f;border-radius:15px;padding:13px;background:#122341;position:relative}.match.mine{border-color:#5b8cff;box-shadow:0 0 0 2px #4b7cff35}.match.live{border-color:#ffb12f}.match.done{border-color:#24c88766}.match-head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.82rem}.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:11px 0;font-weight:850}.players span:first-child{text-align:right}.vs{background:#e9485e;color:white;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:.72rem}.winner{color:#62e4ae}.enter{display:block;width:100%;border:0;border-radius:11px;padding:9px;background:#315fe9;color:white;font-weight:900;cursor:pointer}.enter:disabled{background:#3b465d;color:#8492ae}.rounds{display:flex;gap:16px;overflow:auto;padding:8px 2px 18px}.round{min-width:285px}.round h3{text-align:center;color:var(--gold)}.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:28px 0}.place{width:min(200px,29vw);text-align:center;background:#172b4c;border:1px solid #36517b;border-radius:18px 18px 8px 8px;padding:15px 8px}.place.one{height:180px;border-color:var(--gold)}.place.two{height:145px}.place.three{height:120px}.place .medal{font-size:2rem}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#1b2e50;color:#c6d3e8;margin-bottom:12px}.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#172033;padding:13px 18px;border-radius:13px;box-shadow:0 15px 45px #0007;z-index:100}.hidden{display:none!important}@media(max-width:650px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.top{padding-top:14px}.top h1{font-size:1.35rem}.panel{padding:13px}.groups{grid-template-columns:1fr}.players{font-size:.88rem}}
</style></head>
<body><header class="top"><a class="home" href="index.html">← Trang chủ</a><h1>🏆 Giải Đấu Hành Tinh</h1><button class="refresh" id="refresh">↻ Cập nhật</button></header><main class="wrap"><section class="hero"><div><span id="status-badge" class="badge">Đang tải</span><h2 id="game-title">Kiểm tra giải đấu...</h2><p id="status-text"></p><div class="metrics"><div class="metric"><small>Người tham gia</small><b id="participants">0</b></div><div class="metric"><small>Thời lượng trận</small><b id="duration">–</b></div><div class="metric"><small>Giai đoạn</small><b id="phase">–</b></div><div class="metric"><small>Trận của bạn</small><b id="my-count">0</b></div></div></div><button id="join" class="join hidden">🚀 Đăng ký tham gia</button></section><section class="panel" id="content-panel"><div class="tabs"><button class="tab active" data-tab="mine">Lịch của tôi</button><button class="tab" data-tab="groups">Vòng bảng</button><button class="tab" data-tab="knockout">Đấu loại</button><button class="tab" data-tab="history">Các vòng trước</button><button class="tab" data-tab="podium">Vinh danh</button></div><div id="mine" class="section active"></div><div id="groups" class="section"></div><div id="knockout" class="section"></div><div id="history" class="section"></div><div id="podium" class="section"></div></section></main><div id="toast" class="toast hidden"></div>
<script>
(()=>{'use strict';const socket=io();let tour=null;const user=localStorage.getItem('currentUser')||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function gameName(type){return({chess:'Cờ Vua',caro:'Cờ Caro',go:'Cờ Vây',othello:'Othello'})[type]||type||'Chưa có'}function gameUrl(type){return({chess:'co-vua.html',caro:'caro.html',go:'co-vay.html',othello:'othello.html'})[type]||'choi-co.html'}function allMatches(t){return(t.brackets||[]).flatMap(e=>Array.isArray(e.matches)?e.matches:[e]).filter(Boolean)}function mine(t){return allMatches(t).filter(m=>m.p1===user||m.p2===user)}function formatTime(v){if(!v)return'Chưa xếp lịch';return new Date(v).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}function matchStatus(m){if(m.winner)return'Đã xong';if(m.status==='live')return'Đang đấu';return'Sắp diễn ra'}function canEnter(m){if(m.winner||!(m.p1===user||m.p2===user))return false;const start=new Date(m.startTime).getTime();return Date.now()>=start-30*60000&&Date.now()<=start+(Number(tour.matchDuration||20)+90)*60000}
function matchCard(m){const div=document.createElement('article');div.className=`match ${m.p1===user||m.p2===user?'mine':''} ${m.status==='live'?'live':''} ${m.winner?'done':''}`;const p1win=m.winner===m.p1,p2win=m.winner===m.p2;div.innerHTML=`<div class="match-head"><span>${esc(m.matchId)}</span><span>${formatTime(m.startTime)} • ${matchStatus(m)}</span></div><div class="players"><span class="${p1win?'winner':''}">${esc(m.p1||'Chờ')}</span><i class="vs">VS</i><span class="${p2win?'winner':''}">${esc(m.p2||'Chờ')}</span></div>${m.winner?`<div class="notice">🏅 Thắng: <b>${esc(m.winner)}</b>${m.resultSource?` • ${esc(m.resultSource)}`:''}</div>`:''}`;if(m.p1===user||m.p2===user){const b=document.createElement('button');b.className='enter';b.disabled=!canEnter(m);b.textContent=m.winner?'Trận đã kết thúc':canEnter(m)?'Vào phòng thi đấu':`Mở trước giờ đấu 30 phút`;b.onclick=()=>location.href=`${gameUrl(tour.gameType)}?room=${encodeURIComponent(m.matchId)}&tournament=1`;div.append(b)}return div}
function renderMine(){const wrap=$('mine'),items=mine(tour);wrap.replaceChildren();if(!user){wrap.innerHTML='<div class="empty">Hãy đăng nhập để xem lịch cá nhân.</div>';return}if(!items.length){wrap.innerHTML='<div class="empty">Bạn chưa có trận trong vòng hiện tại.</div>';return}const box=document.createElement('div');box.className='matches';items.forEach(m=>box.append(matchCard(m)));wrap.append(box)}
function renderGroups(){const wrap=$('groups');wrap.replaceChildren();if(tour.phase!=='groups'&&!tour.history?.some(h=>h.phase==='groups')){wrap.innerHTML='<div class="empty">Không có vòng bảng trong giai đoạn hiện tại.</div>';return}const groups=tour.phase==='groups'?tour.brackets:(tour.history.find(h=>h.phase==='groups')?.brackets||[]);const grid=document.createElement('div');grid.className='groups';groups.forEach(group=>{const card=document.createElement('section');card.className='group';card.innerHTML=`<h3>${esc(group.groupName)}</h3>`;const standings=(tour.standings?.[group.groupName]||calculate(group));const table=document.createElement('table');table.innerHTML='<thead><tr><th>Hạng</th><th>Người chơi</th><th>Trận</th><th>Điểm</th></tr></thead><tbody>'+standings.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.player)}</td><td>${r.played}</td><td><b>${r.points}</b></td></tr>`).join('')+'</tbody>';card.append(table);const matches=document.createElement('div');matches.className='matches';(group.matches||[]).forEach(m=>matches.append(matchCard(m)));card.append(matches);grid.append(card)});wrap.append(grid)}function calculate(g){const rows={};(g.members||[]).forEach(p=>rows[p]={player:p,played:0,points:0});(g.matches||[]).forEach(m=>{if(!m.winner||!rows[m.p1]||!rows[m.p2])return;rows[m.p1].played++;rows[m.p2].played++;if(rows[m.winner])rows[m.winner].points+=3});return Object.values(rows).sort((a,b)=>b.points-a.points)}
function renderKnockout(){const wrap=$('knockout');wrap.replaceChildren();const rounds=[];(tour.history||[]).filter(h=>h.phase==='knockout').forEach(h=>rounds.push({name:`Vòng ${h.round}`,matches:(h.brackets||[])}));if(tour.phase==='knockout')rounds.push({name:`Vòng ${tour.round||1} hiện tại`,matches:tour.brackets||[]});if(!rounds.length){wrap.innerHTML='<div class="empty">Chưa có vòng đấu loại.</div>';return}const line=document.createElement('div');line.className='rounds';rounds.forEach(r=>{const col=document.createElement('section');col.className='round';col.innerHTML=`<h3>${esc(r.name)}</h3>`;const m=document.createElement('div');m.className='matches';r.matches.forEach(x=>m.append(matchCard(x)));col.append(m);line.append(col)});wrap.append(line)}
function renderHistory(){const wrap=$('history');wrap.replaceChildren();const hs=tour.history||[];if(!hs.length){wrap.innerHTML='<div class="empty">Chưa có vòng đấu đã hoàn thành.</div>';return}hs.forEach((h,i)=>{const d=document.createElement('div');d.className='notice';d.textContent=`${i+1}. ${h.phase==='groups'?'Vòng bảng':`Vòng loại ${h.round||''}`} — hoàn tất ${formatTime(h.completedAt)}`;wrap.append(d)})}
function renderPodium(){const w=tour.winners||{};$('podium').innerHTML=tour.status==='finished'?`<div class="podium"><div class="place two"><div class="medal">🥈</div><b>${esc(w.top2||'–')}</b><p>Á quân</p></div><div class="place one"><div class="medal">🥇</div><b>${esc(w.top1||'–')}</b><p>Quán quân</p></div><div class="place three"><div class="medal">🥉</div><b>${esc(w.top3||'–')}</b><p>Hạng ba</p></div></div>`:'<div class="empty">Bảng vinh danh sẽ mở khi giải kết thúc.</div>'}
function render(){if(!tour||tour.status==='none'){$('status-badge').className='badge finished';$('status-badge').textContent='Chưa có giải';$('game-title').textContent='Hiện chưa có giải đấu';$('status-text').textContent='Hãy quay lại sau.';$('content-panel').classList.add('hidden');return}$('content-panel').classList.remove('hidden');$('status-badge').className=`badge ${tour.status}`;$('status-badge').textContent=({open:'Đang mở đăng ký',playing:'Đang thi đấu',finished:'Đã kết thúc',cancelled:'Đã hủy'})[tour.status]||tour.status;$('game-title').textContent=`${gameName(tour.gameType)} — ${tour.format==='group'?'Vòng bảng':tour.format==='knockout'?'Loại trực tiếp':'Thể thức tự động'}`;$('status-text').textContent=tour.status==='open'?`Hạn đăng ký: ${formatTime(tour.registrationDeadline)}`:tour.status==='playing'?'Lịch được máy chủ xác thực; chỉ đúng vận động viên mới vào được phòng.':'Giải đã hoàn tất.';$('participants').textContent=(tour.participants||[]).length;$('duration').textContent=`${tour.matchDuration||20} phút`;$('phase').textContent=({registration:'Đăng ký',groups:'Vòng bảng',knockout:`Vòng ${tour.round||1}`,completed:'Hoàn tất'})[tour.phase]||tour.phase;$('my-count').textContent=mine(tour).length;const join=$('join');join.classList.toggle('hidden',tour.status!=='open'||(tour.participants||[]).includes(user));join.disabled=!user;join.textContent=user?'🚀 Đăng ký tham gia':'Đăng nhập để tham gia';renderMine();renderGroups();renderKnockout();renderHistory();renderPodium()}
async function load(){try{const r=await fetch('/api/tournament/status',{cache:'no-store'});tour=await r.json();render()}catch(e){toast('Không thể tải giải đấu.')}}$('join').onclick=async()=>{try{const r=await fetch('/api/tournament/join',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw new Error(d.message);toast(d.message);load()}catch(e){toast(e.message)}};$('refresh').onclick=load;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});socket.on('tournamentUpdated',load);socket.on('matchNotice',d=>toast(`${d.title}: ${d.message}`));load();setInterval(()=>{if(tour?.status==='playing')render()},30000);
})();
</script><script src="modern-ui.js"></script>
</body></html>
